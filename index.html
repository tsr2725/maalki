<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Maalki — Residential Property Management</title>

  <!-- Web App & Home Screen Metadata (iOS & Android) -->
  <meta name="application-name" content="Maalki" />
  <meta name="apple-mobile-web-app-title" content="Maalki" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#00A7E1" />

  <!-- Transparent #00A7E1 Vector Favicon -->
  <link id="favicon-svg" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 54h48M14 54V24L32 12l18 12v30M24 54V38h16v16' fill='none' stroke='%2300A7E1' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link id="favicon-png" rel="icon" type="image/png" sizes="64x64" href="" />
  <link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="" />
  <link id="web-manifest-link" rel="manifest" href="" />

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Dynamic Transparent #00A7E1 Favicon + iOS/Android Home Screen Icon Generator -->
  <script>
    (function setupMaalkiIcons() {
      function renderIconDataUrl(size, withBackground) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) return '';

        ctx.clearRect(0, 0, size, size);

        if (withBackground) {
          ctx.fillStyle = '#0D0E10';
          ctx.fillRect(0, 0, size, size);
        }

        const scale = size / 64;
        ctx.save();
        ctx.scale(scale, scale);
        ctx.strokeStyle = '#00A7E1';
        ctx.lineWidth = 5.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(8, 54);
        ctx.lineTo(56, 54);
        ctx.moveTo(14, 54);
        ctx.lineTo(14, 24);
        ctx.lineTo(32, 12);
        ctx.lineTo(50, 24);
        ctx.lineTo(50, 54);
        ctx.moveTo(24, 54);
        ctx.lineTo(24, 38);
        ctx.lineTo(40, 38);
        ctx.lineTo(40, 54);
        ctx.stroke();
        ctx.restore();

        return canvas.toDataURL('image/png');
      }

      try {
        const png64 = renderIconDataUrl(64, false);
        const png180 = renderIconDataUrl(180, true);
        const png192 = renderIconDataUrl(192, true);
        const png512 = renderIconDataUrl(512, true);

        const favPng = document.getElementById('favicon-png');
        const appleIcon = document.getElementById('apple-touch-icon');
        if (favPng && png64) favPng.href = png64;
        if (appleIcon && png180) appleIcon.href = png180;

        const manifestObj = {
          name: 'Maalki — Residential Property Manager',
          short_name: 'Maalki',
          description: 'Residential property management, inspections, multimedia logs, and encrypted sync.',
          start_url: './',
          display: 'standalone',
          background_color: '#0D0E10',
          theme_color: '#00A7E1',
          icons: [
            { src: png192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
            { src: png512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestLink = document.getElementById('web-manifest-link');
        if (manifestLink) manifestLink.href = URL.createObjectURL(manifestBlob);
      } catch (e) {
        // Fallback silently to inline SVG favicon
      }
    })();
  </script>

  <style>
    /* ========================================================================
       DESIGN TOKENS — STRICT MONOCHROME + #00A7E1 + AUTO DEVICE THEME
       ======================================================================== */
    :root {
      --accent: #00A7E1;
      --accent-hover: #008EC0;
      --accent-tint: rgba(0, 167, 225, 0.12);
      --accent-border: rgba(0, 167, 225, 0.42);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-canvas: #F5F6F8;
        --bg-surface: #FFFFFF;
        --bg-subtle: #ECEEF2;
        --bg-hover: #E4E7EC;
        --border-color: #DFE2E8;
        --border-strong: #C5CBD4;
        --text-primary: #111315;
        --text-secondary: #525866;
        --text-muted: #7C8391;
        --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
        --modal-backdrop: rgba(17, 19, 21, 0.58);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-canvas: #0D0E10;
        --bg-surface: #16181C;
        --bg-subtle: #202329;
        --bg-hover: #282C34;
        --border-color: #2A2D35;
        --border-strong: #3B404B;
        --text-primary: #F4F5F7;
        --text-secondary: #A1A7B3;
        --text-muted: #6E7582;
        --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.28);
        --modal-backdrop: rgba(0, 0, 0, 0.78);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      margin: 0;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (max-width: 640px) {
      .m-input {
        font-size: 16px !important; /* Prevents iOS Safari auto-zoom on input focus */
      }
    }

    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    .m-canvas { background-color: var(--bg-canvas); }
    .m-surface {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-card);
    }
    .m-subtle {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
    }
    .m-border { border-color: var(--border-color); }
    .m-text { color: var(--text-primary); }
    .m-text-sec { color: var(--text-secondary); }
    .m-text-muted { color: var(--text-muted); }

    .btn-accent {
      background-color: var(--accent);
      color: #FFFFFF;
      font-weight: 600;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .btn-accent:hover { background-color: var(--accent-hover); }
    .btn-accent:active { transform: scale(0.99); }

    .btn-ghost {
      background-color: var(--bg-subtle);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      font-weight: 500;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-ghost:hover {
      background-color: var(--bg-hover);
      border-color: var(--border-strong);
    }

    .pill-accent {
      background-color: var(--accent-tint);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }

    .nav-item-active {
      background-color: var(--accent-tint);
      color: var(--accent);
      border-color: var(--accent-border);
      font-weight: 600;
    }

    .m-input {
      width: 100%;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 0.625rem;
      padding: 0.55rem 0.75rem;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .m-input:focus {
      border-color: var(--accent);
    }

    .dropzone-area {
      border: 1.5px dashed var(--border-strong);
      background-color: var(--bg-canvas);
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .dropzone-area.drag-over {
      border-color: var(--accent);
      background-color: var(--accent-tint);
    }

    @keyframes pulse-rec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .rec-dot {
      animation: pulse-rec 1.1s infinite ease-in-out;
    }

    /* ========================================================================
       A4 PRINT / SAVE AS PDF STYLESHEET
       ======================================================================== */
    @media print {
      @page {
        size: A4 portrait;
        margin: 14mm 14mm 16mm 14mm;
      }
      html, body {
        background: #FFFFFF !important;
        color: #111315 !important;
        font-size: 10.5pt;
      }
      #app-shell, #modal-root, #lightbox-root, #toast-root, #login-screen {
        display: none !important;
      }
      #print-document-root {
        display: block !important;
        position: static !important;
        width: 100% !important;
        background: #FFFFFF !important;
        color: #111315 !important;
      }
      .print-avoid-break {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .print-page-break {
        break-before: page;
        page-break-before: always;
      }
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-[#00A7E1] selection:text-white">

          </div>

        <form id="device-login-form" class="p-5 sm:p-6 space-y-5 text-sm">

            <!-- New User First Name & Last Name Boxes -->

              </div>

    <!-- Main Workspace Area -->
    <main class="flex-1 md:pl-64">
      <!-- Desktop Top Context Bar -->
      <div class="hidden md:flex items-center justify-between px-8 py-4 border-b m-border m-surface sticky top-0 z-10">
        <div>
          <h1 id="desktop-page-title" class="text-xl font-bold tracking-tight">Dashboard</h1>
          <p id="desktop-page-desc" class="text-xs m-text-muted mt-0.5">Portfolio overview, rent status, and upcoming tasks</p>

    /**
     * ==========================================================================
     * 1. MAALKI CRYPTO ENGINE (PBKDF2-SHA256 + AES-256-GCM)
     * Zero plaintext tokens or property files ever leave the browser.
     * ==========================================================================
     */
    const MaalkiCrypto = (() => {
      const encoder = new TextEncoder();
      const decoder = new TextDecoder();
      const keyCache = new Map();

      function bytesToBase64(uint8) {
        let binary = '';
        const chunkSize = 0x8000;
        for (let i = 0; i < uint8.length; i += chunkSize) {
          const chunk = uint8.subarray(i, i + chunkSize);
          binary += String.fromCharCode.apply(null, chunk);
        }
        return btoa(binary);
      }

      function base64ToBytes(b64) {
        const clean = (b64 || '').replace(/\s+/g, '');
        const binary = atob(clean);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      function utf8ToBase64(str) {
        return bytesToBase64(encoder.encode(str));
      }

      function base64ToUtf8(b64) {
        return decoder.decode(base64ToBytes(b64));
      }

      async function deriveAesKey(passphrase, saltBytes, iterations = 250000) {
        const cacheKey = `${passphrase}::${bytesToBase64(saltBytes)}::${iterations}`;
        if (keyCache.has(cacheKey)) {
          return keyCache.get(cacheKey);
        }
        const baseKey = await crypto.subtle.importKey(
          'raw',
          encoder.encode(passphrase),
          'PBKDF2',
          false,
          ['deriveKey']
        );
        const aesKey = await crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: saltBytes,
            iterations,
            hash: 'SHA-256'
          },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
        keyCache.set(cacheKey, aesKey);
        return aesKey;
      }

      async function encryptObject(plainObj, passphrase) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveAesKey(passphrase, salt, 250000);
        const plaintext = encoder.encode(JSON.stringify(plainObj));
        const cipherBuffer = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv },
          key,
          plaintext
        );
        return {
          v: 1,
          app: 'Maalki',
          alg: 'AES-256-GCM',
          kdf: 'PBKDF2-SHA256',
          iter: 250000,
          salt: bytesToBase64(salt),
          iv: bytesToBase64(iv),
          ct: bytesToBase64(new Uint8Array(cipherBuffer))
        };
      }

      async function decryptObject(envelope, passphrase) {
        if (!envelope || envelope.alg !== 'AES-256-GCM') {
          throw new Error('Unsupported encrypted envelope format.');
        }
        const salt = base64ToBytes(envelope.salt);
        const iv = base64ToBytes(envelope.iv);
        const ct = base64ToBytes(envelope.ct);
        const key = await deriveAesKey(passphrase, salt, envelope.iter || 250000);
        try {
          const plainBuffer = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv },
            key,
            ct
          );
          return JSON.parse(decoder.decode(plainBuffer));
        } catch (e) {
          throw new Error('Incorrect vault passphrase.');
        }
      }

      async function packTokenString(tokenPayload, passphrase) {
        const envelope = await encryptObject(tokenPayload, passphrase);
        return 'mkenc1.' + utf8ToBase64(JSON.stringify(envelope));
      }

      async function unpackTokenString(packedString, passphrase) {
        const raw = (packedString || '').trim();
        if (!raw.startsWith('mkenc1.')) {
          throw new Error('Invalid encrypted vault key format.');
        }
        const jsonStr = base64ToUtf8(raw.slice(7));
        const envelope = JSON.parse(jsonStr);
        return decryptObject(envelope, passphrase);
      }

      function generatePassphrase() {
        const words = [
          'harbour', 'timber', 'cobalt', 'granite', 'summit', 'cedar',
          'beacon', 'ridge', 'quartz', 'anchor', 'falcon', 'haven',
          'solstice', 'atlas', 'ember', 'horizon', 'breeze', 'meridian'
        ];
        const rnd = crypto.getRandomValues(new Uint32Array(4));
        const w1 = words[rnd[0] % words.length];
        const w2 = words[rnd[1] % words.length];
        const w3 = words[rnd[2] % words.length];
        const num = 1000 + (rnd[3] % 9000);
        return `${w1}-${w2}-${num}-${w3}`;
      }

      return {
        encryptObject,
        decryptObject,
        packTokenString,
        unpackTokenString,
        generatePassphrase,
        utf8ToBase64,
        base64ToUtf8
      };
    })();

    /**
     * ==========================================================================
     * 2. SUB-2-SECOND ENCRYPTED GITHUB CLOUD SYNC ENGINE
     * ==========================================================================
     */
    const MaalkiGitHubSync = (() => {
      const SYNC_CFG_KEY = 'maalki_gh_sync_cfg_v1';
      const DEVICE_ID_KEY = 'maalki_device_id_v1';
      const MANIFEST_PATH = 'maalki/manifest.enc.json';
      const POLL_INTERVAL_MS = 1500;
      const PUSH_DEBOUNCE_MS = 350;

      let deviceId = localStorage.getItem(DEVICE_ID_KEY);
      if (!deviceId) {
        deviceId = 'dev_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        localStorage.setItem(DEVICE_ID_KEY, deviceId);
      }

      let cfg = {
        enabled: false,
        token: '',
        owner: '',
        repo: 'maalki-vault',
        branch: 'main',
        passphrase: ''
      };

      try {
        const saved = sessionStorage.getItem(SYNC_CFG_KEY);
        if (saved) cfg = { ...cfg, ...JSON.parse(saved) };
      } catch (e) { /* ignore */ }

      let pollTimer = null;
      let pushTimer = null;
      let isPushing = false;
      let isPulling = false;
      let pushQueued = false;
      let suppressSchedule = false;
      let localRevision = 0;
      let lastManifestETag = null;
      let lastSyncTime = null;
      let lastLatencyMs = null;
      let syncHealth = 'off'; // 'off' | 'live' | 'syncing' | 'error'
      let lastErrorMsg = '';
      let repoIsEmpty = false;

      const shaCache = new Map();
      const pendingMediaIds = new Set();
      const pendingDossierIds = new Set();

      function saveCfg() {
        try {
          sessionStorage.setItem(SYNC_CFG_KEY, JSON.stringify(cfg));
        } catch (e) { /* ignore */ }
      }

      function updateSyncIndicators() {
        const sbDot = document.getElementById('sidebar-gh-dot');
        const sbStatus = document.getElementById('sidebar-gh-status');
        const sbSub = document.getElementById('sidebar-gh-sub');
        const mbDot = document.getElementById('mobile-gh-dot');
        const mbBadge = document.getElementById('mobile-gh-badge');
        const tbDot = document.getElementById('topbar-gh-dot');
        const tbText = document.getElementById('topbar-gh-text');

        if (!cfg.enabled || !cfg.token) {
          [sbDot, mbDot, tbDot].forEach(el => {
            if (el) el.style.backgroundColor = '#7C8391';
          });
          if (sbStatus) sbStatus.textContent = 'GitHub Sync: Off';
          if (sbSub) sbSub.textContent = 'Encrypted Repo Disconnected';
          if (mbBadge) mbBadge.textContent = 'Sync Off';
          if (tbText) tbText.textContent = 'GitHub Sync: Off';
          return;
        }

        const color = syncHealth === 'error' ? '#EF4444' : '#00A7E1';
        [sbDot, mbDot, tbDot].forEach(el => {
          if (el) el.style.backgroundColor = color;
        });

        const statusLabel = syncHealth === 'error'
          ? 'Sync Error'
          : syncHealth === 'syncing'
          ? 'Syncing…'
          : `Live (${lastLatencyMs ? lastLatencyMs + 'ms' : '<2s'})`;

        if (sbStatus) sbStatus.textContent = `GitHub: ${statusLabel}`;
        if (sbSub) sbSub.textContent = syncHealth === 'error'
          ? (lastErrorMsg || 'Check GitHub Sync details')
          : `${cfg.owner}/${cfg.repo} • Encrypted`;
        if (mbBadge) mbBadge.textContent = syncHealth === 'error'
          ? 'Sync Err'
          : syncHealth === 'syncing'
          ? 'Sync…'
          : 'Live';
        if (tbText) tbText.textContent = syncHealth === 'error'
          ? `GitHub Sync Error: ${lastErrorMsg || 'Click to inspect'} • ${cfg.owner}/${cfg.repo}`
          : `GitHub Sync: ${statusLabel} • ${cfg.owner}/${cfg.repo} (AES-256)`;
      }

      function formatGitHubError(status, rawMessage) {
        if (status === 401) {
          return 'GitHub Token rejected (401 Unauthorized). Check that your Classic Token has not expired.';
        }
        if (status === 403) {
          return `GitHub access denied (403): ${rawMessage || 'Ensure your Classic Token has the full "repo" scope enabled.'}`;
        }
        if (status === 404) {
          return `Repository "${cfg.owner}/${cfg.repo}" or branch "${cfg.branch}" not found (404). Verify token "repo" scope.`;
        }
        return rawMessage || `GitHub HTTP ${status}`;
      }

      async function ghRequest(endpoint, options = {}) {
        const headers = {
          'Authorization': `Bearer ${cfg.token}`,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
          ...(options.headers || {})
        };
        if (options.body && !headers['Content-Type']) {
          headers['Content-Type'] = 'application/json';
        }
        return fetch(`https://api.github.com${endpoint}`, {
          ...options,
          cache: 'no-store',
          headers
        });
      }

      async function verifyToken(token) {
        const res = await fetch('https://api.github.com/user', {
          headers: {
            'Authorization': `Bearer ${token.trim()}`,
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          }
        });
        if (!res.ok) {
          throw new Error(`GitHub authentication failed (${res.status}). Check your Classic Token.`);
        }
        const data = await res.json();
        const scopes = res.headers.get('X-OAuth-Scopes') || '';
        return { login: data.login, scopes };
      }

      async function createPrivateRepo(token, repoName) {
        const res = await fetch('https://api.github.com/user/repos', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token.trim()}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28'
          },
          body: JSON.stringify({
            name: repoName.trim(),
            description: 'Maalki End-to-End Encrypted Property Vault',
            private: true,
            auto_init: true
          })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || `Could not create repo (${res.status})`);
        }
        return res.json();
      }

      async function ensureRepositoryReady() {
        const repoRes = await ghRequest(`/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`, {
          method: 'GET'
        });

        if (repoRes.status === 404) {
          const created = await createPrivateRepo(cfg.token, cfg.repo);
          cfg.branch = created.default_branch || cfg.branch || 'main';
          repoIsEmpty = false;
          saveCfg();
          await new Promise(r => setTimeout(r, 900));
          return;
        }

        if (!repoRes.ok) {
          const errData = await repoRes.json().catch(() => ({}));
          throw new Error(formatGitHubError(repoRes.status, errData.message));
        }

        const repoData = await repoRes.json();
        if (repoData.default_branch && (!cfg.branch || cfg.branch === 'main')) {
          cfg.branch = repoData.default_branch;
          saveCfg();
        }
        repoIsEmpty = Number(repoData.size || 0) === 0;
      }

      async function getRemoteFile(path, useETag = false) {
        const reqHeaders = {};
        if (useETag && path === MANIFEST_PATH && lastManifestETag) {
          reqHeaders['If-None-Match'] = lastManifestETag;
        }
        const encodedPath = path.split('/').map(encodeURIComponent).join('/');
        const branchQuery = repoIsEmpty ? '' : `?ref=${encodeURIComponent(cfg.branch)}`;
        const res = await ghRequest(`/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodedPath}${branchQuery}`, {
          method: 'GET',
          headers: reqHeaders
        });

        if (res.status === 304) {
          return { notModified: true };
        }
        if (res.status === 404) {
          return { notFound: true };
        }
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(formatGitHubError(res.status, errData.message));
        }

        const etag = res.headers.get('ETag');
        if (path === MANIFEST_PATH && etag) {
          lastManifestETag = etag;
        }

        const data = await res.json();
        if (data && data.sha) {
          shaCache.set(path, data.sha);
        }

        let rawContent = data.content || '';
        if (!rawContent && data.sha) {
          const blobRes = await ghRequest(`/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/git/blobs/${data.sha}`);
          if (blobRes.ok) {
            const blobData = await blobRes.json();
            rawContent = blobData.content || '';
          }
        }

        const text = MaalkiCrypto.base64ToUtf8(rawContent);
        const envelope = JSON.parse(text);
        return { envelope, sha: data.sha };
      }

      async function putEncryptedFile(path, plainObj, commitMessage) {
        const envelope = await MaalkiCrypto.encryptObject(plainObj, cfg.passphrase);
        const jsonStr = JSON.stringify(envelope);
        const b64Content = MaalkiCrypto.utf8ToBase64(jsonStr);
        const encodedPath = path.split('/').map(encodeURIComponent).join('/');

        let knownSha = shaCache.get(path);
        if (!knownSha && !repoIsEmpty) {
          const existing = await getRemoteFile(path, false).catch(() => ({ notFound: true }));
          if (existing && existing.sha) knownSha = existing.sha;
        }

        const body = {
          message: commitMessage,
          content: b64Content
        };
        if (!repoIsEmpty && cfg.branch) {
          body.branch = cfg.branch;
        }
        if (knownSha) body.sha = knownSha;

        let res = await ghRequest(`/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodedPath}`, {
          method: 'PUT',
          body: JSON.stringify(body)
        });

        if (res.status === 409 || res.status === 422) {
          const latest = await getRemoteFile(path, false).catch(() => null);
          if (latest && latest.sha) {
            body.sha = latest.sha;
            res = await ghRequest(`/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodedPath}`, {
              method: 'PUT',
              body: JSON.stringify(body)
            });
          } else if (body.branch) {
            delete body.branch;
            res = await ghRequest(`/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodedPath}`, {
              method: 'PUT',
              body: JSON.stringify(body)
            });
          }
        }

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(formatGitHubError(res.status, errData.message));
        }

        repoIsEmpty = false;
        const saved = await res.json();
        if (saved?.content?.sha) {
          shaCache.set(path, saved.content.sha);
        }
        if (path === MANIFEST_PATH) {
          lastManifestETag = null;
        }
        return saved;
      }

      function schedulePush(options = {}) {
        if (!cfg.enabled || !cfg.token || !cfg.passphrase || suppressSchedule) return;
        if (options.mediaId) pendingMediaIds.add(options.mediaId);
        if (options.dossierPropertyId) pendingDossierIds.add(options.dossierPropertyId);

        if (pushTimer) clearTimeout(pushTimer);
        pushTimer = setTimeout(() => {
          pushNow(false);
        }, PUSH_DEBOUNCE_MS);
      }

      async function pushNow(fullMediaSync = false) {
        if (!cfg.enabled || !cfg.token || !cfg.passphrase) return;
        if (isPushing) {
          pushQueued = true;
          return;
        }
        isPushing = true;
        const t0 = performance.now();
        syncHealth = 'syncing';
        updateSyncIndicators();

        try {
          const allMedia = MaalkiMediaStore.getAllMedia();
          const mediaToUpload = fullMediaSync
            ? allMedia
            : allMedia.filter(m => pendingMediaIds.has(m.id));

          for (const item of mediaToUpload) {
            await putEncryptedFile(
              `maalki/media/${item.id}.enc.json`,
              item,
              `Sync encrypted media ${item.id}`
            );
            pendingMediaIds.delete(item.id);
          }

          const allDossiers = MaalkiMediaStore.getAllDossiers();
          const dossiersToUpload = fullMediaSync
            ? allDossiers
            : allDossiers.filter(d => pendingDossierIds.has(d.propertyId));

          for (const dossier of dossiersToUpload) {
            await putEncryptedFile(
              `maalki/properties/${dossier.fileName}.enc.json`,
              dossier,
              `Sync encrypted property dossier ${dossier.fileName}`
            );
            pendingDossierIds.delete(dossier.propertyId);
          }

          localRevision = Date.now();
          const manifestPayload = {
            revision: localRevision,
            deviceId,
            updatedAt: new Date().toISOString(),
            state: appState,
            mediaCatalog: allMedia.map(m => ({
              id: m.id,
              kind: m.kind,
              sizeBytes: m.sizeBytes,
              pinned: m.pinned,
              createdAt: m.createdAt
            })),
            dossierCatalog: allDossiers.map(d => ({
              propertyId: d.propertyId,
              fileName: d.fileName,
              archived: d.archived,
              updatedAt: d.updatedAt
            }))
          };

          await putEncryptedFile(
            MANIFEST_PATH,
            manifestPayload,
            `Maalki sync rev ${localRevision}`
          );

          lastLatencyMs = Math.round(performance.now() - t0);
          lastSyncTime = new Date().toLocaleTimeString();
          lastErrorMsg = '';
          syncHealth = 'live';
        } catch (err) {
          console.error('[MaalkiGitHubSync] Push error:', err);
          syncHealth = 'error';
          lastErrorMsg = err.message || 'Sync error';
        } finally {
          isPushing = false;
          updateSyncIndicators();
          if (pushQueued) {
            pushQueued = false;
            pushNow(false);
          }
        }
      }

      async function pullNow() {
        if (!cfg.enabled || !cfg.token || !cfg.passphrase || isPulling || isPushing) return;
        isPulling = true;
        const t0 = performance.now();

        try {
          const remote = await getRemoteFile(MANIFEST_PATH, true);
          if (remote.notModified || remote.notFound) {
            lastLatencyMs = Math.round(performance.now() - t0);
            if (syncHealth === 'error') {
              syncHealth = 'live';
              lastErrorMsg = '';
              updateSyncIndicators();
            }
            return;
          }

          const decrypted = await MaalkiCrypto.decryptObject(remote.envelope, cfg.passphrase);
          if (decrypted && decrypted.revision > localRevision && decrypted.deviceId !== deviceId) {
            localRevision = decrypted.revision;
            if (decrypted.state) {
              suppressSchedule = true;
              appState = decrypted.state;
              if (Array.isArray(appState.users) && appState.users.length > 0 && typeof MaalkiAuth !== 'undefined') {
                MaalkiAuth.mergeRemoteUsers(appState.users);
              }
              try {
                localStorage.setItem(STATE_KEY, JSON.stringify(appState));
              } catch (e) { /* ignore */ }
              suppressSchedule = false;
              renderCurrentView();
            }

            if (Array.isArray(decrypted.mediaCatalog)) {
              for (const entry of decrypted.mediaCatalog) {
                if (!MaalkiMediaStore.getMedia(entry.id)) {
                  const mediaRes = await getRemoteFile(`maalki/media/${entry.id}.enc.json`, false);
                  if (mediaRes && mediaRes.envelope) {
                    const mediaObj = await MaalkiCrypto.decryptObject(mediaRes.envelope, cfg.passphrase);
                    await MaalkiMediaStore.importAll([mediaObj]);
                  }
                }
              }
            }

            if (Array.isArray(decrypted.dossierCatalog)) {
              for (const dEntry of decrypted.dossierCatalog) {
                const existing = MaalkiMediaStore.getDossier(dEntry.propertyId);
                if (!existing || existing.updatedAt !== dEntry.updatedAt) {
                  const dRes = await getRemoteFile(`maalki/properties/${dEntry.fileName}.enc.json`, false);
                  if (dRes && dRes.envelope) {
                    const dObj = await MaalkiCrypto.decryptObject(dRes.envelope, cfg.passphrase);
                    await MaalkiMediaStore.importDossierDirect(dObj);
                  }
                }
              }
            }

            renderCurrentView();
            showToast('Synced encrypted update from another device');
          }

          lastLatencyMs = Math.round(performance.now() - t0);
          lastSyncTime = new Date().toLocaleTimeString();
          lastErrorMsg = '';
          syncHealth = 'live';
          updateSyncIndicators();
        } catch (err) {
          console.error('[MaalkiGitHubSync] Pull error:', err);
          syncHealth = 'error';
          lastErrorMsg = err.message || 'Sync pull error';
          updateSyncIndicators();
        } finally {
          isPulling = false;
        }
      }

      function startPolling() {
        if (pollTimer) clearInterval(pollTimer);
        if (!cfg.enabled || !cfg.token || !cfg.passphrase) return;
        pollTimer = setInterval(pullNow, POLL_INTERVAL_MS);
      }

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      async function connect(newConfig) {
        cfg = { ...cfg, ...newConfig, enabled: true };
        shaCache.clear();
        lastManifestETag = null;
        lastErrorMsg = '';
        saveCfg();

        syncHealth = 'syncing';
        updateSyncIndicators();

        await ensureRepositoryReady();
        const remote = repoIsEmpty ? { notFound: true } : await getRemoteFile(MANIFEST_PATH, false);

        if (remote && remote.envelope) {
          const decrypted = await MaalkiCrypto.decryptObject(remote.envelope, cfg.passphrase);
          const hasLocalData = appState.properties.length > 0 || appState.inspections.length > 0 || appState.transactions.length > 0;
          if (!hasLocalData || decrypted.revision >= localRevision) {
            localRevision = decrypted.revision || Date.now();
            suppressSchedule = true;
            appState = decrypted.state || appState;
            if (Array.isArray(appState.users) && appState.users.length > 0 && typeof MaalkiAuth !== 'undefined') {
              MaalkiAuth.mergeRemoteUsers(appState.users);
            }
            localStorage.setItem(STATE_KEY, JSON.stringify(appState));
            suppressSchedule = false;

            for (const entry of (decrypted.mediaCatalog || [])) {
              if (!MaalkiMediaStore.getMedia(entry.id)) {
                const mRes = await getRemoteFile(`maalki/media/${entry.id}.enc.json`, false).catch(() => null);
                if (mRes && mRes.envelope) {
                  const mObj = await MaalkiCrypto.decryptObject(mRes.envelope, cfg.passphrase).catch(() => null);
                  if (mObj) await MaalkiMediaStore.importAll([mObj]);
                }
              }
            }
            renderCurrentView();
          } else {
            await pushNow(true);
          }
        } else {
          await pushNow(true);
        }

        if (syncHealth !== 'error') {
          syncHealth = 'live';
          updateSyncIndicators();
        }
        startPolling();
      }

      function disconnect() {
        stopPolling();
        cfg.enabled = false;
        cfg.token = '';
        cfg.passphrase = '';
        syncHealth = 'off';
        lastErrorMsg = '';
        saveCfg();
        updateSyncIndicators();
      }

      function getStatus() {
        return {
          ...cfg,
          syncHealth,
          lastSyncTime,
          lastLatencyMs,
          lastErrorMsg,
          pollIntervalMs: POLL_INTERVAL_MS
        };
      }

      return {
        verifyToken,
        createPrivateRepo,
        connect,
        disconnect,
        schedulePush,
        pushNow,
        pullNow,
        startPolling,
        getStatus,
        updateSyncIndicators
      };
    })();

    /**
     * ==========================================================================
     * 3. ONCE-PER-DEVICE AUTH, USER LIST (DEFAULT "ADMIN ADMIN") & PROFILE ENGINE
     * ==========================================================================
     */
    const MaalkiAuth = (() => {
      const VAULT_BUNDLE_KEY = 'maalki_vault_bundle_v1';
      const DEVICE_UNLOCK_KEY = 'maalki_device_unlocked_v1';
      const LOCAL_USERS_KEY = 'maalki_local_users_v1';
      const ACTIVE_USER_KEY = 'maalki_active_user_id_v1';

      let selectedExistingUserId = '';
      let isNewUserMode = false;

      function getSavedVaultBundle() {
        try {
          const raw = localStorage.getItem(VAULT_BUNDLE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.encryptedToken) return parsed;
          }
        } catch (e) { /* ignore */ }
        if (MAALKI_VAULT_CONFIG && MAALKI_VAULT_CONFIG.encryptedToken) {
          return {
            owner: MAALKI_VAULT_CONFIG.owner || '',
            repo: MAALKI_VAULT_CONFIG.repo || 'maalki-vault',
            branch: MAALKI_VAULT_CONFIG.branch || 'main',
            encryptedToken: MAALKI_VAULT_CONFIG.encryptedToken
          };
        }
        return null;
      }

      function saveVaultBundle(bundle) {
        try {
          localStorage.setItem(VAULT_BUNDLE_KEY, JSON.stringify(bundle));
        } catch (e) { /* ignore */ }
      }

      function loadLocalUsers() {
        let localList = [];
        try {
          const raw = localStorage.getItem(LOCAL_USERS_KEY);
          if (raw) localList = JSON.parse(raw) || [];
        } catch (e) { /* ignore */ }

        const mergedMap = new Map();
        [...localList, ...(appState.users || [])].forEach(u => {
          if (u && u.id) {
            mergedMap.set(u.id, {
              id: u.id,
              firstName: u.firstName || '',
              lastName: u.lastName || '',
              fullName: `${u.firstName || ''} ${u.lastName || ''}`.trim() || 'Admin Admin',
              avatarMediaId: u.avatarMediaId || null,
              updatedAt: u.updatedAt || Date.now()
            });
          }
        });

        // First-time default user: "Admin Admin"
        if (mergedMap.size === 0) {
          const defaultAdmin = {
            id: 'usr_admin_default',
            firstName: 'Admin',
            lastName: 'Admin',
            fullName: 'Admin Admin',
            avatarMediaId: null,
            updatedAt: Date.now()
          };
          mergedMap.set(defaultAdmin.id, defaultAdmin);
          saveLocalUsers([defaultAdmin]);
        }

        return Array.from(mergedMap.values());
      }

      function saveLocalUsers(users) {
        try {
          localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(users));
        } catch (e) { /* ignore */ }
        appState.users = users;
      }

      function mergeRemoteUsers(remoteUsers = []) {
        const current = loadLocalUsers();
        const byId = new Map(current.map(u => [u.id, u]));
        for (const ru of remoteUsers) {
          if (!ru || !ru.id) continue;
          const existing = byId.get(ru.id);
          if (!existing || (ru.updatedAt || 0) >= (existing.updatedAt || 0)) {
            byId.set(ru.id, {
              id: ru.id,
              firstName: ru.firstName || 'Admin',
              lastName: ru.lastName || 'Admin',
              fullName: `${ru.firstName || ''} ${ru.lastName || ''}`.trim() || 'Admin Admin',
              avatarMediaId: ru.avatarMediaId || existing?.avatarMediaId || null,
              updatedAt: ru.updatedAt || Date.now()
            });
          }
        }
        saveLocalUsers(Array.from(byId.values()));
        updateHeaderProfileUI();
      }

      function getActiveUser() {
        const users = loadLocalUsers();
        const activeId = localStorage.getItem(ACTIVE_USER_KEY);
        return users.find(u => u.id === activeId) || users[0];
      }

      function getActiveUserFullName() {
        const u = getActiveUser();
        return u ? `${u.firstName} ${u.lastName}`.trim() : 'Admin Admin';
      }

      function getInitials(user) {
        if (!user) return 'AA';
        const f = (user.firstName || '').trim().charAt(0).toUpperCase();
        const l = (user.lastName || '').trim().charAt(0).toUpperCase();
        return (f + l) || f || 'AA';
      }

      function renderAvatarMarkup(user, sizeClasses = 'w-8 h-8 text-xs') {
        const avatarItem = user?.avatarMediaId ? MaalkiMediaStore.getMedia(user.avatarMediaId) : null;
        if (avatarItem && avatarItem.dataUrl) {
          return `<img src="${avatarItem.dataUrl}" alt="${escapeHtml(user.fullName || 'Profile')}" class="${sizeClasses} rounded-full object-cover" />`;
        }
        return `<span class="${sizeClasses} rounded-full flex items-center justify-center font-bold text-white" style="background-color: #00A7E1;">${escapeHtml(getInitials(user))}</span>`;
      }

      function updateHeaderProfileUI() {
        const user = getActiveUser();
        const dAvatar = document.getElementById('desktop-profile-avatar');
        const dName = document.getElementById('desktop-profile-name');
        const mAvatar = document.getElementById('mobile-profile-avatar');

        if (dName) dName.textContent = user ? `${user.firstName} ${user.lastName}` : 'Admin Admin';

        const avatarItem = user?.avatarMediaId ? MaalkiMediaStore.getMedia(user.avatarMediaId) : null;
        if (dAvatar) {
          if (avatarItem && avatarItem.dataUrl) {
            dAvatar.innerHTML = `<img src="${avatarItem.dataUrl}" alt="Profile" class="w-full h-full object-cover" />`;
          } else {
            dAvatar.innerHTML = '';
            dAvatar.textContent = getInitials(user);
          }
        }
        if (mAvatar) {
          if (avatarItem && avatarItem.dataUrl) {
            mAvatar.innerHTML = `<img src="${avatarItem.dataUrl}" alt="Profile" class="w-full h-full object-cover" />`;
          } else {
            mAvatar.innerHTML = '';
            mAvatar.textContent = getInitials(user);
          }
        }
      }

      function upsertUser({ id, firstName, lastName, avatarMediaId }) {
        const users = loadLocalUsers();
        const fName = (firstName || '').trim() || 'Admin';
        const lName = (lastName || '').trim() || 'Admin';
        const fullName = `${fName} ${lName}`.trim();

        let target = id ? users.find(u => u.id === id) : users.find(u => u.fullName.toLowerCase() === fullName.toLowerCase());
        if (target) {
          target.firstName = fName;
          target.lastName = lName;
          target.fullName = fullName;
          if (avatarMediaId !== undefined) target.avatarMediaId = avatarMediaId;
          target.updatedAt = Date.now();
        } else {
          target = {
            id: id || 'usr_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
            firstName: fName,
            lastName: lName,
            fullName,
            avatarMediaId: avatarMediaId || null,
            updatedAt: Date.now()
          };
          users.push(target);
        }

        saveLocalUsers(users);
        localStorage.setItem(ACTIVE_USER_KEY, target.id);
        saveState();
        updateHeaderProfileUI();
        return target;
      }

      function switchActiveUser(userId) {
        const users = loadLocalUsers();
        const target = users.find(u => u.id === userId);
        if (!target) return;
        localStorage.setItem(ACTIVE_USER_KEY, target.id);
        updateHeaderProfileUI();
        renderCurrentView();
        showToast(`Switched active manager to ${target.fullName}`);
      }

      function showLoginScreen() {
        const screen = document.getElementById('login-screen');
        if (!screen) return;
        const users = loadLocalUsers();
        const bundle = getSavedVaultBundle();

        const listWrap = document.getElementById('login-user-list-wrap');
        const listEl = document.getElementById('login-user-list');
        const newFields = document.getElementById('login-new-user-fields');
        const toggleBtn = document.getElementById('login-toggle-new-user');
        const vaultStatus = document.getElementById('login-vault-status');

        if (!selectedExistingUserId || !users.some(u => u.id === selectedExistingUserId)) {
          const adminUser = users.find(u => u.id === 'usr_admin_default');
          selectedExistingUserId = adminUser ? adminUser.id : users[0].id;
        }

        listWrap.classList.remove('hidden');
        listEl.innerHTML = users.map(u => {
          const active = !isNewUserMode && u.id === selectedExistingUserId;
          return `
            <button type="button" onclick="selectLoginExistingUser('${u.id}')" class="w-full min-h-[48px] flex items-center justify-between p-2.5 rounded-xl border text-left transition-colors cursor-pointer ${active ? 'border-[#00A7E1] nav-item-active' : 'm-border m-canvas hover:border-[#00A7E1]'}">
              <span class="flex items-center gap-2.5 min-w-0">
                ${renderAvatarMarkup(u, 'w-8 h-8 text-xs shrink-0')}
                <span class="min-w-0">
                  <span class="block font-semibold text-xs truncate">${escapeHtml(u.firstName)} ${escapeHtml(u.lastName)}</span>
                  <span class="block text-[10px] m-text-muted">${u.id === 'usr_admin_default' ? 'Default Manager Profile' : 'Manager / Inspector'}</span>
                </span>
              </span>
              <span class="text-xs font-bold shrink-0 ml-2" style="color: #00A7E1;">${active ? '✓ Selected' : 'Select'}</span>
            </button>
          `;
        }).join('');

        if (isNewUserMode) {
          newFields.classList.remove('hidden');
          toggleBtn.textContent = 'Use Selected Name';
        } else {
          newFields.classList.add('hidden');
          toggleBtn.textContent = '+ Add New Name';
        }

        if (bundle && bundle.encryptedToken) {
          vaultStatus.innerHTML = `Encrypted vault detected for <strong class="font-mono-num">${escapeHtml(bundle.owner || 'GitHub')}/${escapeHtml(bundle.repo || 'maalki-vault')}</strong>. Enter your passphrase once to unlock this device.`;
        } else {
          vaultStatus.innerHTML = `No encrypted vault key found yet. Open Browser Inspect &rarr; Console and run <code class="font-mono-num text-[11px]">await Maalki.createPassphrase("ghp_...", "your-passphrase")</code> once.`;
        }

        screen.classList.remove('hidden');
      }

      function hideLoginScreen() {
        const screen = document.getElementById('login-screen');
        if (screen) screen.classList.add('hidden');
      }

      function setSelectedExistingUser(userId) {
        selectedExistingUserId = userId;
        isNewUserMode = false;
        showLoginScreen();
      }

      function toggleNewUserMode() {
        isNewUserMode = !isNewUserMode;
        showLoginScreen();
        if (isNewUserMode) {
          setTimeout(() => document.getElementById('login-first-name')?.focus(), 50);
        }
      }

      function refreshLoginScreenIfVisible() {
        const screen = document.getElementById('login-screen');
        if (screen && !screen.classList.contains('hidden')) {
          showLoginScreen();
        }
      }

      async function completeLogin({ firstName, lastName, existingUserId, passphrase }) {
        const cleanPass = (passphrase || '').trim();
        if (!cleanPass) {
          throw new Error('Please enter your vault passphrase.');
        }

        let resolvedUser;
        if (existingUserId && !isNewUserMode) {
          const users = loadLocalUsers();
          const found = users.find(u => u.id === existingUserId);
          if (!found) throw new Error('Please select a manager name or add a new one.');
          localStorage.setItem(ACTIVE_USER_KEY, found.id);
          resolvedUser = found;
        } else {
          if (!firstName || !lastName) {
            throw new Error('Please enter both First Name and Last Name.');
          }
          resolvedUser = upsertUser({ firstName, lastName });
        }

        const bundle = getSavedVaultBundle();
        if (!bundle || !bundle.encryptedToken) {
          throw new Error('Encrypted vault key not configured yet. Run Maalki.createPassphrase(...) in your browser console first.');
        }

        const unpacked = await MaalkiCrypto.unpackTokenString(bundle.encryptedToken, cleanPass);
        if (!unpacked || !unpacked.token) {
          throw new Error('Invalid vault passphrase.');
        }

        localStorage.setItem(
          DEVICE_UNLOCK_KEY,
          JSON.stringify({
            unlocked: true,
            owner: unpacked.owner || bundle.owner,
            repo: unpacked.repo || bundle.repo || 'maalki-vault',
            branch: unpacked.branch || bundle.branch || 'main',
            encryptedToken: bundle.encryptedToken,
            passphrase: cleanPass,
            unlockedAt: new Date().toISOString()
          })
        );

        await MaalkiGitHubSync.connect({
          token: unpacked.token,
          owner: unpacked.owner || bundle.owner,
          repo: unpacked.repo || bundle.repo || 'maalki-vault',
          branch: unpacked.branch || bundle.branch || 'main',
          passphrase: cleanPass
        });

        updateHeaderProfileUI();
        hideLoginScreen();
        renderCurrentView();
        showToast(`Welcome, ${resolvedUser.fullName} • Device Unlocked`);
      }

      function lockDeviceSession() {
        localStorage.removeItem(DEVICE_UNLOCK_KEY);
        MaalkiGitHubSync.disconnect();
        selectedExistingUserId = getActiveUser()?.id || 'usr_admin_default';
        isNewUserMode = false;
        showLoginScreen();
      }

      async function bootAuth() {
        updateHeaderProfileUI();
        try {
          const rawSession = localStorage.getItem(DEVICE_UNLOCK_KEY);
          if (rawSession) {
            const session = JSON.parse(rawSession);
            if (session && session.unlocked && session.encryptedToken && session.passphrase) {
              const unpacked = await MaalkiCrypto.unpackTokenString(session.encryptedToken, session.passphrase);
              if (unpacked && unpacked.token) {
                hideLoginScreen();
                await MaalkiGitHubSync.connect({
                  token: unpacked.token,
                  owner: unpacked.owner || session.owner,
                  repo: unpacked.repo || session.repo || 'maalki-vault',
                  branch: unpacked.branch || session.branch || 'main',
                  passphrase: session.passphrase
                });
                return;
              }
            }
          }
        } catch (e) {
          console.warn('[MaalkiAuth] Stored session requires re-unlock:', e.message);
        }
        showLoginScreen();
      }

      return {
        bootAuth,
        loadLocalUsers,
        mergeRemoteUsers,
        getActiveUser,
        getActiveUserFullName,
        renderAvatarMarkup,
        updateHeaderProfileUI,
        upsertUser,
        switchActiveUser,
        setSelectedExistingUser,
        toggleNewUserMode,
        refreshLoginScreenIfVisible,
        completeLogin,
        lockDeviceSession,
        getSavedVaultBundle,
        saveVaultBundle
      };
    })();

    /**
     * ==========================================================================
     * BROWSER CONSOLE HELPER: Maalki.createPassphrase(...)
     * Run in DevTools Console once to encrypt your GitHub Classic Token with
     * your chosen permanent passphrase and generate your MAALKI_VAULT_CONFIG.
     * ==========================================================================
     */
    window.Maalki = {
      async createPassphrase(githubToken, chosenPassphrase = '', repoName = 'maalki-vault') {
        const cleanToken = (githubToken || '').trim();
        if (!cleanToken) {
          throw new Error('Provide your GitHub Classic Token as the first argument: await Maalki.createPassphrase("ghp_...", "your-passphrase")');
        }
        const info = await MaalkiGitHubSync.verifyToken(cleanToken);
        const owner = info.login;
        const passphrase = (chosenPassphrase || '').trim() || MaalkiCrypto.generatePassphrase();

        const encryptedToken = await MaalkiCrypto.packTokenString(
          {
            token: cleanToken,
            owner,
            repo: repoName,
            branch: 'main',
            createdAt: new Date().toISOString()
          },
          passphrase
        );

        const bundle = {
          owner,
          repo: repoName,
          branch: 'main',
          encryptedToken
        };
        MaalkiAuth.saveVaultBundle(bundle);
        MaalkiAuth.refreshLoginScreenIfVisible();

        const configSnippet = [
          'const MAALKI_VAULT_CONFIG = {',
          `  owner: "${owner}",`,
          `  repo: "${repoName}",`,
          `  branch: "main",`,
          `  encryptedToken: "${encryptedToken}"`,
          '};'
        ].join('\n');

        console.log('%c[Maalki] Encrypted Vault Bundle Saved!', 'color: #00A7E1; font-weight: bold; font-size: 13px;');
        console.log('%cYour Vault Passphrase (Password):', 'font-weight: bold;', passphrase);
        console.log('%cOptional MAALKI_VAULT_CONFIG snippet for multi-device index.html:\n', 'font-weight: bold;', configSnippet);

        return { passphrase, owner, repo: repoName, encryptedToken };
      },

      async encryptToken(githubToken, customPassphraseOrRepo = '', repoName = 'maalki-vault') {
        return this.createPassphrase(githubToken, customPassphraseOrRepo, repoName);
      },

      status() {
        return MaalkiGitHubSync.getStatus();
      }
    };

    /**
     * ==========================================================================
     * 4. UNIFIED MULTIMEDIA & ARCHIVED DOSSIER REPOSITORY WITH AUTO-ROLLOVER
     * Single IndexedDB repository ('maalki_unified_repo') storing:
     *   - Photos ('image/*')
     *   - Audio Recordings ('audio/*')
     *   - Videos ('video/*')
     *   - Per-Property Dossier Files ('pfile_{id}.json') — preserved forever
     * ==========================================================================
     */
    const MaalkiMediaStore = (() => {
      const DB_NAME = 'maalki_unified_repo';
      const STORE_NAME = 'media_items';
      const DOSSIER_STORE = 'property_dossiers';
      const SETTINGS_KEY = 'maalki_media_settings_v2';
      const LEGACY_STORAGE_KEY = 'maalki_photo_repo_v1';

      let settings = {
        autoRollover: true,
        maxCapMB: 50
      };

      try {
        const saved = localStorage.getItem(SETTINGS_KEY);
        if (saved) settings = { ...settings, ...JSON.parse(saved) };
      } catch (e) { /* fallback to defaults */ }

      let dbInstance = null;
      let cache = new Map();
      let dossierCache = new Map();
      let initPromise = null;

      function saveSettings() {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      }

      function openDB() {
        if (initPromise) return initPromise;
        initPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 2);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
              store.createIndex('createdAt', 'createdAt', { unique: false });
              store.createIndex('kind', 'kind', { unique: false });
            }
            if (!db.objectStoreNames.contains(DOSSIER_STORE)) {
              const dStore = db.createObjectStore(DOSSIER_STORE, { keyPath: 'propertyId' });
              dStore.createIndex('updatedAt', 'updatedAt', { unique: false });
            }
          };
          req.onsuccess = async (e) => {
            dbInstance = e.target.result;
            await loadAllIntoCache();
            await migrateLegacyIfPresent();
            updateStorageIndicators();
            resolve(dbInstance);
          };
          req.onerror = (e) => reject(e.target.error);
        });
        return initPromise;
      }

      function loadAllIntoCache() {
        return new Promise((resolve) => {
          if (!dbInstance) return resolve();
          const tx = dbInstance.transaction([STORE_NAME, DOSSIER_STORE], 'readonly');
          const mStore = tx.objectStore(STORE_NAME);
          const dStore = tx.objectStore(DOSSIER_STORE);
          const mReq = mStore.getAll();
          const dReq = dStore.getAll();

          tx.oncomplete = () => {
            cache.clear();
            (mReq.result || []).forEach(item => cache.set(item.id, item));
            dossierCache.clear();
            (dReq.result || []).forEach(doc => dossierCache.set(doc.propertyId, doc));
            resolve();
          };
          tx.onerror = () => resolve();
        });
      }

      async function migrateLegacyIfPresent() {
        try {
          const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEY);
          if (!legacyRaw) return;
          const parsed = JSON.parse(legacyRaw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            for (const p of parsed) {
              if (!cache.has(p.id)) {
                const item = {
                  id: p.id,
                  kind: 'image',
                  mimeType: 'image/jpeg',
                  dataUrl: p.dataUrl,
                  posterUrl: null,
                  durationSec: 0,
                  caption: p.caption || 'Migrated Photo',
                  createdAt: p.createdAt || Date.now(),
                  pinned: !!p.pinned,
                  sizeBytes: p.sizeBytes || Math.round((p.dataUrl?.length || 0) * 0.75)
                };
                await putDirect(item);
              }
            }
            localStorage.removeItem(LEGACY_STORAGE_KEY);
          }
        } catch (e) { /* ignore migration error */ }
      }

      function putDirect(item) {
        return new Promise((resolve, reject) => {
          if (!dbInstance) return reject(new Error('Unified repository unavailable'));
          const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(item);
          tx.oncomplete = () => {
            cache.set(item.id, item);
            resolve(item);
          };
          tx.onerror = (e) => reject(e.target.error);
        });
      }

      function deleteDirect(id) {
        return new Promise((resolve) => {
          if (!dbInstance) return resolve();
          const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).delete(id);
          tx.oncomplete = () => {
            cache.delete(id);
            resolve();
          };
          tx.onerror = () => resolve();
        });
      }

      function getStats() {
        let totalBytes = 0;
        let pinnedCount = 0;
        let imageCount = 0, imageBytes = 0;
        let audioCount = 0, audioBytes = 0;
        let videoCount = 0, videoBytes = 0;

        cache.forEach(item => {
          const bytes = item.sizeBytes || 0;
          totalBytes += bytes;
          if (item.pinned) pinnedCount++;
          if (item.kind === 'audio') {
            audioCount++; audioBytes += bytes;
          } else if (item.kind === 'video') {
            videoCount++; videoBytes += bytes;
          } else {
            imageCount++; imageBytes += bytes;
          }
        });

        const maxBytes = settings.maxCapMB * 1024 * 1024;
        const usedMB = totalBytes / (1024 * 1024);
        const pct = Math.min(100, Math.round((totalBytes / maxBytes) * 100));

        return {
          count: cache.size,
          pinnedCount,
          imageCount, imageMB: (imageBytes / (1024 * 1024)).toFixed(1),
          audioCount, audioMB: (audioBytes / (1024 * 1024)).toFixed(1),
          videoCount, videoMB: (videoBytes / (1024 * 1024)).toFixed(1),
          dossierCount: dossierCache.size,
          archivedDossierCount: Array.from(dossierCache.values()).filter(d => d.archived).length,
          totalBytes,
          usedMB: usedMB.toFixed(1),
          maxCapMB: settings.maxCapMB,
          pct,
          autoRollover: settings.autoRollover
        };
      }

      function updateStorageIndicators() {
        const stats = getStats();
        const bar = document.getElementById('sidebar-storage-bar');
        const sbLabel = document.getElementById('sidebar-storage-label');
        const tbText = document.getElementById('topbar-storage-text');
        const mbBadge = document.getElementById('mobile-storage-badge');

        if (bar) bar.style.width = `${Math.max(4, stats.pct)}%`;
        if (sbLabel) sbLabel.textContent = `${stats.usedMB} / ${stats.maxCapMB} MB • ${stats.imageCount}P ${stats.audioCount}A ${stats.videoCount}V`;
        if (tbText) tbText.textContent = `Unified Repo: ${stats.autoRollover ? 'Rollover ON' : 'OFF'} • ${stats.usedMB} / ${stats.maxCapMB} MB (${stats.imageCount}P · ${stats.audioCount}A · ${stats.videoCount}V)`;
        if (mbBadge) mbBadge.textContent = `${stats.usedMB}/${stats.maxCapMB}MB`;
      }

      function compressImageFile(file, maxDim = 1400, quality = 0.78) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              let { width, height } = img;
              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL('image/jpeg', quality);
              resolve(dataUrl);
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function blobToDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      function extractVideoMetadata(dataUrl) {
        return new Promise((resolve) => {
          const video = document.createElement('video');
          video.preload = 'metadata';
          video.muted = true;
          video.playsInline = true;
          video.src = dataUrl;

          const cleanup = () => {
            video.onloadedmetadata = null;
            video.onseeked = null;
            video.onerror = null;
          };

          video.onloadedmetadata = () => {
            const dur = isFinite(video.duration) ? Math.round(video.duration) : 0;
            try {
              video.currentTime = Math.min(0.4, (video.duration || 0) / 2);
            } catch (e) {
              cleanup();
              resolve({ durationSec: dur, posterUrl: null });
            }
          };

          video.onseeked = () => {
            try {
              const canvas = document.createElement('canvas');
              canvas.width = 480;
              canvas.height = Math.max(270, Math.round((video.videoHeight / (video.videoWidth || 1)) * 480));
              const ctx = canvas.getContext('2d');
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              const posterUrl = canvas.toDataURL('image/jpeg', 0.72);
              const dur = isFinite(video.duration) ? Math.round(video.duration) : 0;
              cleanup();
              resolve({ durationSec: dur, posterUrl });
            } catch (e) {
              cleanup();
              resolve({ durationSec: isFinite(video.duration) ? Math.round(video.duration) : 0, posterUrl: null });
            }
          };

          video.onerror = () => {
            cleanup();
            resolve({ durationSec: 0, posterUrl: null });
          };
        });
      }

      function extractAudioDuration(dataUrl) {
        return new Promise((resolve) => {
          const audio = document.createElement('audio');
          audio.preload = 'metadata';
          audio.src = dataUrl;
          audio.onloadedmetadata = () => {
            resolve(isFinite(audio.duration) ? Math.round(audio.duration) : 0);
          };
          audio.onerror = () => resolve(0);
        });
      }

      async function enforceAutoRollover(incomingBytes) {
        const maxBytes = settings.maxCapMB * 1024 * 1024;
        if (incomingBytes > maxBytes) {
          throw new Error(`File (${(incomingBytes / (1024 * 1024)).toFixed(1)} MB) exceeds repository limit of ${settings.maxCapMB} MB.`);
        }

        let currentBytes = Array.from(cache.values()).reduce((sum, item) => sum + (item.sizeBytes || 0), 0);
        if (currentBytes + incomingBytes <= maxBytes) return 0;

        if (!settings.autoRollover) {
          throw new Error(`Unified repository limit (${settings.maxCapMB} MB) reached and Auto-Rollover is disabled.`);
        }

        const unpinnedSorted = Array.from(cache.values())
          .filter(item => !item.pinned)
          .sort((a, b) => a.createdAt - b.createdAt);

        let rolledCount = 0;
        for (const candidate of unpinnedSorted) {
          if (currentBytes + incomingBytes <= maxBytes) break;
          currentBytes -= (candidate.sizeBytes || 0);
          await deleteDirect(candidate.id);
          rolledCount++;
        }

        if (currentBytes + incomingBytes > maxBytes) {
          throw new Error(`Repository full of pinned items (${settings.maxCapMB} MB). Unpin older media or raise cap.`);
        }

        return rolledCount;
      }

      async function addMediaBlob(blob, options = {}) {
        await openDB();
        const mime = blob.type || options.mimeType || 'application/octet-stream';
        const kind = options.kind || (mime.startsWith('audio/') ? 'audio' : mime.startsWith('video/') ? 'video' : 'image');

        let dataUrl;
        if (kind === 'image') {
          dataUrl = await compressImageFile(blob);
        } else {
          dataUrl = await blobToDataUrl(blob);
        }

        const sizeBytes = Math.round(dataUrl.length * 0.75);
        const rolledCount = await enforceAutoRollover(sizeBytes);

        let durationSec = options.durationSec || 0;
        let posterUrl = options.posterUrl || null;

        if (kind === 'video' && (!durationSec || !posterUrl)) {
          const meta = await extractVideoMetadata(dataUrl);
          if (!durationSec) durationSec = meta.durationSec;
          if (!posterUrl) posterUrl = meta.posterUrl;
        } else if (kind === 'audio' && !durationSec) {
          durationSec = await extractAudioDuration(dataUrl);
        }

        const defaultCaptions = {
          image: 'Property Photo',
          audio: 'Voice Note',
          video: 'Walkthrough Video'
        };

        const item = {
          id: 'med_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
          kind,
          mimeType: kind === 'image' ? 'image/jpeg' : mime,
          dataUrl,
          posterUrl,
          durationSec,
          caption: (options.caption || '').trim() || (blob.name ? blob.name.replace(/\.[^/.]+$/, '') : defaultCaptions[kind]),
          createdAt: Date.now(),
          pinned: !!options.pinned,
          sizeBytes
        };

        await putDirect(item);
        updateStorageIndicators();
        if (typeof MaalkiGitHubSync !== 'undefined') {
          MaalkiGitHubSync.schedulePush({ mediaId: item.id });
        }

        if (rolledCount > 0) {
          showToast(`Auto-Rollover archived ${rolledCount} oldest unpinned item(s) to free space.`);
        }
        return item;
      }

      async function addFiles(fileList, options = {}) {
        const added = [];
        for (const file of Array.from(fileList)) {
          const isImg = file.type.startsWith('image/');
          const isAud = file.type.startsWith('audio/');
          const isVid = file.type.startsWith('video/');
          if (!isImg && !isAud && !isVid) continue;
          const item = await addMediaBlob(file, {
            ...options,
            caption: options.caption || file.name.replace(/\.[^/.]+$/, '')
          });
          added.push(item);
        }
        return added;
      }

      function getMedia(id) {
        return cache.get(id) || null;

      function getAllMedia() {
        return Array.from(cache.values()).sort((a, b) => b.createdAt - a.createdAt);

      async function togglePin(id) {
        const item = cache.get(id);
        if (!item) return null;
        item.pinned = !item.pinned;
        await putDirect(item);
        updateStorageIndicators();
        if (typeof MaalkiGitHubSync !== 'undefined') {
          MaalkiGitHubSync.schedulePush({ mediaId: item.id });
        }
        return item;
      }

      async function updateCaption(id, newCaption) {
        const item = cache.get(id);
        if (!item) return;
        item.caption = newCaption;
        await putDirect(item);
        if (typeof MaalkiGitHubSync !== 'undefined') {
          MaalkiGitHubSync.schedulePush({ mediaId: item.id });
        }
      }

      async function deleteMedia(id) {
        await deleteDirect(id);
        updateStorageIndicators();
      }

      async function runManualRollover() {
        const stats = getStats();
        const unpinnedSorted = Array.from(cache.values())
          .filter(p => !p.pinned)
          .sort((a, b) => a.createdAt - b.createdAt);
        if (unpinnedSorted.length === 0) {
          showToast('No unpinned media items available to roll over.');
          return 0;
        }
        const toRemove = unpinnedSorted.slice(0, Math.max(1, Math.ceil(unpinnedSorted.length * 0.25)));
        for (const item of toRemove) {
          await deleteDirect(item.id);
        }
        updateStorageIndicators();
        showToast(`Rolled over ${toRemove.length} oldest unpinned item(s) across ${stats.count} stored media files.`);
        return toRemove.length;
      }

      async function importAll(itemsArray = []) {
        await openDB();
        for (const item of itemsArray) {
          if (item && item.id && item.dataUrl) {
            await putDirect(item);
          }
        }
        updateStorageIndicators();
      }

      return {
        openDB,
        addFiles,
        addMediaBlob,
        getMedia,
        getAllMedia,
        togglePin,
        updateCaption,
        deleteMedia,
        runManualRollover,
        importAll,
        savePropertyDossier,
        archivePropertyDossier,
        importDossierDirect,
        getDossier,
        getAllDossiers,
        getStats,
        getSettings: () => ({ ...settings }),
        updateSettings: (newSettings) => {
          settings = { ...settings, ...newSettings };
          saveSettings();
          updateStorageIndicators();
        },
        updateStorageIndicators
      };
    })();

          appState.transactions.forEach(tx => {

    function formatCurrency(amount) {
      const num = Number(amount) || 0;
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 2
      }).format(num);
    }

    function formatDuration(sec) {
      const total = Math.max(0, Math.round(Number(sec) || 0));
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

      el.style.borderLeftColor = '#00A7E1';
      el.innerHTML = `<span class="w-2 h-2 rounded-full shrink-0" style="background-color:#00A7E1;"></span><span>${escapeHtml(message)}</span>`;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
