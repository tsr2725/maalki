    const activeDropzoneCallbacks = new Map();

    function renderMediaDropzone({ zoneId, mediaIds = [], label = 'Attachments (Photos, Audio & Video)', compact = false, onChange }) {
      activeDropzoneCallbacks.set(zoneId, { mediaIds: [...mediaIds], onChange });

      const thumbsHtml = mediaIds.map(id => {
        const item = MaalkiMediaStore.getMedia(id);
        if (!item) return '';
        const isAudio = item.kind === 'audio';
        const isVideo = item.kind === 'video';

        let visualPreview = '';
        if (isAudio) {
          visualPreview = `
            <div onclick="openMediaLightbox('${item.id}')" class="w-full h-full flex flex-col items-center justify-center p-2 cursor-pointer m-subtle">
              <div class="w-8 h-8 rounded-full flex items-center justify-center mb-1" style="background-color: var(--accent-tint); color: #00A7E1;">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
              </div>
              <span class="text-[10px] font-mono-num font-semibold" style="color: #00A7E1;">AUDIO • ${formatDuration(item.durationSec)}</span>
              <span class="text-[10px] m-text-muted truncate max-w-full px-1 mt-0.5">${escapeHtml(item.caption)}</span>
            </div>
          `;
        } else if (isVideo) {
          visualPreview = `
            <div onclick="openMediaLightbox('${item.id}')" class="w-full h-full relative cursor-pointer bg-black">
              ${item.posterUrl
                ? `<img src="${item.posterUrl}" alt="${escapeHtml(item.caption)}" class="w-full h-full object-cover opacity-85" />`
                : `<div class="w-full h-full flex items-center justify-center text-neutral-400 text-xs">Video</div>`
              }
              <div class="absolute inset-0 flex items-center justify-center">
                <span class="w-8 h-8 rounded-full bg-black/75 text-white flex items-center justify-center border border-white/30">
                  <svg class="w-3.5 h-3.5 ml-0.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </span>
              </div>
              <span class="absolute bottom-1 left-1 px-1.5 py-0.5 rounded bg-black/80 text-white text-[9px] font-mono-num">
                VID ${formatDuration(item.durationSec)}
              </span>
            </div>
          `;
        } else {
          visualPreview = `
            <img src="${item.dataUrl}" alt="${escapeHtml(item.caption)}" onclick="openMediaLightbox('${item.id}')" class="w-full h-full object-cover cursor-pointer" />
          `;
        }

        return `
          <div class="relative group rounded-xl overflow-hidden border m-border m-subtle aspect-square">
            ${visualPreview}
            <div class="absolute top-1.5 right-1.5 flex items-center gap-1">
              <button type="button" onclick="handleDropzoneTogglePin('${zoneId}', '${item.id}')" title="${item.pinned ? 'Pinned (Protected from Rollover)' : 'Pin to protect from Auto-Rollover'}" class="w-6 h-6 rounded-md flex items-center justify-center text-[11px] font-bold cursor-pointer ${item.pinned ? 'bg-[#00A7E1] text-white' : 'bg-black/65 text-white opacity-85 hover:opacity-100'}">
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="${item.pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.2"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
              </button>
              <button type="button" onclick="handleDropzoneRemove('${zoneId}', '${item.id}')" title="Remove from item" class="w-6 h-6 rounded-md bg-black/65 text-white flex items-center justify-center text-xs opacity-85 hover:opacity-100 cursor-pointer">
                &times;
              </button>
            </div>
            ${!isAudio ? `
              <div class="absolute bottom-0 inset-x-0 bg-black/65 px-2 py-1 text-[10px] text-white truncate pointer-events-none">
                ${escapeHtml(item.caption)}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      return `
        <div id="dz-wrapper-${zoneId}" class="space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold m-text-sec">${escapeHtml(label)}</span>
            <span class="text-[11px] m-text-muted font-mono-num">${mediaIds.length} item(s) • Unified Rollover Repo</span>
          </div>

          <div
            class="dropzone-area rounded-xl ${compact ? 'p-3' : 'p-4'} flex flex-col sm:flex-row items-center justify-between gap-3"
            ondragover="event.preventDefault(); this.classList.add('drag-over');"
            ondragleave="this.classList.remove('drag-over');"
            ondrop="event.preventDefault(); this.classList.remove('drag-over'); handleDropzoneFiles('${zoneId}', event.dataTransfer.files);"
          >
            <div class="flex items-center gap-2.5 text-center sm:text-left">
              <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background-color: var(--accent-tint); color: #00A7E1;">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              </div>
              <div>
                <p class="text-xs font-medium">Drop photos, audio or video, or record directly</p>
                <p class="text-[11px] m-text-muted">Stored in shared Auto-Rollover repository</p>
              </div>
            </div>

            <div class="flex flex-wrap items-center justify-center sm:justify-end gap-1.5 shrink-0">
              <label class="btn-ghost px-2.5 py-1.5 rounded-lg text-xs cursor-pointer inline-flex items-center gap-1">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span>+ Photo</span>
                <input type="file" accept="image/*" multiple class="hidden" onchange="handleDropzoneFiles('${zoneId}', this.files); this.value='';" />
              </label>

              <label class="btn-ghost px-2.5 py-1.5 rounded-lg text-xs cursor-pointer inline-flex items-center gap-1">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                <span>Camera</span>
                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleDropzoneFiles('${zoneId}', this.files); this.value='';" />
              </label>

              <button type="button" onclick="openAudioRecorderModal('${zoneId}')" class="btn-ghost px-2.5 py-1.5 rounded-lg text-xs cursor-pointer inline-flex items-center gap-1">
                <svg class="w-3.5 h-3.5" style="color: #00A7E1;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
                <span>Record Audio</span>
              </button>

              <button type="button" onclick="openVideoRecorderModal('${zoneId}')" class="btn-accent px-2.5 py-1.5 rounded-lg text-xs cursor-pointer inline-flex items-center gap-1">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                <span>Record Video</span>
              </button>
            </div>
          </div>

          ${mediaIds.length > 0 ? `
            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2.5 pt-1">
              ${thumbsHtml}
            </div>
          ` : ''}
        </div>
      `;
    }

    async function handleDropzoneFiles(zoneId, fileList) {
      const entry = activeDropzoneCallbacks.get(zoneId);
      if (!entry || !fileList || fileList.length === 0) return;
      try {
        const added = await MaalkiMediaStore.addFiles(fileList);
        const nextIds = [...entry.mediaIds, ...added.map(a => a.id)];
        entry.mediaIds = nextIds;
        entry.onChange(nextIds);
        showToast(`${added.length} media file(s) saved to unified repository.`);
      } catch (err) {
        showToast(err.message || 'Could not save media file.');
      }
    }

    async function appendMediaToDropzone(zoneId, mediaItem) {
      const entry = activeDropzoneCallbacks.get(zoneId);
      if (!entry || !mediaItem) return;
      const nextIds = [...entry.mediaIds, mediaItem.id];
      entry.mediaIds = nextIds;
      entry.onChange(nextIds);
    }

    async function handleDropzoneTogglePin(zoneId, mediaId) {
      const entry = activeDropzoneCallbacks.get(zoneId);
      const updated = await MaalkiMediaStore.togglePin(mediaId);
      if (updated) {
        showToast(updated.pinned ? 'Media pinned & protected from Auto-Rollover.' : 'Media unpinned.');
        if (entry) entry.onChange([...entry.mediaIds]);
      }
    }

    function handleDropzoneRemove(zoneId, mediaId) {
      const entry = activeDropzoneCallbacks.get(zoneId);
      if (!entry) return;
      const nextIds = entry.mediaIds.filter(id => id !== mediaId);
      entry.mediaIds = nextIds;
      entry.onChange(nextIds);
    }

    /**
     * ==========================================================================
     * IN-APP AUDIO RECORDER MODAL (WITH LIVE WAVEFORM + FILE FALLBACK)
     * ==========================================================================
     */
    let activeRecorderSession = null;

    function cleanupRecorderSession() {
      if (!activeRecorderSession) return;
      if (activeRecorderSession.timerId) clearInterval(activeRecorderSession.timerId);
      if (activeRecorderSession.animId) cancelAnimationFrame(activeRecorderSession.animId);
      if (activeRecorderSession.audioCtx) {
        activeRecorderSession.audioCtx.close().catch(() => {});
      }
      if (activeRecorderSession.stream) {
        activeRecorderSession.stream.getTracks().forEach(t => t.stop());
      }
      activeRecorderSession = null;
    }

    function openAudioRecorderModal(zoneId) {
      cleanupRecorderSession();

      const overlay = document.createElement('div');
      overlay.id = 'recorder-overlay';
      overlay.className = 'fixed inset-0 z-50 flex items-center justify-center p-4';
      overlay.style.backgroundColor = 'var(--modal-backdrop)';

      overlay.innerHTML = `
        <div class="m-surface w-full max-w-md rounded-2xl shadow-2xl overflow-hidden" onclick="event.stopPropagation()">
          <div class="px-5 py-4 border-b m-border flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span id="aud-rec-dot" class="w-2.5 h-2.5 rounded-full bg-neutral-400"></span>
              <h3 class="font-bold text-base">Record Voice Note</h3>
            </div>
            <button type="button" id="aud-close-btn" class="w-8 h-8 rounded-lg btn-ghost flex items-center justify-center text-lg cursor-pointer">&times;</button>
          </div>

          <div class="p-5 space-y-4">
            <div class="p-4 rounded-xl m-subtle text-center space-y-2">
              <div id="aud-timer" class="text-3xl font-bold font-mono-num tracking-tight">00:00</div>
              <p id="aud-status" class="text-xs m-text-muted">Ready to record audio into Maalki Unified Repo</p>
              <canvas id="aud-waveform" width="340" height="56" class="w-full h-14 rounded-lg m-canvas border m-border mt-2"></canvas>
            </div>

            <div>
              <label class="block text-xs font-semibold m-text-sec mb-1">Recording Label / Caption</label>
              <input type="text" id="aud-caption" placeholder="e.g. Kitchen leak noise / Tenant walkthrough note" class="m-input" />
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
              <div class="flex items-center gap-2">
                <button type="button" id="aud-start-btn" class="btn-accent px-4 py-2 rounded-xl text-xs cursor-pointer">Start Recording</button>
                <button type="button" id="aud-pause-btn" class="hidden btn-ghost px-3 py-2 rounded-xl text-xs cursor-pointer">Pause</button>
                <button type="button" id="aud-stop-btn" class="hidden btn-accent px-4 py-2 rounded-xl text-xs cursor-pointer">Stop &amp; Save</button>
              </div>
              <label class="btn-ghost px-3 py-2 rounded-xl text-xs cursor-pointer">
                + Audio File
                <input type="file" id="aud-file-fallback" accept="audio/*" class="hidden" />
              </label>
            </div>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);

      const closeRecorder = () => {
        cleanupRecorderSession();
        overlay.remove();
      };

      overlay.querySelector('#aud-close-btn').onclick = closeRecorder;

      overlay.querySelector('#aud-file-fallback').onchange = async (e) => {
        const files = e.target.files;
        if (!files || !files.length) return;
        const caption = overlay.querySelector('#aud-caption').value.trim();
        try {
          const item = await MaalkiMediaStore.addMediaBlob(files[0], { kind: 'audio', caption });
          await appendMediaToDropzone(zoneId, item);
          showToast('Audio file saved to unified repository.');
          closeRecorder();
        } catch (err) {
          showToast(err.message || 'Could not save audio file.');
        }
      };

      const startBtn = overlay.querySelector('#aud-start-btn');
      const pauseBtn = overlay.querySelector('#aud-pause-btn');
      const stopBtn = overlay.querySelector('#aud-stop-btn');
      const timerEl = overlay.querySelector('#aud-timer');
      const statusEl = overlay.querySelector('#aud-status');
      const dotEl = overlay.querySelector('#aud-rec-dot');
      const canvas = overlay.querySelector('#aud-waveform');
      const ctx = canvas.getContext('2d');

      startBtn.onclick = async () => {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error('Microphone API unavailable. Use "+ Audio File" instead.');
          }
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const preferredMime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']
            .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';

          const recorder = preferredMime ? new MediaRecorder(stream, { mimeType: preferredMime }) : new MediaRecorder(stream);
          const chunks = [];
          let elapsedSec = 0;

          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioCtx.createMediaStreamSource(stream);
          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          source.connect(analyser);
          const dataArr = new Uint8Array(analyser.frequencyBinCount);

          function drawBars() {
            if (!activeRecorderSession) return;
            activeRecorderSession.animId = requestAnimationFrame(drawBars);
            analyser.getByteFrequencyData(dataArr);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / dataArr.length) * 0.75;
            let x = 4;
            for (let i = 0; i < dataArr.length; i++) {
              const h = Math.max(3, (dataArr[i] / 255) * (canvas.height - 10));
              ctx.fillStyle = '#00A7E1';
              ctx.fillRect(x, (canvas.height - h) / 2, barWidth, h);
              x += barWidth + 3;
            }
          }

          recorder.ondataavailable = (ev) => {
            if (ev.data && ev.data.size > 0) chunks.push(ev.data);
          };

          recorder.onstop = async () => {
            const finalMime = recorder.mimeType || preferredMime || 'audio/webm';
            const blob = new Blob(chunks, { type: finalMime });
            const caption = overlay.querySelector('#aud-caption').value.trim() || `Voice Note (${formatDuration(elapsedSec)})`;
            try {
              const item = await MaalkiMediaStore.addMediaBlob(blob, {
                kind: 'audio',
                mimeType: finalMime,
                durationSec: elapsedSec,
                caption
              });
              await appendMediaToDropzone(zoneId, item);
              showToast('Voice recording saved to unified repository.');
            } catch (err) {
              showToast(err.message || 'Failed to save audio recording.');
            }
            closeRecorder();
          };

          const timerId = setInterval(() => {
            if (recorder.state === 'recording') {
              elapsedSec++;
              timerEl.textContent = formatDuration(elapsedSec);
            }
          }, 1000);

          activeRecorderSession = { stream, recorder, timerId, audioCtx, animId: null };
          recorder.start(250);
          drawBars();

          startBtn.classList.add('hidden');
          pauseBtn.classList.remove('hidden');
          stopBtn.classList.remove('hidden');
          dotEl.style.backgroundColor = '#00A7E1';
          dotEl.classList.add('rec-dot');
          statusEl.textContent = 'Recording in progress…';
        } catch (err) {
          statusEl.textContent = err.message || 'Microphone access denied.';
          showToast(err.message || 'Microphone access denied.');
        }
      };

      pauseBtn.onclick = () => {
        if (!activeRecorderSession) return;
        const rec = activeRecorderSession.recorder;
        if (rec.state === 'recording') {
          rec.pause();
          pauseBtn.textContent = 'Resume';
          dotEl.classList.remove('rec-dot');
          statusEl.textContent = 'Recording paused';
        } else if (rec.state === 'paused') {
          rec.resume();
          pauseBtn.textContent = 'Pause';
          dotEl.classList.add('rec-dot');
          statusEl.textContent = 'Recording in progress…';
        }
      };

      stopBtn.onclick = () => {
        if (!activeRecorderSession) return;
        statusEl.textContent = 'Compressing & saving to unified repository…';
        stopBtn.disabled = true;
        activeRecorderSession.recorder.stop();
      };
    }

    /**
     * ==========================================================================
     * IN-APP VIDEO RECORDER MODAL (WITH LIVE CAMERA PREVIEW + FLIP + FILE FALLBACK)
     * ==========================================================================
     */
    function openVideoRecorderModal(zoneId) {
      cleanupRecorderSession();

      const overlay = document.createElement('div');
      overlay.id = 'recorder-overlay';
      overlay.className = 'fixed inset-0 z-50 flex items-center justify-center p-4';
      overlay.style.backgroundColor = 'var(--modal-backdrop)';

      overlay.innerHTML = `
        <div class="m-surface w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden" onclick="event.stopPropagation()">
          <div class="px-5 py-4 border-b m-border flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span id="vid-rec-dot" class="w-2.5 h-2.5 rounded-full bg-neutral-400"></span>
              <h3 class="font-bold text-base">Record Walkthrough Video</h3>
            </div>
            <button type="button" id="vid-close-btn" class="w-8 h-8 rounded-lg btn-ghost flex items-center justify-center text-lg cursor-pointer">&times;</button>
          </div>

          <div class="p-5 space-y-4">
            <div class="relative rounded-xl overflow-hidden bg-black aspect-video border m-border">
              <video id="vid-preview" autoplay muted playsinline class="w-full h-full object-cover"></video>
              <div class="absolute top-3 left-3 px-2.5 py-1 rounded-md bg-black/75 text-white text-xs font-mono-num flex items-center gap-1.5">
                <span id="vid-badge-dot" class="w-2 h-2 rounded-full bg-neutral-400"></span>
                <span id="vid-timer">00:00</span>
              </div>
              <button type="button" id="vid-flip-btn" class="absolute top-3 right-3 px-2.5 py-1 rounded-md bg-black/75 text-white text-xs border border-white/20 cursor-pointer">
                Flip Camera
              </button>
            </div>

            <p id="vid-status" class="text-xs m-text-muted">Initializing camera preview…</p>

            <div>
              <label class="block text-xs font-semibold m-text-sec mb-1">Video Caption</label>
              <input type="text" id="vid-caption" placeholder="e.g. Bathroom moisture & tap pressure walkthrough" class="m-input" />
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
              <div class="flex items-center gap-2">
                <button type="button" id="vid-start-btn" class="btn-accent px-4 py-2 rounded-xl text-xs cursor-pointer">Start Recording</button>
                <button type="button" id="vid-stop-btn" class="hidden btn-accent px-4 py-2 rounded-xl text-xs cursor-pointer">Stop &amp; Save</button>
              </div>
              <label class="btn-ghost px-3 py-2 rounded-xl text-xs cursor-pointer">
                + Video File
                <input type="file" id="vid-file-fallback" accept="video/*" capture="environment" class="hidden" />
              </label>
            </div>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);

      let facingMode = 'environment';
      const previewEl = overlay.querySelector('#vid-preview');
      const statusEl = overlay.querySelector('#vid-status');
      const timerEl = overlay.querySelector('#vid-timer');
      const startBtn = overlay.querySelector('#vid-start-btn');
      const stopBtn = overlay.querySelector('#vid-stop-btn');
      const dotEl = overlay.querySelector('#vid-rec-dot');
      const badgeDot = overlay.querySelector('#vid-badge-dot');

      const closeRecorder = () => {
        cleanupRecorderSession();
        overlay.remove();
      };

      overlay.querySelector('#vid-close-btn').onclick = closeRecorder;

      overlay.querySelector('#vid-file-fallback').onchange = async (e) => {
        const files = e.target.files;
        if (!files || !files.length) return;
        const caption = overlay.querySelector('#vid-caption').value.trim();
        statusEl.textContent = 'Processing video & generating thumbnail…';
        try {
          const item = await MaalkiMediaStore.addMediaBlob(files[0], { kind: 'video', caption });
          await appendMediaToDropzone(zoneId, item);
          showToast('Video saved to unified repository.');
          closeRecorder();
        } catch (err) {
          showToast(err.message || 'Could not save video file.');
        }
      };

      async function initCameraStream() {
        try {
          if (activeRecorderSession?.stream) {
            activeRecorderSession.stream.getTracks().forEach(t => t.stop());
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error('Camera API unavailable. Use "+ Video File" to capture or upload.');
          }
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: true
          });
          previewEl.srcObject = stream;
          activeRecorderSession = { stream, recorder: null, timerId: null };
          statusEl.textContent = 'Camera ready. Tap "Start Recording" when ready.';
        } catch (err) {
          statusEl.textContent = err.message || 'Camera unavailable. Use "+ Video File" button.';
        }
      }

      overlay.querySelector('#vid-flip-btn').onclick = async () => {
        if (activeRecorderSession?.recorder && activeRecorderSession.recorder.state === 'recording') return;
        facingMode = facingMode === 'environment' ? 'user' : 'environment';
        await initCameraStream();
      };

      startBtn.onclick = () => {
        if (!activeRecorderSession || !activeRecorderSession.stream) {
          showToast('Camera stream not ready. Use "+ Video File" instead.');
          return;
        }
        const stream = activeRecorderSession.stream;
        const preferredMime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
          .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';

        const recorder = preferredMime
          ? new MediaRecorder(stream, { mimeType: preferredMime, videoBitsPerSecond: 1200000 })
          : new MediaRecorder(stream);

        const chunks = [];
        let elapsedSec = 0;

        recorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) chunks.push(ev.data);
        };

        recorder.onstop = async () => {
          const finalMime = recorder.mimeType || preferredMime || 'video/webm';
          const blob = new Blob(chunks, { type: finalMime });
          const caption = overlay.querySelector('#vid-caption').value.trim() || `Walkthrough Video (${formatDuration(elapsedSec)})`;

          let posterUrl = null;
          try {
            const pCanvas = document.createElement('canvas');
            pCanvas.width = 480;
            pCanvas.height = 270;
            pCanvas.getContext('2d').drawImage(previewEl, 0, 0, 480, 270);
            posterUrl = pCanvas.toDataURL('image/jpeg', 0.72);
          } catch (e) { /* fallback to metadata extraction */ }

          try {
            const item = await MaalkiMediaStore.addMediaBlob(blob, {
              kind: 'video',
              mimeType: finalMime,
              durationSec: elapsedSec,
              posterUrl,
              caption
            });
            await appendMediaToDropzone(zoneId, item);
            showToast('Walkthrough video saved to unified repository.');
          } catch (err) {
            showToast(err.message || 'Video exceeded repository cap.');
          }
          closeRecorder();
        };

        const timerId = setInterval(() => {
          if (recorder.state === 'recording') {
            elapsedSec++;
            timerEl.textContent = formatDuration(elapsedSec);
          }
        }, 1000);

        activeRecorderSession.recorder = recorder;
        activeRecorderSession.timerId = timerId;
        recorder.start(300);

        startBtn.classList.add('hidden');
        stopBtn.classList.remove('hidden');
        dotEl.style.backgroundColor = '#00A7E1';
        dotEl.classList.add('rec-dot');
        badgeDot.style.backgroundColor = '#00A7E1';
        badgeDot.classList.add('rec-dot');
        statusEl.textContent = 'Recording walkthrough video…';
      };

      stopBtn.onclick = () => {
        if (!activeRecorderSession?.recorder) return;
        statusEl.textContent = 'Saving video to unified repository…';
        stopBtn.disabled = true;
        activeRecorderSession.recorder.stop();
      };

      initCameraStream();
    }

    /**

              </div>
              <div class="min-w-0">
                <span class="text-[11px] font-mono-num uppercase tracking-wider" style="color: #00A7E1;">Audio Recording • ${formatDuration(item.durationSec)}</span>

              <div class="flex gap-1.5">
                ${[1, 1.25, 1.5, 2].map(spd => `
                  <button type="button" onclick="const p=document.getElementById('lb-media-player'); if(p) p.playbackRate=${spd};" class="px-2 py-0.5 rounded bg-neutral-800 hover:bg-neutral-700 text-white font-mono-num cursor-pointer">${spd}x</button>
                `).join('')}
              </div>
            </div>

        `;
      } else if (item.kind === 'video') {
        viewerMarkup = `
          <div class="w-full max-w-3xl space-y-2">
            <video id="lb-media-player" controls autoplay playsinline src="${item.dataUrl}" ${item.posterUrl ? `poster="${item.posterUrl}"` : ''} class="w-full max-h-[68vh] rounded-xl bg-black border border-neutral-800"></video>

                <button type="button" onclick="const p=document.getElementById('lb-media-player'); if(p) p.playbackRate=${spd};" class="px-2 py-0.5 rounded bg-neutral-800 hover:bg-neutral-700 text-white font-mono-num cursor-pointer">${spd}x</button>
              `).join('')}
            </div>
          </div>
        `;
      } else {
        viewerMarkup = `
          <img id="lb-img" src="${item.dataUrl}" alt="${escapeHtml(item.caption)}" class="max-h-[72vh] max-w-full rounded-xl object-contain transition-transform duration-200 cursor-zoom-in" onclick="this.classList.toggle('scale-150')" />
        `;
      }

      const extMap = { image: 'jpg', audio: 'webm', video: 'webm' };
      const ext = extMap[item.kind] || 'bin';

      root.innerHTML = `
        <div class="max-w-4xl w-full flex flex-col items-center gap-4" onclick="event.stopPropagation()">
          <div class="w-full flex items-center justify-between text-white text-xs px-2">

            </div>
            <button onclick="closeLightbox()" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white font-semibold cursor-pointer">Close &times;</button>
          </div>

            ${viewerMarkup}

            <input type="text" value="${escapeHtml(item.caption)}" onchange="MaalkiMediaStore.updateCaption('${item.id}', this.value); showToast('Caption updated');" class="flex-1 bg-neutral-800 text-white text-xs px-3 py-2 rounded-lg border border-neutral-700 outline-none" placeholder="Caption..." />

          </div>
        </div>
      `;
      root.classList.remove('hidden');
      root.classList.add('flex');
      root.onclick = () => closeLightbox();
    }

      const view = appState.currentView || 'dashboard';
      const meta = VIEW_META[view] || VIEW_META.dashboard;

      const dTitle = document.getElementById('desktop-page-title');
      const dDesc = document.getElementById('desktop-page-desc');
      const mSub = document.getElementById('mobile-page-subtitle');
      if (dTitle) dTitle.textContent = meta.title;

      document.querySelectorAll('.nav-btn').forEach(btn => {

      else if (view === 'properties') container.innerHTML = renderPropertiesView();

          </div>
        </div>
      `, 'max-w-md');
    }

    async function executeDeleteProperty(propertyId) {
      const prop = appState.properties.find(p => p.id === propertyId);
      if (!prop) return;

      const propInspections = appState.inspections.filter(i => i.propertyId === propertyId);
      const propTasks = appState.tasks.filter(t => t.propertyId === propertyId);
      const propTransactions = appState.transactions.filter(tx => tx.propertyId === propertyId);

      await MaalkiMediaStore.archivePropertyDossier(prop, {
        inspections: propInspections,
        tasks: propTasks,
        transactions: propTransactions
      });

      appState.properties = appState.properties.filter(p => p.id !== propertyId);
      appState.inspections = appState.inspections.filter(i => i.propertyId !== propertyId);
      appState.tasks = appState.tasks.filter(t => t.propertyId !== propertyId);
      appState.transactions = appState.transactions.filter(tx => tx.propertyId !== propertyId);

      logActivity(`Removed ${prop.name} from active portfolio (archived pfile_${prop.id}.json)`);
      saveState();
      closeModal();
      renderCurrentView();
      showToast(`${prop.name} removed from Maalki. File pfile_${prop.id}.json preserved in repo.`);
    }

    function quickLogRent(propertyId) {
      const prop = appState.properties.find(p => p.id === propertyId);
      if (!prop) return;
      const today = new Date().toISOString().slice(0, 10);
      appState.transactions.unshift({
        id: 'tx_' + Date.now(),
        date: today,
        propertyId: prop.id,
        type: 'Income',
        category: 'Rental Income',
        description: `${prop.rentFrequency} Rent — ${prop.tenantName || 'Tenant'}`,
        amount: prop.rentAmount,
        taxPeriod: 'FY2026',
        mediaIds: []
      });
      logActivity(`Logged ${formatCurrency(prop.rentAmount)} rent for ${prop.name}`);
      saveState();
      syncPropertyDossier(prop.id);
      renderCurrentView();
      showToast(`Logged ${formatCurrency(prop.rentAmount)} rent to Tax Ledger.`);
    }

                      </button>
                    `).join('')}
                  </div>
                </div>

                <!-- Sub-Checklist Items -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  ${(room.checks || []).map((chk, cIdx) => `
                    <label class="flex items-center gap-2.5 p-2.5 rounded-xl m-subtle text-xs cursor-pointer">
                      <input type="checkbox" ${chk.ok ? 'checked' : ''} onchange="toggleRoomCheck('${insp.id}', ${rIdx}, ${cIdx}, this.checked)" class="w-4 h-4 accent-[#00A7E1] rounded" />
                      <span class="${chk.ok ? '' : 'line-through m-text-muted'}">${escapeHtml(chk.label)}</span>
                    </label>
                  `).join('')}
                </div>

                <!-- Room Notes -->
                <div>
                  <label class="block text-xs font-semibold m-text-sec mb-1">Room Condition Notes</label>
                  <input type="text" value="${escapeHtml(room.notes || '')}" onchange="updateRoomNotes('${insp.id}', ${rIdx}, this.value)" placeholder="Describe cleanliness, wear & tear, or maintenance needed..." class="m-input" />
                </div>

                <!-- Room Multimedia Dropzone (Photos, Audio & Video) -->
                <div id="room-dz-${room.id}"></div>
              </div>
            `).join('')}
          </div>

          <!-- Add Custom Room Section -->
          <div class="m-surface p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3">
            <span class="text-xs m-text-sec">Need another section (e.g., Garage, Deck, Pool, Granny Flat)?</span>
            <button onclick="addCustomRoomToInspection('${insp.id}')" class="btn-ghost px-4 py-2 rounded-xl text-xs cursor-pointer">+ Add Custom Room Section</button>
          </div>
        </div>
      `;
    }

    function updateInspectionField(inspId, field, value) {
      const insp = appState.inspections.find(i => i.id === inspId);
      if (!insp) return;
      insp[field] = value;
      saveState();
      syncPropertyDossier(insp.propertyId);
      showToast('Inspection saved.');
    }

    function setRoomRating(inspId, roomIdx, rating) {
      const insp = appState.inspections.find(i => i.id === inspId);
      if (!insp || !insp.rooms[roomIdx]) return;
      insp.rooms[roomIdx].rating = rating;
      saveState();
      syncPropertyDossier(insp.propertyId);
      renderCurrentView();
    }

    function toggleRoomCheck(inspId, roomIdx, checkIdx, checked) {
      const insp = appState.inspections.find(i => i.id === inspId);
      if (!insp || !insp.rooms[roomIdx]) return;
      insp.rooms[roomIdx].checks[checkIdx].ok = checked;
      saveState();
      syncPropertyDossier(insp.propertyId);
      renderCurrentView();
    }

    function updateRoomNotes(inspId, roomIdx, notes) {
      const insp = appState.inspections.find(i => i.id === inspId);
      if (!insp || !insp.rooms[roomIdx]) return;
      insp.rooms[roomIdx].notes = notes;
      saveState();
      syncPropertyDossier(insp.propertyId);
    }

    function addCustomRoomToInspection(inspId) {
      const insp = appState.inspections.find(i => i.id === inspId);
      if (!insp) return;
      const num = insp.rooms.length + 1;
      insp.rooms.push({
        id: 'custom_' + Date.now(),
        name: `${num}. Garage / Outdoor Storage`,
        rating: 'Good',
        notes: '',
        checks: [
          { label: 'Roller door / locks & remotes', ok: true },
          { label: 'Flooring, walls & moisture check', ok: true }
        ],
        mediaIds: []
      });
      saveState();
      syncPropertyDossier(insp.propertyId);
      renderCurrentView();
      showToast('Added custom room section.');
    }

    function exportFlaggedRoomsToMaintenance(inspId) {
      const insp = appState.inspections.find(i => i.id === inspId);
      if (!insp) return;
      const flagged = (insp.rooms || []).filter(r => r.rating === 'Needs Repair' || r.rating === 'Urgent');
      if (flagged.length === 0) {
        showToast('No rooms are currently rated "Needs Repair" or "Urgent".');
        return;
      }
      flagged.forEach(room => {
        appState.tasks.unshift({
          id: 'tsk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          propertyId: insp.propertyId,
          title: `Inspection Follow-Up: ${room.name}`,
          category: 'Repair',
          priority: room.rating === 'Urgent' ? 'Urgent' : 'Normal',
          estimatedCost: 0,
          dueDate: new Date().toISOString().slice(0, 10),
          completed: false,
          notes: room.notes || `Flagged during ${insp.type} on ${insp.date}`,
          mediaIds: [...(room.mediaIds || [])]
        });
      });
      logActivity(`Exported ${flagged.length} inspection issue(s) to Maintenance list`);
      saveState();
      syncPropertyDossier(insp.propertyId);
      showToast(`Created ${flagged.length} maintenance task(s) from flagged rooms.`);
    }

    /**
     * ==========================================================================
     * 12. VIEW 4: MAINTENANCE & SHOPPING LIST
     * ==========================================================================
     */
    function renderMaintenanceView() {
      const filter = appState.maintenanceFilter || 'all';
      const filteredTasks = appState.tasks.filter(t => {
        if (filter === 'open') return !t.completed;
        if (filter === 'completed') return t.completed;
        if (filter === 'urgent') return !t.completed && t.priority === 'Urgent';
        return true;
      });

      const totalEstimatedOpen = appState.tasks
        .filter(t => !t.completed)
        .reduce((sum, t) => sum + (Number(t.estimatedCost) || 0), 0);

      const propSelectOptions = appState.properties.length > 0
        ? appState.properties.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')
        : `<option value="general">General Portfolio</option>`;

      return `
        <div class="space-y-5">
          <!-- Fast Shopping-List Quick Add Bar -->
          <div class="m-surface p-4 sm:p-5 rounded-2xl">
            <h2 class="text-sm font-bold mb-3">Quick Add Maintenance Task or Supply Item</h2>
            <form onsubmit="handleQuickAddTask(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
              <input type="text" name="title" required placeholder="e.g. Buy 2x photoelectric smoke alarms & plumber tape..." class="m-input sm:col-span-5" />
              <select name="propertyId" class="m-input sm:col-span-3">
                ${propSelectOptions}
              </select>
              <select name="priority" class="m-input sm:col-span-2">
                <option value="Normal">Normal</option>
                <option value="Urgent">Urgent</option>
                <option value="Low">Low</option>
              </select>
              <div class="sm:col-span-2 flex gap-2">
                <input type="number" name="estimatedCost" min="0" step="1" placeholder="$ Est." class="m-input font-mono-num" />
                <button type="submit" class="btn-accent px-4 rounded-xl text-xs shrink-0 cursor-pointer">Add</button>
              </div>
            </form>
          </div>

          <!-- Filter Pills & Summary -->
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap gap-1.5">
              ${[
                { id: 'all', label: `All (${appState.tasks.length})` },
                { id: 'open', label: `Open (${appState.tasks.filter(t => !t.completed).length})` },
                { id: 'urgent', label: `Urgent (${appState.tasks.filter(t => !t.completed && t.priority === 'Urgent').length})` },
                { id: 'completed', label: `Completed (${appState.tasks.filter(t => t.completed).length})` }
              ].map(tab => `
                <button onclick="appState.maintenanceFilter='${tab.id}'; renderCurrentView();" class="px-3 py-1.5 rounded-xl text-xs border transition-colors cursor-pointer ${filter === tab.id ? 'nav-item-active' : 'm-surface m-text-sec'}">
                  ${tab.label}
                </button>
              `).join('')}
            </div>
            <span class="text-xs m-text-muted font-mono-num">Open Est. Spend: <strong class="m-text">${formatCurrency(totalEstimatedOpen)}</strong></span>
          </div>

          <!-- Checklist Items -->
          ${filteredTasks.length === 0 ? `
            <div class="m-surface p-8 rounded-2xl text-center text-xs m-text-muted">
              No maintenance tasks or supply items in this view. Use the quick-add bar above to add one.
            </div>
          ` : `
            <div class="space-y-2.5">
              ${filteredTasks.map(task => {
                const mediaCount = (task.mediaIds || []).length;
                return `
                  <div class="m-surface p-4 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${task.completed ? 'opacity-65' : ''}">
                    <div class="flex items-start gap-3">
                      <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTaskCompleted('${task.id}', this.checked)" class="w-5 h-5 mt-0.5 accent-[#00A7E1] rounded cursor-pointer" />
                      <div>
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="font-semibold text-sm ${task.completed ? 'line-through m-text-muted' : ''}">${escapeHtml(task.title)}</span>
                          ${task.priority === 'Urgent' ? `<span class="pill-accent text-[10px] font-bold px-2 py-0.5 rounded-full">URGENT</span>` : ''}
                          <span class="text-[11px] px-2 py-0.5 rounded-md m-subtle">${escapeHtml(getPropertyName(task.propertyId))}</span>
                        </div>
                        ${task.notes ? `<p class="text-xs m-text-muted mt-1">${escapeHtml(task.notes)}</p>` : ''}
                        <div class="flex items-center gap-3 mt-1.5 text-[11px] m-text-muted font-mono-num">
                          <span>Due: ${escapeHtml(task.dueDate || 'Flexible')}</span>
                          <span>&bull;</span>
                          <span>${mediaCount} media item(s)</span>
                        </div>
                      </div>
                    </div>

                    <div class="flex items-center justify-between sm:justify-end gap-2 pl-8 sm:pl-0">
                      <span class="font-mono-num font-bold text-sm mr-2">${formatCurrency(task.estimatedCost)}</span>
                      <button onclick="openTaskDetailModal('${task.id}')" class="btn-ghost px-3 py-1.5 rounded-lg text-xs cursor-pointer">Media / Edit</button>
                      ${task.completed ? `
                        <button onclick="convertTaskToTaxExpense('${task.id}')" class="btn-accent px-3 py-1.5 rounded-lg text-xs cursor-pointer">Log to Tax</button>
                      ` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function handleQuickAddTask(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const newTask = {
        id: 'tsk_' + Date.now(),
        propertyId: fd.get('propertyId'),
        title: fd.get('title').trim(),
        category: 'Maintenance & Supplies',
        priority: fd.get('priority'),
        estimatedCost: Number(fd.get('estimatedCost')) || 0,
        dueDate: new Date().toISOString().slice(0, 10),
        completed: false,
        notes: '',
        mediaIds: []
      };
      appState.tasks.unshift(newTask);
      logActivity(`Added list item: ${newTask.title}`);
      saveState();
      syncPropertyDossier(newTask.propertyId);
      renderCurrentView();
      showToast('Added to maintenance & supply list.');
    }

    function toggleTaskCompleted(taskId, completed) {
      const task = appState.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.completed = completed;
      saveState();
      syncPropertyDossier(task.propertyId);
      renderCurrentView();
    }

    function openTaskDetailModal(taskId) {
      const task = appState.tasks.find(t => t.id === taskId);
      if (!task) return;
      let mediaIds = [...(task.mediaIds || [])];

      const propOptions = appState.properties.length > 0
        ? appState.properties.map(p => `<option value="${p.id}" ${p.id === task.propertyId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')
        : `<option value="general">General Portfolio</option>`;

      openModal(`
        <div class="px-6 py-4 border-b m-border flex items-center justify-between">
          <h3 class="font-bold text-base">Task &amp; Supply Details</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg btn-ghost flex items-center justify-center text-lg cursor-pointer">&times;</button>
        </div>
        <form id="task-edit-form" class="p-6 space-y-4 text-sm">
          <div>
            <label class="block text-xs font-semibold m-text-sec mb-1">Item / Task Title *</label>
            <input type="text" name="title" required value="${escapeHtml(task.title)}" class="m-input" />
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-semibold m-text-sec mb-1">Property</label>
              <select name="propertyId" class="m-input">${propOptions}</select>
            </div>
            <div>
              <label class="block text-xs font-semibold m-text-sec mb-1">Priority</label>
              <select name="priority" class="m-input">
                ${['Normal', 'Urgent', 'Low'].map(pr => `<option value="${pr}" ${task.priority === pr ? 'selected' : ''}>${pr}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold m-text-sec mb-1">Estimated Cost ($)</label>
              <input type="number" name="estimatedCost" step="0.01" value="${task.estimatedCost}" class="m-input font-mono-num" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold m-text-sec mb-1">Notes / Supplier Details</label>
            <textarea name="notes" rows="2" class="m-input">${escapeHtml(task.notes || '')}</textarea>
          </div>
          <div id="task-media-dz"></div>
          <div class="pt-3 border-t m-border flex justify-between gap-2">
            <button type="button" onclick="deleteTask('${task.id}')" class="btn-ghost px-3.5 py-2 rounded-xl text-xs cursor-pointer">Delete Item</button>
            <div class="flex gap-2">
              <button type="button" onclick="closeModal()" class="btn-ghost px-4 py-2 rounded-xl text-xs cursor-pointer">Cancel</button>
              <button type="submit" class="btn-accent px-5 py-2 rounded-xl text-xs cursor-pointer">Save Task</button>
            </div>
          </div>
        </form>
      `);

      const refreshDz = () => {
        const el = document.getElementById('task-media-dz');
        if (!el) return;
        el.innerHTML = renderMediaDropzone({
          zoneId: `task-zone-${task.id}`,
          mediaIds,
          label: 'Before / After Photos, Voice Notes & Video',
          compact: true,
          onChange: (next) => {
            mediaIds = next;
            refreshDz();
          }
        });
      };
      refreshDz();

      document.getElementById('task-edit-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        task.title = fd.get('title').trim();
        task.propertyId = fd.get('propertyId');
        task.priority = fd.get('priority');
        task.estimatedCost = Number(fd.get('estimatedCost')) || 0;
        task.notes = fd.get('notes').trim();
        task.mediaIds = mediaIds;
        saveState();
        syncPropertyDossier(task.propertyId);
        closeModal();
        renderCurrentView();
        showToast('Task updated.');
      };
    }

    function deleteTask(taskId) {
      const existing = appState.tasks.find(t => t.id === taskId);
      appState.tasks = appState.tasks.filter(t => t.id !== taskId);
      saveState();
      if (existing) syncPropertyDossier(existing.propertyId);
      closeModal();
      renderCurrentView();
      showToast('Task deleted.');
    }

    function convertTaskToTaxExpense(taskId) {
      const task = appState.tasks.find(t => t.id === taskId);
      if (!task) return;
      openTransactionModal('Expense', {
        propertyId: task.propertyId,
        category: 'Repairs & Maintenance',
        description: task.title,
        amount: task.estimatedCost,
        mediaIds: [...(task.mediaIds || [])]
      });
    }

    /**
     * ==========================================================================
     * 13. VIEW 5: FINANCIALS & RENTAL TAX RETURNS
     * ==========================================================================
     */
    const TAX_EXPENSE_CATEGORIES = [
      'Repairs & Maintenance',
      'Council Rates & Water',
      'Landlord & Building Insurance',
      'Mortgage Interest & Bank Fees',
      'Property Management & Letting Fees',
      'Accounting, Legal & Compliance',
      'Utilities & Body Corporate',
      'Capital Improvements / Depreciation'
    ];

    function renderTaxView() {
      const period = appState.taxPeriodFilter || 'FY2026';
      const filteredTx = period === 'ALL'
        ? appState.transactions
        : appState.transactions.filter(t => t.taxPeriod === period);

      const grossIncome = filteredTx.filter(t => t.type === 'Income').reduce((s, t) => s + t.amount, 0);
      const totalDeductions = filteredTx.filter(t => t.type === 'Expense').reduce((s, t) => s + t.amount, 0);
      const netTaxable = grossIncome - totalDeductions;

      const byCategory = {};
      TAX_EXPENSE_CATEGORIES.forEach(cat => { byCategory[cat] = 0; });
      filteredTx.filter(t => t.type === 'Expense').forEach(tx => {
        byCategory[tx.category] = (byCategory[tx.category] || 0) + tx.amount;
      });

      return `
        <div class="space-y-5">
          <!-- Tax Year Selector & Export Actions -->
          <div class="m-surface p-4 sm:p-5 rounded-2xl flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-2.5">
              <span class="text-xs font-bold uppercase tracking-wider m-text-muted">Tax Period:</span>
              <select onchange="appState.taxPeriodFilter=this.value; saveState(); renderCurrentView();" class="m-input !w-auto text-xs font-semibold">
                <option value="FY2026" ${period === 'FY2026' ? 'selected' : ''}>FY 2026–2027 (Current)</option>
                <option value="FY2025" ${period === 'FY2025' ? 'selected' : ''}>FY 2025–2026</option>
                <option value="CY2026" ${period === 'CY2026' ? 'selected' : ''}>Calendar Year 2026</option>
                <option value="ALL" ${period === 'ALL' ? 'selected' : ''}>All Recorded Periods</option>
              </select>
            </div>

            <div class="flex flex-wrap gap-2">
              <button onclick="openTransactionModal('Income')" class="btn-ghost px-3.5 py-2 rounded-xl text-xs cursor-pointer">+ Record Rental Income</button>
              <button onclick="openTransactionModal('Expense')" class="btn-ghost px-3.5 py-2 rounded-xl text-xs cursor-pointer">+ Record Deductible Expense</button>
              <button onclick="printTaxReturnPack('${period}')" class="btn-accent px-4 py-2 rounded-xl text-xs cursor-pointer">Export Tax Return Pack (Print / PDF)</button>
            </div>
          </div>

          <!-- Tax Return Summary Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="m-surface p-5 rounded-2xl">
              <span class="text-xs font-medium m-text-muted">Gross Assessable Rental Income</span>
              <span class="text-2xl font-bold font-mono-num block mt-2">${formatCurrency(grossIncome)}</span>
            </div>
            <div class="m-surface p-5 rounded-2xl">
              <span class="text-xs font-medium m-text-muted">Total Deductible Expenses</span>
              <span class="text-2xl font-bold font-mono-num block mt-2">${formatCurrency(totalDeductions)}</span>
            </div>
            <div class="m-surface p-5 rounded-2xl border-l-4" style="border-left-color: #00A7E1;">
              <span class="text-xs font-medium m-text-muted">Net Taxable Rental Income</span>
              <span class="text-2xl font-bold font-mono-num block mt-2" style="color: #00A7E1;">${formatCurrency(netTaxable)}</span>
            </div>
          </div>

          <!-- Deduction Breakdown & Ledger -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <!-- Schedule of Tax Deductions -->
            <div class="m-surface rounded-2xl overflow-hidden">
              <div class="px-5 py-4 border-b m-border">
                <h3 class="font-bold text-sm">Deductions by Tax Category</h3>
              </div>
              <div class="divide-y m-border text-xs">
                ${Object.entries(byCategory).map(([cat, amt]) => `
                  <div class="px-5 py-3 flex items-center justify-between gap-2">
                    <span class="m-text-sec">${escapeHtml(cat)}</span>
                    <span class="font-mono-num font-semibold">${formatCurrency(amt)}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Itemized Ledger with Pinned Receipts -->
            <div class="lg:col-span-2 m-surface rounded-2xl overflow-hidden">
              <div class="px-5 py-4 border-b m-border flex items-center justify-between">
                <h3 class="font-bold text-sm">Itemized Tax Ledger (${filteredTx.length})</h3>
                <span class="text-[11px] m-text-muted">Pin receipts to lock against Auto-Rollover</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr class="border-b m-border m-subtle m-text-muted">
                      <th class="py-3 px-4 font-semibold">Date</th>
                      <th class="py-3 px-4 font-semibold">Property &amp; Description</th>
                      <th class="py-3 px-4 font-semibold">Category</th>
                      <th class="py-3 px-4 font-semibold">Evidence</th>
                      <th class="py-3 px-4 font-semibold text-right">Amount</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y m-border">
                    ${filteredTx.length === 0 ? `
                      <tr><td colspan="5" class="py-8 text-center m-text-muted">No financial entries recorded for this tax period yet.</td></tr>
                    ` : filteredTx.map(tx => {
                      const receipts = (tx.mediaIds || []).map(id => MaalkiMediaStore.getMedia(id)).filter(Boolean);
                      return `
                        <tr>
                          <td class="py-3 px-4 font-mono-num whitespace-nowrap">${escapeHtml(tx.date)}</td>
                          <td class="py-3 px-4">
                            <span class="font-semibold block">${escapeHtml(tx.description)}</span>
                            <span class="text-[11px] m-text-muted">${escapeHtml(getPropertyName(tx.propertyId))}</span>
                          </td>
                          <td class="py-3 px-4">
                            <span class="px-2 py-0.5 rounded-md m-subtle text-[11px]">${escapeHtml(tx.category)}</span>
                          </td>
                          <td class="py-3 px-4">
                            ${receipts.length > 0 ? `
                              <div class="flex items-center gap-1.5">
                                ${receipts.map(r => `
                                  <button type="button" onclick="openMediaLightbox('${r.id}')" class="px-2 py-1 rounded border m-border m-subtle text-[10px] font-mono-num cursor-pointer hover:border-[#00A7E1]">
                                    ${r.kind.toUpperCase()}
                                  </button>
                                `).join('')}
                              </div>
                            ` : `<span class="m-text-muted">—</span>`}
                          </td>
                          <td class="py-3 px-4 font-mono-num font-bold text-right whitespace-nowrap" style="${tx.type === 'Income' ? 'color: #00A7E1;' : ''}">
                            ${tx.type === 'Income' ? '+' : '-'}${formatCurrency(tx.amount)}
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function openTransactionModal(defaultType = 'Expense', prefill = {}) {
      let mediaIds = [...(prefill.mediaIds || [])];
      const propOptions = appState.properties.length > 0
        ? appState.properties.map(p => `<option value="${p.id}" ${p.id === prefill.propertyId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')
        : `<option value="general">General Portfolio</option>`;

      openModal(`
        <div class="px-6 py-4 border-b m-border flex items-center justify-between">
          <h3 class="font-bold text-base">Record Financial / Tax Entry</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg btn-ghost flex items-center justify-center text-lg cursor-pointer">&times;</button>
        </div>
        <form id="tx-form" class="p-6 space-y-4 text-sm">

    function exportFullBackup() {
      const payload = {
        app: 'Maalki',
        version: 2,
        exportedAt: new Date().toISOString(),
        state: appState,
        media: MaalkiMediaStore.getAllMedia(),
        propertyDossiers: MaalkiMediaStore.getAllDossiers()
      };
      const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `maalki-unified-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Exported complete unified backup.');
    }

    function importFullBackup(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.state) {
            appState = parsed.state;
            saveState();
          }
          if (Array.isArray(parsed.media)) {
            await MaalkiMediaStore.importAll(parsed.media);
          } else if (Array.isArray(parsed.photos)) {
            await MaalkiMediaStore.importAll(parsed.photos);
          }
          if (Array.isArray(parsed.propertyDossiers)) {
            for (const doc of parsed.propertyDossiers) {
              await MaalkiMediaStore.importDossierDirect(doc);
            }
          }
          closeModal();
          renderCurrentView();
          showToast('Unified backup restored successfully.');
        } catch (err) {
          showToast('Invalid backup JSON file.');
        }
      };
      reader.readAsText(file);
    }

        const mediaItems = (room.mediaIds || []).map(id => MaalkiMediaStore.getMedia(id)).filter(Boolean);

        const videos = mediaItems.filter(m => m.kind === 'video');
        const audios = mediaItems.filter(m => m.kind === 'audio');

        return `
          <div class="print-avoid-break" style="border:1px solid #D1D5DB; border-radius:8px; padding:12px; margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #E5E7EB; padding-bottom:6px; margin-bottom:8px;">

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; font-size:9.5pt; margin-bottom:8px;">

                <div>${c.ok ? '&#9745;' : '&#9744;'} ${escapeHtml(c.label)}</div>
              `).join('')}
            </div>
            ${room.notes ? `<div style="font-size:9.5pt; background:#F9FAFB; padding:6px 8px; border-radius:4px; margin-bottom:8px;"><strong>Notes:</strong> ${escapeHtml(room.notes)}</div>` : ''}
            ${(photos.length > 0 || videos.length > 0) ? `
              <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:6px;">
                ${photos.map(p => `
                  <div>
                    <img src="${p.dataUrl}" style="width:100%; height:110px; object-fit:cover; border-radius:4px; border:1px solid #D1D5DB;" />
                    <div style="font-size:8pt; color:#4B5563; margin-top:2px;">[PHOTO] ${escapeHtml(p.caption)}</div>
                  </div>
                `).join('')}
                ${videos.map(v => `
                  <div>
                    ${v.posterUrl
                      ? `<img src="${v.posterUrl}" style="width:100%; height:110px; object-fit:cover; border-radius:4px; border:1px solid #00A7E1;" />`
                      : `<div style="width:100%; height:110px; border-radius:4px; border:1px solid #00A7E1; display:flex; align-items:center; justify-content:center; font-size:9pt; background:#F0F9FF;">Walkthrough Video</div>`
                    }
                    <div style="font-size:8pt; color:#00A7E1; font-weight:600; margin-top:2px;">[VIDEO &bull; ${formatDuration(v.durationSec)}] ${escapeHtml(v.caption)}</div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
            ${audios.length > 0 ? `
              <div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:6px;">
                ${audios.map(a => `
                  <span style="display:inline-block; border:1px solid #00A7E1; background:#F0F9FF; color:#111315; padding:3px 8px; border-radius:4px; font-size:8.5pt;">
                    <strong>[AUDIO NOTE &bull; ${formatDuration(a.durationSec)}]</strong> ${escapeHtml(a.caption)}
                  </span>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      triggerPrintDocument(`
        <div style="font-family:Inter, sans-serif; color:#111315;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #00A7E1; padding-bottom:12px; margin-bottom:16px;">
            <div>
              <div style="font-size:18pt; font-weight:700; letter-spacing:-0.02em;">Maalki <span style="color:#00A7E1;">Inspection Report</span></div>
              <div style="font-size:9.5pt; color:#4B5563; margin-top:2px;">Residential Property Condition &amp; Compliance Log</div>
            </div>
            <div style="text-align:right; font-size:9pt;">
              <div><strong>Date:</strong> ${escapeHtml(insp.date)}</div>
              <div><strong>Type:</strong> ${escapeHtml(insp.type)}</div>
              <div><strong>Inspector:</strong> ${escapeHtml(insp.inspector)}</div>
            </div>
          </div>

          <div style="background:#F3F4F6; padding:10px 14px; border-radius:6px; margin-bottom:14px; font-size:9.5pt;">
            <div><strong>Property:</strong> ${escapeHtml(prop?.name || getPropertyName(insp.propertyId))} — ${escapeHtml(prop?.address || '')}</div>
            <div style="margin-top:4px;"><strong>Tenant:</strong> ${escapeHtml(prop?.tenantName || 'Vacant')} &nbsp;|&nbsp; <strong>Status:</strong> ${escapeHtml(insp.status)}</div>
            ${insp.summaryNotes ? `<div style="margin-top:6px;"><strong>Executive Summary:</strong> ${escapeHtml(insp.summaryNotes)}</div>` : ''}
          </div>

          ${roomsHtml}

          <div class="print-avoid-break" style="margin-top:24px; padding-top:14px; border-top:1px solid #9CA3AF; display:grid; grid-template-columns:1fr 1fr; gap:32px; font-size:9.5pt;">
            <div>
              <div style="height:36px; border-bottom:1px solid #374151;"></div>
              <div style="margin-top:4px;">Property Manager / Inspector Signature &amp; Date</div>
            </div>
            <div>
              <div style="height:36px; border-bottom:1px solid #374151;"></div>
              <div style="margin-top:4px;">Tenant Acknowledgement Signature &amp; Date</div>
            </div>
          </div>
        </div>
      `);
    }

    function printTaxReturnPack(period) {
      const filteredTx = period === 'ALL'
        ? appState.transactions
        : appState.transactions.filter(t => t.taxPeriod === period);

      const grossIncome = filteredTx.filter(t => t.type === 'Income').reduce((s, t) => s + t.amount, 0);
      const totalDeductions = filteredTx.filter(t => t.type === 'Expense').reduce((s, t) => s + t.amount, 0);
      const netTaxable = grossIncome - totalDeductions;

      const byCategory = {};
      TAX_EXPENSE_CATEGORIES.forEach(c => { byCategory[c] = 0; });
      filteredTx.filter(t => t.type === 'Expense').forEach(tx => {
        byCategory[tx.category] = (byCategory[tx.category] || 0) + tx.amount;
      });

      const receiptItems = [];
      filteredTx.forEach(tx => {
        (tx.mediaIds || []).forEach(id => {
          const m = MaalkiMediaStore.getMedia(id);
          if (m) receiptItems.push({ media: m, tx });
        });
      });

      triggerPrintDocument(`
        <div style="font-family:Inter, sans-serif; color:#111315;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #00A7E1; padding-bottom:12px; margin-bottom:16px;">
            <div>
              <div style="font-size:18pt; font-weight:700;">Maalki <span style="color:#00A7E1;">Rental Property Tax Return Pack</span></div>
              <div style="font-size:9.5pt; color:#4B5563; margin-top:2px;">Schedule of Rental Income, Deductible Expenses &amp; Evidence Appendix</div>
            </div>
            <div style="text-align:right; font-size:9pt;">
              <div><strong>Tax Period:</strong> ${escapeHtml(period)}</div>
              <div><strong>Generated:</strong> ${new Date().toISOString().slice(0, 10)}</div>
              <div><strong>Properties:</strong> ${appState.properties.length}</div>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:16px;">
            <div style="border:1px solid #D1D5DB; padding:10px; border-radius:6px;">
              <div style="font-size:8.5pt; color:#4B5563;">Gross Rental Income</div>
              <div style="font-size:14pt; font-weight:700; margin-top:4px;">${formatCurrency(grossIncome)}</div>
            </div>
            <div style="border:1px solid #D1D5DB; padding:10px; border-radius:6px;">
              <div style="font-size:8.5pt; color:#4B5563;">Total Deductible Expenses</div>
              <div style="font-size:14pt; font-weight:700; margin-top:4px;">${formatCurrency(totalDeductions)}</div>
            </div>
            <div style="border:1.5px solid #00A7E1; padding:10px; border-radius:6px;">
              <div style="font-size:8.5pt; color:#00A7E1; font-weight:700;">Net Taxable Rental Income</div>
              <div style="font-size:14pt; font-weight:700; color:#00A7E1; margin-top:4px;">${formatCurrency(netTaxable)}</div>
            </div>
          </div>

          <h3 style="font-size:11pt; margin:14px 0 6px 0;">1. Deductible Expense Summary by Tax Category</h3>
          <table style="width:100%; border-collapse:collapse; font-size:9.5pt; margin-bottom:16px;">
            <thead>
              <tr style="background:#F3F4F6; border-bottom:1px solid #9CA3AF;">
                <th style="text-align:left; padding:6px 8px;">Tax Deduction Category</th>
                <th style="text-align:right; padding:6px 8px;">Total Claimable</th>
              </tr>
            </thead>
            <tbody>
              ${Object.entries(byCategory).map(([cat, amt]) => `
                <tr style="border-bottom:1px solid #E5E7EB;">
                  <td style="padding:5px 8px;">${escapeHtml(cat)}</td>
                  <td style="padding:5px 8px; text-align:right; font-family:monospace;">${formatCurrency(amt)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <h3 style="font-size:11pt; margin:14px 0 6px 0;">2. Itemized Income &amp; Expense Ledger</h3>
          <table style="width:100%; border-collapse:collapse; font-size:8.8pt;">
            <thead>
              <tr style="background:#F3F4F6; border-bottom:1px solid #9CA3AF;">
                <th style="text-align:left; padding:5px 6px;">Date</th>
                <th style="text-align:left; padding:5px 6px;">Property</th>
                <th style="text-align:left; padding:5px 6px;">Category</th>
                <th style="text-align:left; padding:5px 6px;">Description</th>
                <th style="text-align:right; padding:5px 6px;">Amount</th>
              </tr>
            </thead>
            <tbody>
              ${filteredTx.map(tx => `
                <tr style="border-bottom:1px solid #E5E7EB;">
                  <td style="padding:4px 6px; font-family:monospace;">${escapeHtml(tx.date)}</td>
                  <td style="padding:4px 6px;">${escapeHtml(getPropertyName(tx.propertyId))}</td>
                  <td style="padding:4px 6px;">${escapeHtml(tx.category)}</td>
                  <td style="padding:4px 6px;">${escapeHtml(tx.description)}</td>
                  <td style="padding:4px 6px; text-align:right; font-family:monospace;">${tx.type === 'Income' ? '+' : '-'}${formatCurrency(tx.amount)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          ${receiptItems.length > 0 ? `
            <div class="print-page-break">
              <h3 style="font-size:11pt; border-bottom:1px solid #00A7E1; padding-bottom:6px; margin-bottom:12px;">3. Attached Tax Evidence Appendix (${receiptItems.length})</h3>
              <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;">
                ${receiptItems.map(({ media, tx }) => `
                  <div class="print-avoid-break" style="border:1px solid #D1D5DB; padding:8px; border-radius:6px;">
                    ${media.kind === 'image'
                      ? `<img src="${media.dataUrl}" style="width:100%; height:170px; object-fit:contain; background:#F9FAFB;" />`
                      : media.kind === 'video' && media.posterUrl
                      ? `<img src="${media.posterUrl}" style="width:100%; height:170px; object-fit:cover; background:#111315;" />`
                      : `<div style="padding:20px; text-align:center; background:#F3F4F6; font-size:9pt;">[${media.kind.toUpperCase()} EVIDENCE &bull; ${formatDuration(media.durationSec)}]</div>`
                    }
                    <div style="font-size:8.5pt; margin-top:6px;">
                      <strong>${escapeHtml(tx.date)} &bull; ${formatCurrency(tx.amount)}</strong><br/>
                      ${escapeHtml(tx.description)} (${escapeHtml(getPropertyName(tx.propertyId))})
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `);
    }

    function printPropertySheet(propertyId) {
      const prop = appState.properties.find(p => p.id === propertyId);
      if (!prop) return;
      const cover = prop.coverPhotoId ? MaalkiMediaStore.getMedia(prop.coverPhotoId) : null;

      triggerPrintDocument(`
        <div style="font-family:Inter, sans-serif; color:#111315;">
          <div style="border-bottom:2px solid #00A7E1; padding-bottom:10px; margin-bottom:16px; display:flex; justify-content:space-between;">
            <div>
              <div style="font-size:17pt; font-weight:700;">Maalki <span style="color:#00A7E1;">Property &amp; Tenancy Profile</span></div>
              <div style="font-size:9.5pt; color:#4B5563;">${escapeHtml(prop.address)}</div>
            </div>
            <div style="text-align:right; font-size:9pt;">
              <div><strong>Status:</strong> ${escapeHtml(prop.status)}</div>
              <div><strong>Printed:</strong> ${new Date().toISOString().slice(0, 10)}</div>
            </div>
          </div>
          ${cover && cover.kind === 'image' ? `<img src="${cover.dataUrl}" style="width:100%; max-height:220px; object-fit:cover; border-radius:8px; margin-bottom:14px;" />` : ''}
          <table style="width:100%; border-collapse:collapse; font-size:10pt;">
            <tr><td style="padding:7px; border-bottom:1px solid #E5E7EB; width:35%;"><strong>Property Name</strong></td><td style="padding:7px; border-bottom:1px solid #E5E7EB;">${escapeHtml(prop.name)} (${escapeHtml(prop.type)})</td></tr>
            <tr><td style="padding:7px; border-bottom:1px solid #E5E7EB;"><strong>Configuration</strong></td><td style="padding:7px; border-bottom:1px solid #E5E7EB;">${prop.beds} Bedrooms, ${prop.baths} Bathrooms</td></tr>
            <tr><td style="padding:7px; border-bottom:1px solid #E5E7EB;"><strong>Rent &amp; Bond</strong></td><td style="padding:7px; border-bottom:1px solid #E5E7EB;">${formatCurrency(prop.rentAmount)} / ${escapeHtml(prop.rentFrequency)} &bull; Bond: ${formatCurrency(prop.bondAmount)}</td></tr>
            <tr><td style="padding:7px; border-bottom:1px solid #E5E7EB;"><strong>Current Tenant</strong></td><td style="padding:7px; border-bottom:1px solid #E5E7EB;">${escapeHtml(prop.tenantName || 'Vacant')} (${escapeHtml(prop.tenantPhone)} &bull; ${escapeHtml(prop.tenantEmail)})</td></tr>
            <tr><td style="padding:7px; border-bottom:1px solid #E5E7EB;"><strong>Lease Term</strong></td><td style="padding:7px; border-bottom:1px solid #E5E7EB;">${escapeHtml(prop.leaseStart || '—')} to ${escapeHtml(prop.leaseEnd || '—')}</td></tr>
            <tr><td style="padding:7px; border-bottom:1px solid #E5E7EB;"><strong>Management Notes</strong></td><td style="padding:7px; border-bottom:1px solid #E5E7EB;">${escapeHtml(prop.notes || 'None')}</td></tr>
          </table>
        </div>
      `);
    }

    /**
     * ==========================================================================
     * 16. BOOTSTRAP APPLICATION & WIRE ONCE-PER-DEVICE LOGIN FORM
     * ==========================================================================
     */
    window.addEventListener('DOMContentLoaded', async () => {
      loadState();
      await MaalkiMediaStore.openDB();
      MaalkiMediaStore.updateStorageIndicators();
      MaalkiGitHubSync.updateSyncIndicators();
      MaalkiAuth.updateHeaderProfileUI();
      renderCurrentView();

      const loginForm = document.getElementById('device-login-form');
      if (loginForm) {
        loginForm.onsubmit = async (e) => {
          e.preventDefault();
          const errBox = document.getElementById('login-error-box');
          const submitBtn = document.getElementById('login-submit-btn');
          errBox.classList.add('hidden');
          submitBtn.disabled = true;
          submitBtn.textContent = 'Unlocking Vault…';

          try {
            const firstName = document.getElementById('login-first-name')?.value || '';
            const lastName = document.getElementById('login-last-name')?.value || '';
            const passphrase = document.getElementById('login-passphrase')?.value || '';
            const newFieldsVisible = !document.getElementById('login-new-user-fields')?.classList.contains('hidden');

            await MaalkiAuth.completeLogin({
              firstName,
              lastName,
              existingUserId: newFieldsVisible ? '' : (MaalkiAuth.getActiveUser()?.id || 'usr_admin_default'),
              passphrase
            });
          } catch (err) {
            errBox.textContent = err.message || 'Unlock failed. Check your vault passphrase.';
            errBox.classList.remove('hidden');
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Login & Unlock Device';
          }
        };
      }

      await MaalkiAuth.bootAuth();
    });
  </script>
</body>
