<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Maalki — Residential Property Management</title>

  <!-- Web App & Home Screen Metadata (iOS & Android) -->
  <meta name="application-name" content="Maalki" />
  <meta name="apple-mobile-web-app-title" content="Maalki" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#00A7E1" />

  <!-- Transparent #00A7E1 Vector Favicon -->
  <link id="favicon-svg" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 54h48M14 54V24L32 12l18 12v30M24 54V38h16v16' fill='none' stroke='%2300A7E1' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link id="favicon-png" rel="icon" type="image/png" sizes="64x64" href="" />
  <link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="" />
  <link id="web-manifest-link" rel="manifest" href="" />

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Dynamic Transparent #00A7E1 Favicon + iOS/Android Home Screen Icon Generator -->
  <script>
    (function setupMaalkiIcons() {
      function renderIconDataUrl(size, withBackground) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) return '';

        ctx.clearRect(0, 0, size, size);

        if (withBackground) {
          ctx.fillStyle = '#0D0E10';
          ctx.fillRect(0, 0, size, size);
        }

        const scale = size / 64;
        ctx.save();
        ctx.scale(scale, scale);
        ctx.strokeStyle = '#00A7E1';
        ctx.lineWidth = 5.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(8, 54);
        ctx.lineTo(56, 54);
        ctx.moveTo(14, 54);
        ctx.lineTo(14, 24);
        ctx.lineTo(32, 12);
        ctx.lineTo(50, 24);
        ctx.lineTo(50, 54);
        ctx.moveTo(24, 54);
        ctx.lineTo(24, 38);
        ctx.lineTo(40, 38);
        ctx.lineTo(40, 54);
        ctx.stroke();
        ctx.restore();

        return canvas.toDataURL('image/png');
      }

      try {
        const png64 = renderIconDataUrl(64, false);
        const png180 = renderIconDataUrl(180, true);
        const png192 = renderIconDataUrl(192, true);
        const png512 = renderIconDataUrl(512, true);

        const favPng = document.getElementById('favicon-png');
        const appleIcon = document.getElementById('apple-touch-icon');
        if (favPng && png64) favPng.href = png64;
        if (appleIcon && png180) appleIcon.href = png180;

        const manifestObj = {
          name: 'Maalki — Residential Property Manager',
          short_name: 'Maalki',
          description: 'Residential property management, inspections, multimedia logs, and encrypted sync.',
          start_url: './',
          display: 'standalone',
          background_color: '#0D0E10',
          theme_color: '#00A7E1',
          icons: [
            { src: png192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
            { src: png512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestLink = document.getElementById('web-manifest-link');
        if (manifestLink) manifestLink.href = URL.createObjectURL(manifestBlob);
      } catch (e) {
        // Fallback silently to inline SVG favicon
      }
    })();
  </script>

  <style>
    /* ========================================================================
       DESIGN TOKENS — STRICT MONOCHROME + #00A7E1 + AUTO DEVICE THEME
       ======================================================================== */
    :root {
      --accent: #00A7E1;
      --accent-hover: #008EC0;
      --accent-tint: rgba(0, 167, 225, 0.12);
      --accent-border: rgba(0, 167, 225, 0.42);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-canvas: #F5F6F8;
        --bg-surface: #FFFFFF;
        --bg-subtle: #ECEEF2;
        --bg-hover: #E4E7EC;
        --border-color: #DFE2E8;
        --border-strong: #C5CBD4;
        --text-primary: #111315;
        --text-secondary: #525866;
        --text-muted: #7C8391;
        --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
        --modal-backdrop: rgba(17, 19, 21, 0.58);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-canvas: #0D0E10;
        --bg-surface: #16181C;
        --bg-subtle: #202329;
        --bg-hover: #282C34;
        --border-color: #2A2D35;
        --border-strong: #3B404B;
        --text-primary: #F4F5F7;
        --text-secondary: #A1A7B3;
        --text-muted: #6E7582;
        --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.28);
        --modal-backdrop: rgba(0, 0, 0, 0.78);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      margin: 0;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (max-width: 640px) {
      .m-input {
        font-size: 16px !important; /* Prevents iOS Safari auto-zoom on input focus */
      }
    }

    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    .m-canvas { background-color: var(--bg-canvas); }
    .m-surface {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-card);
    }
    .m-subtle {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
    }
    .m-border { border-color: var(--border-color); }
    .m-text { color: var(--text-primary); }
    .m-text-sec { color: var(--text-secondary); }
    .m-text-muted { color: var(--text-muted); }

    .btn-accent {
      background-color: var(--accent);
      color: #FFFFFF;
      font-weight: 600;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .btn-accent:hover { background-color: var(--accent-hover); }
    .btn-accent:active { transform: scale(0.99); }

    .btn-ghost {
      background-color: var(--bg-subtle);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      font-weight: 500;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-ghost:hover {
      background-color: var(--bg-hover);
      border-color: var(--border-strong);
    }

    .pill-accent {
      background-color: var(--accent-tint);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }

    .nav-item-active {
      background-color: var(--accent-tint);
      color: var(--accent);
      border-color: var(--accent-border);
      font-weight: 600;
    }

    .m-input {
      width: 100%;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 0.625rem;
      padding: 0.55rem 0.75rem;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .m-input:focus {
      border-color: var(--accent);
    }

    .dropzone-area {
      border: 1.5px dashed var(--border-strong);
      background-color: var(--bg-canvas);
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .dropzone-area.drag-over {
      border-color: var(--accent);
      background-color: var(--accent-tint);
    }

    @keyframes pulse-rec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .rec-dot {
      animation: pulse-rec 1.1s infinite ease-in-out;
    }

    /* ========================================================================
       A4 PRINT / SAVE AS PDF STYLESHEET
       ======================================================================== */
    @media print {
      @page {
        size: A4 portrait;
        margin: 14mm 14mm 16mm 14mm;
      }
      html, body {
        background: #FFFFFF !important;
        color: #111315 !important;
        font-size: 10.5pt;
      }
      #app-shell, #modal-root, #lightbox-root, #toast-root, #login-screen {
        display: none !important;
      }
      #print-document-root {
        display: block !important;
        position: static !important;
        width: 100% !important;
        background: #FFFFFF !important;
        color: #111315 !important;
      }
      .print-avoid-break {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .print-page-break {
        break-before: page;
        page-break-before: always;
      }
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-[#00A7E1] selection:text-white">

  <!-- ========================================================================

  <div id="login-screen" class="hidden fixed inset-0 z-40 m-canvas overflow-y-auto p-4 sm:p-6">
    <div class="min-h-full flex flex-col justify-start sm:justify-center items-center py-2 sm:py-6">
      <div class="w-full max-w-md m-surface rounded-2xl shadow-2xl overflow-hidden">

                <path d="M9 21v-6h6v6" />

            </div>
          </div>
          <span class="pill-accent text-[10px] font-mono-num font-semibold px-2.5 py-1 rounded-full shrink-0">AES-256</span>
        </div>

        <form id="device-login-form" class="p-5 sm:p-6 space-y-5 text-sm">
          <!-- Step 1: Select User from List (Defaults to Last Chosen User on This Device) or Add New Name -->
          <div class="space-y-3">
            <div class="flex items-center justify-between gap-2">
              <label class="text-xs font-bold uppercase tracking-wider m-text-muted">1. Select Manager / Inspector</label>
              <button type="button" id="login-toggle-new-user" onclick="toggleLoginNewUserMode()" class="text-xs font-semibold hover:underline shrink-0 cursor-pointer" style="color: #00A7E1;">
                + Add New Name

            </div>

            <!-- Selectable User List -->
            <div id="login-user-list-wrap" class="space-y-2">
              <div id="login-user-list" class="grid grid-cols-1 gap-2 max-h-48 overflow-y-auto pr-0.5"></div>
            </div>

            <!-- New User First Name & Last Name Boxes -->
            <div id="login-new-user-fields" class="hidden p-3.5 rounded-xl m-subtle space-y-3">
              <div class="flex items-center justify-between">
                <span class="text-xs font-semibold">New Manager / Inspector Name</span>
                <button type="button" onclick="toggleLoginNewUserMode()" class="text-[11px] m-text-muted hover:m-text cursor-pointer">Cancel</button>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">

                  <input type="text" id="login-first-name" placeholder="First name" autocomplete="given-name" class="m-input" />
                </div>
                <div>
                  <label class="block text-xs font-semibold m-text-sec mb-1">Last Name *</label>
                  <input type="text" id="login-last-name" placeholder="Last name" autocomplete="family-name" class="m-input" />
                </div>
              </div>
            </div>
            <p class="text-[11px] m-text-muted">Automatically remembers the last profile chosen on this device.</p>
          </div>

          <!-- Step 2: Device Vault Passphrase -->

            <div class="flex items-center justify-between">
              <label class="text-xs font-bold uppercase tracking-wider m-text-muted">2. Vault Passphrase (Password) *</label>
              <button type="button" onclick="toggleLoginPassVisibility()" class="text-xs m-text-muted hover:m-text py-0.5 px-1 cursor-pointer">Show / Hide</button>
            </div>
            <input type="password" id="login-passphrase" required placeholder="Enter your vault passphrase" autocomplete="current-password" class="m-input" />
            <div id="login-vault-status" class="text-[11px] m-text-muted leading-relaxed"></div>
          </div>

          <div id="login-error-box" class="hidden p-3 rounded-xl border border-neutral-500 m-subtle text-xs font-medium"></div>

    </header>

    <!-- Main Workspace Area -->
    <main class="flex-1 md:pl-64">
      <!-- Desktop Top Context Bar -->
      <div class="hidden md:flex items-center justify-between px-8 py-4 border-b m-border m-surface sticky top-0 z-10">
        <div>
          <h1 id="desktop-page-title" class="text-xl font-bold tracking-tight">Dashboard</h1>
          <p id="desktop-page-desc" class="text-xs m-text-muted mt-0.5">Portfolio overview, rent status, and upcoming tasks</p>
        </div>
        <div class="flex items-center gap-2.5">

    /**
     * ==========================================================================
     * 1. MAALKI CRYPTO ENGINE (PBKDF2-SHA256 + AES-256-GCM)
     * Zero plaintext tokens or property files ever leave the browser.
     * ==========================================================================
     */
    const MaalkiCrypto = (() => {
      const encoder = new TextEncoder();
      const decoder = new TextDecoder();
      const keyCache = new Map();

      function bytesToBase64(uint8) {
        let binary = '';
        const chunkSize = 0x8000;
        for (let i = 0; i < uint8.length; i += chunkSize) {
          const chunk = uint8.subarray(i, i + chunkSize);
          binary += String.fromCharCode.apply(null, chunk);
        }
        return btoa(binary);
      }

      function base64ToBytes(b64) {
        const clean = (b64 || '').replace(/\s+/g, '');
        const binary = atob(clean);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      function utf8ToBase64(str) {
        return bytesToBase64(encoder.encode(str));
      }

      function base64ToUtf8(b64) {
        return decoder.decode(base64ToBytes(b64));
      }

      async function deriveAesKey(passphrase, saltBytes, iterations = 250000) {
        const cacheKey = `${passphrase}::${bytesToBase64(saltBytes)}::${iterations}`;
        if (keyCache.has(cacheKey)) {
          return keyCache.get(cacheKey);
        }
        const baseKey = await crypto.subtle.importKey(
          'raw',
          encoder.encode(passphrase),
          'PBKDF2',
          false,
          ['deriveKey']
        );
        const aesKey = await crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: saltBytes,
            iterations,
            hash: 'SHA-256'
          },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
        keyCache.set(cacheKey, aesKey);
        return aesKey;
      }

      async function encryptObject(plainObj, passphrase) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveAesKey(passphrase, salt, 250000);
        const plaintext = encoder.encode(JSON.stringify(plainObj));
        const cipherBuffer = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv },
          key,
          plaintext
        );
        return {
          v: 1,
          app: 'Maalki',
          alg: 'AES-256-GCM',
          kdf: 'PBKDF2-SHA256',
          iter: 250000,
          salt: bytesToBase64(salt),
          iv: bytesToBase64(iv),
          ct: bytesToBase64(new Uint8Array(cipherBuffer))
        };
      }

      async function decryptObject(envelope, passphrase) {
        if (!envelope || envelope.alg !== 'AES-256-GCM') {
          throw new Error('Unsupported encrypted envelope format.');
        }
        const salt = base64ToBytes(envelope.salt);
        const iv = base64ToBytes(envelope.iv);
        const ct = base64ToBytes(envelope.ct);
        const key = await deriveAesKey(passphrase, salt, envelope.iter || 250000);
        try {
          const plainBuffer = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv },
            key,
            ct
          );
          return JSON.parse(decoder.decode(plainBuffer));
        } catch (e) {
          throw new Error('Incorrect vault passphrase.');
        }
      }

      async function packTokenString(tokenPayload, passphrase) {
        const envelope = await encryptObject(tokenPayload, passphrase);
        return 'mkenc1.' + utf8ToBase64(JSON.stringify(envelope));
      }

      async function unpackTokenString(packedString, passphrase) {
        const raw = (packedString || '').trim();
        if (!raw.startsWith('mkenc1.')) {
          throw new Error('Invalid encrypted vault key format.');
        }
        const jsonStr = base64ToUtf8(raw.slice(7));
        const envelope = JSON.parse(jsonStr);
        return decryptObject(envelope, passphrase);
      }

      function generatePassphrase() {
        const words = [
          'harbour', 'timber', 'cobalt', 'granite', 'summit', 'cedar',
          'beacon', 'ridge', 'quartz', 'anchor', 'falcon', 'haven',
          'solstice', 'atlas', 'ember', 'horizon', 'breeze', 'meridian'
        ];
        const rnd = crypto.getRandomValues(new Uint32Array(4));
        const w1 = words[rnd[0] % words.length];
        const w2 = words[rnd[1] % words.length];
        const w3 = words[rnd[2] % words.length];
        const num = 1000 + (rnd[3] % 9000);
        return `${w1}-${w2}-${num}-${w3}`;
      }

      return {
        encryptObject,
        decryptObject,
        packTokenString,
        unpackTokenString,
        generatePassphrase,
        utf8ToBase64,
        base64ToUtf8
      };
    })();

    /**
     * ==========================================================================
     * 2. SUB-2-SECOND ENCRYPTED GITHUB CLOUD SYNC ENGINE
     * ==========================================================================
     */
    const MaalkiGitHubSync = (() => {
      const SYNC_CFG_KEY = 'maalki_gh_sync_cfg_v1';
      const DEVICE_ID_KEY = 'maalki_device_id_v1';
      const MANIFEST_PATH = 'maalki/manifest.enc.json';
      const POLL_INTERVAL_MS = 1500;
      const PUSH_DEBOUNCE_MS = 350;

      let deviceId = localStorage.getItem(DEVICE_ID_KEY);
      if (!deviceId) {
        deviceId = 'dev_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        localStorage.setItem(DEVICE_ID_KEY, deviceId);
      }

      let cfg = {
        enabled: false,
        token: '',
        owner: '',
        repo: 'maalki-vault',
        branch: 'main',
        passphrase: ''
      };

      try {
        const saved = sessionStorage.getItem(SYNC_CFG_KEY);
        if (saved) cfg = { ...cfg, ...JSON.parse(saved) };
      } catch (e) { /* ignore */ }

      let pollTimer = null;
      let pushTimer = null;
      let isPushing = false;
      let isPulling = false;
      let pushQueued = false;
      let suppressSchedule = false;
      let initialSyncComplete = false;
      let localRevision = 0;
      let lastManifestETag = null;
      let lastSyncTime = null;
      let lastLatencyMs = null;
      let syncHealth = 'off'; // 'off' | 'live' | 'syncing' | 'error'
      let lastErrorMsg = '';
      let repoIsEmpty = false;

      const shaCache = new Map();
      const pendingMediaIds = new Set();
      const pendingDossierIds = new Set();

      function hasMeaningfulState(st) {
        if (!st) return false;
        const customUsers = (st.users || []).filter(u => u && u.id !== 'usr_tejveer_randhawa');
        return (
          (st.properties && st.properties.length > 0) ||
          (st.inspections && st.inspections.length > 0) ||
          (st.tasks && st.tasks.length > 0) ||
          (st.transactions && st.transactions.length > 0) ||
          customUsers.length > 0 ||
          Object.keys(st.deletedIds || {}).length > 0
        );
      }

      function mergeCollectionById(localList = [], remoteList = [], deletedIds = {}) {
        const byId = new Map();
        let localHadNewer = false;

        for (const rItem of (remoteList || [])) {
          if (!rItem || !rItem.id) continue;
          const delAt = deletedIds[rItem.id] || 0;
          if (delAt && delAt >= (rItem.updatedAt || 0)) continue;
          byId.set(rItem.id, rItem);
        }

        for (const lItem of (localList || [])) {
          if (!lItem || !lItem.id) continue;
          const delAt = deletedIds[lItem.id] || 0;
          const lTime = lItem.updatedAt || 0;
          if (delAt && delAt >= lTime) continue;

          const existing = byId.get(lItem.id);
          if (!existing) {
            byId.set(lItem.id, lItem);
            localHadNewer = true;
          } else {
            const rTime = existing.updatedAt || 0;
            if (lTime > rTime) {
              byId.set(lItem.id, lItem);
              localHadNewer = true;
            }
          }
        }

        return {
          items: Array.from(byId.values()),
          localHadNewer
        };
      }

      function mergeAppStates(localSt, remoteSt) {
        if (!remoteSt) return { state: localSt, changed: false, localHadNewer: hasMeaningfulState(localSt) };

        const mergedDeleted = { ...(remoteSt.deletedIds || {}), ...(localSt.deletedIds || {}) };
        for (const k of Object.keys(mergedDeleted)) {
          mergedDeleted[k] = Math.max(remoteSt.deletedIds?.[k] || 0, localSt.deletedIds?.[k] || 0);
        }

        const props = mergeCollectionById(localSt.properties, remoteSt.properties, mergedDeleted);
        const insps = mergeCollectionById(localSt.inspections, remoteSt.inspections, mergedDeleted);
        const tasks = mergeCollectionById(localSt.tasks, remoteSt.tasks, mergedDeleted);
        const txs = mergeCollectionById(localSt.transactions, remoteSt.transactions, mergedDeleted);
        const users = mergeCollectionById(localSt.users, remoteSt.users, mergedDeleted);

        const actMap = new Map();
        [...(remoteSt.activityLog || []), ...(localSt.activityLog || [])].forEach(a => {
          if (a && a.id) actMap.set(a.id, a);
        });
        const mergedActivity = Array.from(actMap.values()).slice(0, 30);

        const nextState = {
          ...localSt,
          deletedIds: mergedDeleted,
          properties: props.items,
          inspections: insps.items,
          tasks: tasks.items,
          transactions: txs.items,
          users: users.items,
          activityLog: mergedActivity
        };

        const changed = JSON.stringify({
          p: localSt.properties,
          i: localSt.inspections,
          t: localSt.tasks,
          x: localSt.transactions,
          u: localSt.users,
          d: localSt.deletedIds
        }) !== JSON.stringify({
          p: nextState.properties,
          i: nextState.inspections,
          t: nextState.tasks,
          x: nextState.transactions,
          u: nextState.users,
          d: nextState.deletedIds
        });

        const localHadNewer = props.localHadNewer || insps.localHadNewer || tasks.localHadNewer || txs.localHadNewer || users.localHadNewer;
        return { state: nextState, changed, localHadNewer };
      }

      function saveCfg() {
        try {
          sessionStorage.setItem(SYNC_CFG_KEY, JSON.stringify(cfg));
        } catch (e) { /* ignore */ }
        updateSyncIndicators();
      }

      function apiHeaders(extra = {}) {
        return {
          'Authorization': `Bearer ${cfg.token}`,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
          ...extra
        };
      }

      async function verifyToken(tokenToTest) {
        const res = await fetch('https://api.github.com/user', {
          cache: 'no-store',
          headers: {
            'Authorization': `Bearer ${tokenToTest.trim()}`,
            'Accept': 'application/vnd.github+json'
          }
        });
        if (!res.ok) {
          throw new Error(`GitHub rejected token (HTTP ${res.status}). Ensure Classic Token has 'repo' scope.`);
        }
        return res.json();
      }

      async function createPrivateRepo(tokenToUse, repoName) {
        const res = await fetch('https://api.github.com/user/repos', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${tokenToUse.trim()}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: repoName.trim(),
            description: 'Maalki End-to-End Encrypted Residential Property Vault',
            private: true,
            auto_init: true
          })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || `Could not create repository (HTTP ${res.status})`);
        }
        return res.json();
      }

      async function ensureRepositoryReady() {
        if (!cfg.owner) {
          const u = await verifyToken(cfg.token);
          cfg.owner = u.login;
        }
        const repoUrl = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`;
        let res = await fetch(repoUrl, { cache: 'no-store', headers: apiHeaders() });

        if (res.status === 404) {
          const created = await createPrivateRepo(cfg.token, cfg.repo);
          cfg.branch = created.default_branch || 'main';
          repoIsEmpty = false;
          saveCfg();
          return;
        }

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || `Repository check failed (HTTP ${res.status}). Check token 'repo' scope.`);
        }

        const repoData = await res.json();
        if (repoData.default_branch) {
          cfg.branch = repoData.default_branch;
        }
        repoIsEmpty = Number(repoData.size || 0) === 0;
        saveCfg();
      }

      async function getRemoteFile(path, useManifestETag = false) {
        const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${path}?ref=${encodeURIComponent(cfg.branch)}`;
        const headers = apiHeaders();
        if (useManifestETag && lastManifestETag) {
          headers['If-None-Match'] = lastManifestETag;
        }

        const res = await fetch(url, { cache: 'no-store', headers });

        if (res.status === 304) {
          return { notModified: true };
        }
        if (res.status === 404) {
          return null;
        }
        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          throw new Error(errBody.message || `GitHub GET ${path} failed (${res.status})`);
        }

        const etag = res.headers.get('ETag');
        if (useManifestETag && etag) {
          lastManifestETag = etag;
        }

        const data = await res.json();
        if (data.sha) {
          shaCache.set(path, data.sha);
        }
        const decodedText = MaalkiCrypto.base64ToUtf8(data.content || '');
        return {
          sha: data.sha,
          envelope: JSON.parse(decodedText)
        };
      }

      async function putRemoteFile(path, envelopeObj, message, attempt = 1) {
        const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${path}`;
        let sha = shaCache.get(path);

        if (!sha && !repoIsEmpty) {
          const existing = await getRemoteFile(path, false).catch(() => null);
          if (existing && existing.sha) sha = existing.sha;
        }

        const payload = {
          message,
          content: MaalkiCrypto.utf8ToBase64(JSON.stringify(envelopeObj, null, 2)),
          branch: cfg.branch
        };
        if (sha) payload.sha = sha;

        const res = await fetch(url, {
          method: 'PUT',
          headers: apiHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(payload)
        });

        if ((res.status === 409 || res.status === 422) && attempt < 3) {
          shaCache.delete(path);
          const fresh = await getRemoteFile(path, false).catch(() => null);
          if (fresh && fresh.sha) shaCache.set(path, fresh.sha);
          return putRemoteFile(path, envelopeObj, message, attempt + 1);
        }

        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          throw new Error(errBody.message || `GitHub PUT ${path} failed (${res.status})`);
        }

        repoIsEmpty = false;
        const data = await res.json();
        if (data && data.content && data.content.sha) {
          shaCache.set(path, data.content.sha);
        }
        if (path === MANIFEST_PATH) {
          lastManifestETag = null;
        }
        return data;
      }

      function schedulePush(options = {}) {
        if (!cfg.enabled || !cfg.token || !cfg.passphrase || suppressSchedule) return;
        if (options.mediaId) pendingMediaIds.add(options.mediaId);
        if (options.dossierPropertyId) pendingDossierIds.add(options.dossierPropertyId);
        if (!initialSyncComplete) return;

        if (pushTimer) clearTimeout(pushTimer);
        pushTimer = setTimeout(() => {
          pushNow(false);
        }, PUSH_DEBOUNCE_MS);
      }

      async function pushNow(fullMediaSync = false) {
        if (!cfg.enabled || !cfg.token || !cfg.passphrase) return;
        if (isPushing) {
          pushQueued = true;
          return;

        isPushing = true;

        updateSyncIndicators();
        const t0 = performance.now();

          const allMedia = MaalkiMediaStore.getAllMedia();
          const allDossiers = MaalkiMediaStore.getAllDossiers();

            ? allMedia
            : allMedia.filter(m => pendingMediaIds.has(m.id));

          for (const item of mediaToUpload) {
            const encryptedMedia = await MaalkiCrypto.encryptObject(item, cfg.passphrase);
            await putRemoteFile(
              `maalki/media/${item.id}.enc.json`,
              encryptedMedia,
              `Maalki encrypted media ${item.id}`
            );
            pendingMediaIds.delete(item.id);
          }

          const dossiersToUpload = fullMediaSync
            ? allDossiers
            : allDossiers.filter(d => pendingDossierIds.has(d.propertyId));

            const encryptedDossier = await MaalkiCrypto.encryptObject(dFile, cfg.passphrase);
            await putRemoteFile(
              `maalki/properties/${dFile.fileName}.enc.json`,
              encryptedDossier,
              `Maalki encrypted dossier ${dFile.fileName}`
            );
            pendingDossierIds.delete(dFile.propertyId);
          }

          localRevision += 1;
          const manifestPlain = {
            revision: localRevision,
            updatedAt: new Date().toISOString(),
            deviceId,
            state: appState,
            mediaCatalog: allMedia.map(m => ({
              id: m.id,
              kind: m.kind,
              pinned: m.pinned,
              createdAt: m.createdAt,
              sizeBytes: m.sizeBytes
            })),
            dossierCatalog: allDossiers.map(d => ({
              propertyId: d.propertyId,
              fileName: d.fileName,
              archived: d.archived,
              updatedAt: d.updatedAt
            }))
          };

          const encryptedManifest = await MaalkiCrypto.encryptObject(manifestPlain, cfg.passphrase);
          await putRemoteFile(
            MANIFEST_PATH,
            encryptedManifest,
            `Maalki sync rev ${localRevision}`
          );

          lastLatencyMs = Math.round(performance.now() - t0);
          lastSyncTime = new Date();
          syncHealth = 'live';
          lastErrorMsg = '';
        } catch (err) {
          syncHealth = 'error';
          lastErrorMsg = err.message || 'Sync error';
          console.error('[MaalkiGitHubSync] Push error:', err);
        } finally {
          isPushing = false;
          updateSyncIndicators();
          if (pushQueued) {
            pushQueued = false;
            pushNow(false);
          }
        }
      }

      async function pollOnce() {
        if (!cfg.enabled || !cfg.token || !cfg.passphrase || isPushing || isPulling) return;
        isPulling = true;
        const t0 = performance.now();

        try {
          const remote = await getRemoteFile(MANIFEST_PATH, true);
          if (!remote) {
            lastLatencyMs = Math.round(performance.now() - t0);
            lastSyncTime = new Date();
            syncHealth = 'live';
            lastErrorMsg = '';
            updateSyncIndicators();
            return;
          }

          if (remote.notModified) {
            lastLatencyMs = Math.round(performance.now() - t0);
            lastSyncTime = new Date();
            syncHealth = 'live';
            lastErrorMsg = '';
            updateSyncIndicators();
            return;
          }

          const decrypted = await MaalkiCrypto.decryptObject(remote.envelope, cfg.passphrase);
          if (decrypted && decrypted.state) {
            if (decrypted.revision > localRevision) {
              localRevision = decrypted.revision;
            }
            const merged = mergeAppStates(appState, decrypted.state);
            if (merged.changed) {
              suppressSchedule = true;
              appState = merged.state;
              if (Array.isArray(appState.users) && appState.users.length > 0 && typeof MaalkiAuth !== 'undefined') {
                MaalkiAuth.mergeRemoteUsers(appState.users);
              }
              try {
                localStorage.setItem(STATE_KEY, JSON.stringify(appState));
              } catch (e) { /* ignore */ }
              suppressSchedule = false;
              renderCurrentView();
              if (decrypted.deviceId !== deviceId) {
                showToast('Synced encrypted update from another device');
              }
            }

            if (Array.isArray(decrypted.mediaCatalog)) {
              for (const entry of decrypted.mediaCatalog) {
                if (!MaalkiMediaStore.getMedia(entry.id)) {
                  const mediaRes = await getRemoteFile(`maalki/media/${entry.id}.enc.json`, false).catch(() => null);
                  if (mediaRes && mediaRes.envelope) {
                    const mediaObj = await MaalkiCrypto.decryptObject(mediaRes.envelope, cfg.passphrase).catch(() => null);
                    if (mediaObj) await MaalkiMediaStore.importAll([mediaObj]);
                  }
                }
              }
            }

            if (Array.isArray(decrypted.dossierCatalog)) {
              for (const dEntry of decrypted.dossierCatalog) {
                const existing = MaalkiMediaStore.getDossier(dEntry.propertyId);
                if (!existing || existing.updatedAt !== dEntry.updatedAt) {
                  const dRes = await getRemoteFile(`maalki/properties/${dEntry.fileName}.enc.json`, false).catch(() => null);
                  if (dRes && dRes.envelope) {
                    const dObj = await MaalkiCrypto.decryptObject(dRes.envelope, cfg.passphrase).catch(() => null);
                    if (dObj) await MaalkiMediaStore.importDossierDirect(dObj);
                  }
                }
              }
            }

            if (merged.localHadNewer) {
              schedulePush();
            }
          }

          lastLatencyMs = Math.round(performance.now() - t0);
          lastSyncTime = new Date();
          syncHealth = 'live';
          lastErrorMsg = '';
        } catch (err) {
          syncHealth = 'error';
          lastErrorMsg = err.message || 'Pull failed';
        } finally {
          isPulling = false;
          updateSyncIndicators();
        }
      }

      function startPolling() {
        stopPolling();
        if (!cfg.enabled || !cfg.token || !cfg.passphrase) return;
        pollTimer = setInterval(pollOnce, POLL_INTERVAL_MS);
      }

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      async function connect(newConfig) {
        cfg = { ...cfg, ...newConfig, enabled: true };
        shaCache.clear();
        lastManifestETag = null;
        lastErrorMsg = '';
        initialSyncComplete = false;
        saveCfg();

        syncHealth = 'syncing';
        updateSyncIndicators();

        await ensureRepositoryReady();
        const remote = await getRemoteFile(MANIFEST_PATH, false);

        if (remote && remote.envelope) {
          const decrypted = await MaalkiCrypto.decryptObject(remote.envelope, cfg.passphrase);
          localRevision = Math.max(localRevision, decrypted.revision || 0);
          const merged = mergeAppStates(appState, decrypted.state || {});

          suppressSchedule = true;
          appState = merged.state;
          if (Array.isArray(appState.users) && appState.users.length > 0 && typeof MaalkiAuth !== 'undefined') {
            MaalkiAuth.mergeRemoteUsers(appState.users);
          }
          localStorage.setItem(STATE_KEY, JSON.stringify(appState));
          suppressSchedule = false;

          for (const entry of (decrypted.mediaCatalog || [])) {
            if (!MaalkiMediaStore.getMedia(entry.id)) {
              const mRes = await getRemoteFile(`maalki/media/${entry.id}.enc.json`, false).catch(() => null);
              if (mRes && mRes.envelope) {
                const mObj = await MaalkiCrypto.decryptObject(mRes.envelope, cfg.passphrase).catch(() => null);
                if (mObj) await MaalkiMediaStore.importAll([mObj]);
              }
            }
          }

          for (const dEntry of (decrypted.dossierCatalog || [])) {
            const existing = MaalkiMediaStore.getDossier(dEntry.propertyId);
            if (!existing || existing.updatedAt !== dEntry.updatedAt) {
              const dRes = await getRemoteFile(`maalki/properties/${dEntry.fileName}.enc.json`, false).catch(() => null);
              if (dRes && dRes.envelope) {
                const dObj = await MaalkiCrypto.decryptObject(dRes.envelope, cfg.passphrase).catch(() => null);
                if (dObj) await MaalkiMediaStore.importDossierDirect(dObj);
              }
            }
          }

          renderCurrentView();
          initialSyncComplete = true;

          if (merged.localHadNewer) {
            await pushNow(true);
          }
        } else {
          initialSyncComplete = true;
          if (hasMeaningfulState(appState)) {
            await pushNow(true);
          }
        }

        if (syncHealth !== 'error') {
          syncHealth = 'live';
          updateSyncIndicators();
        }
        startPolling();
      }

      function disconnect() {
        stopPolling();
        cfg.enabled = false;
        cfg.token = '';
        cfg.passphrase = '';
        initialSyncComplete = false;
        syncHealth = 'off';
        lastManifestETag = null;
        shaCache.clear();
        sessionStorage.removeItem(SYNC_CFG_KEY);
        updateSyncIndicators();
      }

      function updateSyncIndicators() {
        const sDot = document.getElementById('sidebar-gh-dot');
        const sStatus = document.getElementById('sidebar-gh-status');
        const sSub = document.getElementById('sidebar-gh-sub');
        const tDot = document.getElementById('topbar-gh-dot');
        const tText = document.getElementById('topbar-gh-text');
        const mDot = document.getElementById('mobile-gh-dot');
        const mBadge = document.getElementById('mobile-gh-badge');

        let dotStyle = 'background-color: #7C8391;';
        let label = 'GitHub Sync: Off';
        let mobileLabel = 'Sync Off';
        let sub = 'Configure Encrypted Repo';

        if (cfg.enabled) {
          sub = `${cfg.owner}/${cfg.repo} • 1.5s Poll`;
          if (syncHealth === 'live') {
            dotStyle = 'background-color: #00A7E1;';
            const ms = lastLatencyMs ? ` (${lastLatencyMs}ms)` : '';
            label = `Live Encrypted Sync${ms}`;
            mobileLabel = 'Live Sync';
          } else if (syncHealth === 'syncing') {
            dotStyle = 'background-color: #00A7E1;';
            label = 'Encrypting & Syncing...';
            mobileLabel = 'Syncing...';
          } else if (syncHealth === 'error') {
            dotStyle = 'background-color: #111315;';
            label = 'Sync Error — Click to Fix';
            mobileLabel = 'Sync Err';
            sub = lastErrorMsg || 'Check token or repo';
          }
        }

        if (sDot) sDot.setAttribute('style', dotStyle);
        if (sStatus) sStatus.textContent = label;
        if (sSub) sSub.textContent = sub;
        if (tDot) tDot.setAttribute('style', dotStyle);
        if (tText) tText.textContent = label;
        if (mDot) mDot.setAttribute('style', dotStyle);
        if (mBadge) mBadge.textContent = mobileLabel;
      }

      function getStatus() {
        return {
          cfg: { ...cfg, token: cfg.token ? '••••••••' : '', passphrase: cfg.passphrase ? '••••••••' : '' },
          syncHealth,
          lastLatencyMs,
          lastSyncTime,
          lastErrorMsg,
          localRevision,
          deviceId
        };
      }

      return {
        verifyToken,
        createPrivateRepo,
        connect,
        disconnect,
        schedulePush,
        pushNow,
        pollOnce,
        startPolling,
        stopPolling,
        updateSyncIndicators,
        getStatus
      };
    })();

    /**
     * ==========================================================================
     * 3. UNIFIED MEDIA & PROPERTY DOSSIER REPOSITORY (IndexedDB + Auto-Rollover)
     * Single repository ('maalki_unified_repo') storing:
     * - Photos ('photo')
     * - Audio Recordings ('audio')
     * - Videos ('video')
     * - Per-Property JSON Dossier Files ('pfile_{id}.json')
     * ==========================================================================
     */
    const MaalkiMediaStore = (() => {
      const DB_NAME = 'maalki_unified_repo';
      const DB_VERSION = 1;
      const STORE_NAME = 'media_items';
      const LIMIT_KEY = 'maalki_unified_repo_limit_mb';

      let db = null;
      let cache = [];
      let dossierCache = [];
      let maxBytes = (Number(localStorage.getItem(LIMIT_KEY)) || 50) * 1024 * 1024;

      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains(STORE_NAME)) {
              const store = database.createObjectStore(STORE_NAME, { keyPath: 'id' });
              store.createIndex('createdAt', 'createdAt', { unique: false });
              store.createIndex('kind', 'kind', { unique: false });
            }
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = (e) => reject(e.target.error);
        });
      }

      async function reloadCache() {
        if (!db) return;
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.getAll();
          req.onsuccess = () => {
            const all = req.result || [];
            cache = all.filter(item => item.kind !== 'property_file');
            dossierCache = all.filter(item => item.kind === 'property_file');
            updateStorageTelemetry();
            resolve();
          };
          req.onerror = () => resolve();
        });
      }

      async function init() {
        try {
          db = await openDB();
          await reloadCache();
        } catch (err) {
          console.warn('[MaalkiMediaStore] IndexedDB fallback to in-memory:', err);
        }
      }

      function getAllMedia() {
        return [...cache];
      }

      function getMedia(id) {
        return cache.find(m => m.id === id) || null;
      }

      function getDossier(propertyId) {
        return dossierCache.find(d => d.propertyId === propertyId) || null;
      }

      function getAllDossiers() {
        return [...dossierCache];
      }

      async function putRecord(record) {
        if (db) {
          await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(record);
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e.target.error);
          });
        }
        if (record.kind === 'property_file') {
          const idx = dossierCache.findIndex(d => d.id === record.id);
          if (idx >= 0) dossierCache[idx] = record;
          else dossierCache.push(record);
        } else {
          const idx = cache.findIndex(m => m.id === record.id);
          if (idx >= 0) cache[idx] = record;
          else cache.push(record);
        }
        updateStorageTelemetry();
      }

      async function enforceAutoRollover(incomingBytes = 0) {
        const mediaOnly = cache.filter(m => m.kind !== 'property_file');
        let total = mediaOnly.reduce((sum, m) => sum + (m.sizeBytes || 0), 0) + incomingBytes;
        if (total <= maxBytes) return;

        const candidates = mediaOnly
          .filter(m => !m.pinned)
          .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

        for (const victim of candidates) {
          if (total <= maxBytes) break;
          await deleteMedia(victim.id, true);
          total -= (victim.sizeBytes || 0);
        }
      }

      function compressImageFile(file) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
              const maxDim = 1400;
              let w = img.width;
              let h = img.height;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
              resolve(dataUrl);
            };
            img.onerror = () => resolve(ev.target.result);
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      function readBlobAsDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.onerror = (e) => reject(e);
          reader.readAsDataURL(blob);
        });
      }

      async function addPhotoFile(file, contextTag = 'general') {
        const dataUrl = await compressImageFile(file);
        const sizeBytes = Math.round((dataUrl.length * 3) / 4);
        await enforceAutoRollover(sizeBytes);

        const item = {
          id: 'med_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          kind: 'photo',
          name: file.name || 'photo.jpg',
          mimeType: 'image/jpeg',
          dataUrl,
          sizeBytes,
          createdAt: Date.now(),
          pinned: false,
          contextTag
        };
        await putRecord(item);
        MaalkiGitHubSync.schedulePush({ mediaId: item.id });
        return item;
      }

      async function addAudioBlob(blob, durationSec = 0, name = 'Voice Note', contextTag = 'general') {
        const dataUrl = await readBlobAsDataUrl(blob);
        const sizeBytes = blob.size || Math.round((dataUrl.length * 3) / 4);
        await enforceAutoRollover(sizeBytes);

        const item = {
          id: 'med_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          kind: 'audio',
          name,
          mimeType: blob.type || 'audio/webm',
          dataUrl,
          durationSec: Math.round(durationSec),
          sizeBytes,
          createdAt: Date.now(),
          pinned: false,
          contextTag
        };
        await putRecord(item);
        MaalkiGitHubSync.schedulePush({ mediaId: item.id });
        return item;
      }

      async function addVideoBlob(blob, durationSec = 0, posterDataUrl = '', name = 'Video Walkthrough', contextTag = 'general') {
        const dataUrl = await readBlobAsDataUrl(blob);
        const sizeBytes = blob.size || Math.round((dataUrl.length * 3) / 4);
        await enforceAutoRollover(sizeBytes);

        const item = {
          id: 'med_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          kind: 'video',
          name,
          mimeType: blob.type || 'video/mp4',
          dataUrl,
          posterDataUrl,
          durationSec: Math.round(durationSec),
          sizeBytes,
          createdAt: Date.now(),
          pinned: false,
          contextTag
        };
        await putRecord(item);
        MaalkiGitHubSync.schedulePush({ mediaId: item.id });
        return item;
      }

      async function togglePin(id) {
        const item = getMedia(id);
        if (!item) return;
        item.pinned = !item.pinned;
        await putRecord(item);
        MaalkiGitHubSync.schedulePush({ mediaId: item.id });
      }

      async function deleteMedia(id, silent = false) {
        if (db) {
          await new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).delete(id);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          });
        }
        cache = cache.filter(m => m.id !== id);
        updateStorageTelemetry();
        if (!silent) MaalkiGitHubSync.schedulePush();
      }

      async function savePropertyDossier(propertyObj, relatedData = {}) {
        if (!propertyObj || !propertyObj.id) return;
        const existing = getDossier(propertyObj.id);
        const dossier = {
          id: 'pfile_' + propertyObj.id,
          kind: 'property_file',
          fileName: 'pfile_' + propertyObj.id,
          propertyId: propertyObj.id,
          archived: false,
          pinned: true,
          createdAt: existing ? existing.createdAt : Date.now(),
          updatedAt: Date.now(),
          property: { ...propertyObj },
          inspections: relatedData.inspections || [],
          tasks: relatedData.tasks || [],
          transactions: relatedData.transactions || []
        };
        await putRecord(dossier);
        MaalkiGitHubSync.schedulePush({ dossierPropertyId: propertyObj.id });
        return dossier;
      }

      async function archivePropertyDossier(propertyObj, relatedData = {}) {
        if (!propertyObj || !propertyObj.id) return;
        const existing = getDossier(propertyObj.id);
        const dossier = {
          id: 'pfile_' + propertyObj.id,
          kind: 'property_file',
          fileName: 'pfile_' + propertyObj.id,
          propertyId: propertyObj.id,
          archived: true,
          archivedAt: new Date().toISOString(),
          pinned: true,
          createdAt: existing ? existing.createdAt : Date.now(),
          updatedAt: Date.now(),
          property: { ...propertyObj },
          inspections: relatedData.inspections || [],
          tasks: relatedData.tasks || [],
          transactions: relatedData.transactions || []
        };
        await putRecord(dossier);
        MaalkiGitHubSync.schedulePush({ dossierPropertyId: propertyObj.id });
        return dossier;
      }

      async function importDossierDirect(dossierObj) {
        if (!dossierObj || !dossierObj.id) return;
        await putRecord({ ...dossierObj, kind: 'property_file', pinned: true });
      }

      async function importAll(items = []) {
        for (const item of items) {
          if (!item || !item.id) continue;
          await putRecord(item);
        }
      }

      function exportAll() {
        return {
          mediaItems: getAllMedia(),
          propertyDossiers: getAllDossiers()
        };
      }

      function setLimitMB(mb) {
        const val = Math.max(10, Number(mb) || 50);
        localStorage.setItem(LIMIT_KEY, String(val));
        maxBytes = val * 1024 * 1024;
        enforceAutoRollover(0);
        updateStorageTelemetry();
      }

      function getStats() {
        const photos = cache.filter(m => m.kind === 'photo');
        const audio = cache.filter(m => m.kind === 'audio');
        const videos = cache.filter(m => m.kind === 'video');
        const usedBytes = cache.reduce((s, m) => s + (m.sizeBytes || 0), 0);
        return {
          photoCount: photos.length,
          audioCount: audio.length,
          videoCount: videos.length,
          dossierCount: dossierCache.length,
          archivedDossierCount: dossierCache.filter(d => d.archived).length,
          usedBytes,
          maxBytes,
          usedMB: (usedBytes / (1024 * 1024)).toFixed(1),
          maxMB: Math.round(maxBytes / (1024 * 1024)),
          pct: Math.min(100, Math.round((usedBytes / maxBytes) * 100))
        };
      }

      function updateStorageTelemetry() {
        const st = getStats();
        const bar = document.getElementById('sidebar-storage-bar');
        const sLabel = document.getElementById('sidebar-storage-label');
        const tText = document.getElementById('topbar-storage-text');
        const mBadge = document.getElementById('mobile-storage-badge');

        if (bar) bar.style.width = `${Math.max(4, st.pct)}%`;
        if (sLabel) sLabel.textContent = `${st.usedMB} / ${st.maxMB} MB • ${st.photoCount}P • ${st.audioCount}A • ${st.videoCount}V`;
        if (tText) tText.textContent = `Auto-Rollover: ON • ${st.usedMB} / ${st.maxMB} MB`;
        if (mBadge) mBadge.textContent = `${st.usedMB}/${st.maxMB}MB`;
      }

      return {
        init,
        getAllMedia,
        getMedia,
        getDossier,
        getAllDossiers,
        addPhotoFile,
        addAudioBlob,
        addVideoBlob,
        togglePin,
        deleteMedia,
        savePropertyDossier,
        archivePropertyDossier,
        importDossierDirect,
        importAll,
        exportAll,
        setLimitMB,
        getStats,
        updateStorageTelemetry
      };
    })();

    /**
     * ==========================================================================
     * 4. DEVICE AUTH, LAST-CHOSEN PROFILE PERSISTENCE & PROFILE SWITCHER
     * ==========================================================================
     */
    const MaalkiAuth = (() => {
      const VAULT_BUNDLE_KEY = 'maalki_vault_bundle_v1';
      const DEVICE_UNLOCK_KEY = 'maalki_device_unlocked_v1';
      const ACTIVE_USER_KEY = 'maalki_active_user_id_v1';
      const LOCAL_USERS_KEY = 'maalki_users_v1';

      let isNewUserMode = false;
      let selectedExistingUserId = null;

      function getVaultBundle() {
        try {
          const raw = localStorage.getItem(VAULT_BUNDLE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.encryptedToken) return parsed;
          }
        } catch (e) { /* ignore */ }
        if (MAALKI_VAULT_CONFIG && MAALKI_VAULT_CONFIG.encryptedToken) {
          return { ...MAALKI_VAULT_CONFIG };
        }
        return null;
      }

      function saveVaultBundle(bundle) {
        try {
          localStorage.setItem(VAULT_BUNDLE_KEY, JSON.stringify(bundle));
        } catch (e) { /* ignore */ }
      }

      async function createPassphrase(githubToken, chosenPassphrase = '', repoName = 'maalki-vault') {
        const cleanToken = (githubToken || '').trim();
        if (!cleanToken) {
          throw new Error('Please provide your GitHub Classic Token (ghp_...).');
        }
        const passphrase = (chosenPassphrase || '').trim() || MaalkiCrypto.generatePassphrase();
        const userInfo = await MaalkiGitHubSync.verifyToken(cleanToken);
        const owner = userInfo.login;
        const repo = (repoName || 'maalki-vault').trim();

        const encryptedToken = await MaalkiCrypto.packTokenString(
          {
            token: cleanToken,
            owner,
            repo,
            branch: 'main',
            createdAt: new Date().toISOString()
          },
          passphrase
        );

        const bundle = { owner, repo, branch: 'main', encryptedToken };
        saveVaultBundle(bundle);
        updateLoginVaultStatus();

        const snippet = [
          'const MAALKI_VAULT_CONFIG = {',
          `  owner: "${owner}",`,
          `  repo: "${repo}",`,
          `  branch: "main",`,
          `  encryptedToken: "${encryptedToken}"`,
          '};'
        ].join('\n');

        console.log('%c[Maalki] Encrypted Vault Bundle Created', 'color: #00A7E1; font-weight: bold; font-size: 13px;');
        console.log('%cYour Permanent Passphrase:', 'font-weight: bold;', passphrase);
        console.log('%cPaste into MAALKI_VAULT_CONFIG in index.html for multi-device login:\n', 'font-weight: bold;', snippet);

        return { passphrase, owner, repo, encryptedToken };
      }

      // Expose console helper on window.Maalki
      window.Maalki = {
        createPassphrase,
        encryptToken: (token, passOrRepo, maybeRepo) => {
          if (passOrRepo && !passOrRepo.includes('/') && maybeRepo) {
            const repoPart = maybeRepo.includes('/') ? maybeRepo.split('/')[1] : maybeRepo;
            return createPassphrase(token, passOrRepo, repoPart);
          }
          const repoPart = passOrRepo && passOrRepo.includes('/') ? passOrRepo.split('/')[1] : (passOrRepo || 'maalki-vault');
          return createPassphrase(token, '', repoPart);
        }
      };

      function loadLocalUsers() {
        let localList = [];
        try {
          const raw = localStorage.getItem(LOCAL_USERS_KEY);
          if (raw) localList = JSON.parse(raw) || [];
        } catch (e) { /* ignore */ }

        const mergedMap = new Map();
        [...localList, ...(appState.users || [])].forEach(u => {
          if (!u || !u.id) return;
          const checkName = `${u.firstName || ''} ${u.lastName || ''}`.trim().toLowerCase();
          if (u.id === 'usr_admin_default' || checkName === 'admin admin') return;
          mergedMap.set(u.id, {
            id: u.id,
            firstName: u.firstName || '',
            lastName: u.lastName || '',
            fullName: `${u.firstName || ''} ${u.lastName || ''}`.trim() || 'Tejveer Randhawa',
            avatarMediaId: u.avatarMediaId || null,
            updatedAt: u.updatedAt || Date.now()
          });
        });

        // Initial seed profile if no users exist yet
        if (mergedMap.size === 0) {
          const defaultUser = {
            id: 'usr_tejveer_randhawa',
            firstName: 'Tejveer',
            lastName: 'Randhawa',
            fullName: 'Tejveer Randhawa',
            avatarMediaId: null,
            updatedAt: Date.now()
          };
          mergedMap.set(defaultUser.id, defaultUser);
          saveLocalUsers([defaultUser]);
        }

        return Array.from(mergedMap.values());
      }

      function saveLocalUsers(users) {
        try {
          localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(users));
        } catch (e) { /* ignore */ }
        appState.users = users;
      }

      function setLastChosenUserOnDevice(userId) {
        if (!userId) return;
        selectedExistingUserId = userId;
        try {
          localStorage.setItem(ACTIVE_USER_KEY, userId);
        } catch (e) { /* ignore */ }
      }

      function mergeRemoteUsers(remoteUsers = []) {
        const current = loadLocalUsers();
        const byId = new Map(current.map(u => [u.id, u]));
        for (const ru of remoteUsers) {
          if (!ru || !ru.id) continue;
          const checkName = `${ru.firstName || ''} ${ru.lastName || ''}`.trim().toLowerCase();
          if (ru.id === 'usr_admin_default' || checkName === 'admin admin') continue;
          const existing = byId.get(ru.id);
          if (!existing || (ru.updatedAt || 0) >= (existing.updatedAt || 0)) {
            byId.set(ru.id, {
              id: ru.id,
              firstName: ru.firstName || 'Tejveer',
              lastName: ru.lastName || 'Randhawa',
              fullName: `${ru.firstName || ''} ${ru.lastName || ''}`.trim() || 'Tejveer Randhawa',
              avatarMediaId: ru.avatarMediaId || existing?.avatarMediaId || null,
              updatedAt: ru.updatedAt || Date.now()
            });
          }
        }
        saveLocalUsers(Array.from(byId.values()));
        updateHeaderProfileUI();
      }

      function getActiveUser() {
        const users = loadLocalUsers();
        const lastDeviceUserId = localStorage.getItem(ACTIVE_USER_KEY);
        if (lastDeviceUserId) {
          const found = users.find(u => u.id === lastDeviceUserId);
          if (found) return found;
        }
        return users.find(u => u.id === 'usr_tejveer_randhawa') || users[0];
      }

      function getActiveUserFullName() {
        const u = getActiveUser();
        return u ? `${u.firstName} ${u.lastName}`.trim() : 'Tejveer Randhawa';
      }

      function getInitials(user) {
        if (!user) return 'TR';
        const f = (user.firstName || '').trim().charAt(0).toUpperCase();
        const l = (user.lastName || '').trim().charAt(0).toUpperCase();
        return (f + l) || f || 'TR';
      }

      function renderAvatarMarkup(user, sizeClasses = 'w-8 h-8 text-xs') {
        const avatarItem = user?.avatarMediaId ? MaalkiMediaStore.getMedia(user.avatarMediaId) : null;
        if (avatarItem && avatarItem.dataUrl) {
          return `<img src="${avatarItem.dataUrl}" alt="${escapeHtml(user.fullName || 'Profile')}" class="${sizeClasses} rounded-full object-cover" />`;
        }
        return `<span class="${sizeClasses} rounded-full flex items-center justify-center font-bold text-white" style="background-color: #00A7E1;">${escapeHtml(getInitials(user))}</span>`;
      }

      function updateHeaderProfileUI() {
        const user = getActiveUser();
        const dAvatar = document.getElementById('desktop-profile-avatar');
        const dName = document.getElementById('desktop-profile-name');
        const mAvatar = document.getElementById('mobile-profile-avatar');

        if (dName) dName.textContent = user ? `${user.firstName} ${user.lastName}` : 'Tejveer Randhawa';
        if (dAvatar) dAvatar.innerHTML = renderAvatarMarkup(user, 'w-7 h-7 text-xs');
        if (mAvatar) mAvatar.innerHTML = renderAvatarMarkup(user, 'w-8 h-8 text-xs');
      }

      function upsertUser({ id, firstName, lastName, avatarMediaId }) {
        const users = loadLocalUsers();
        const fName = (firstName || '').trim() || 'Tejveer';
        const lName = (lastName || '').trim() || 'Randhawa';
        const fullName = `${fName} ${lName}`.trim();

        let target = id ? users.find(u => u.id === id) : users.find(u => u.fullName.toLowerCase() === fullName.toLowerCase());
        if (target) {
          target.firstName = fName;
          target.lastName = lName;
          target.fullName = fullName;
          if (avatarMediaId !== undefined) target.avatarMediaId = avatarMediaId;
          target.updatedAt = Date.now();
        } else {
          target = {
            id: 'usr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
            firstName: fName,
            lastName: lName,
            fullName,
            avatarMediaId: avatarMediaId || null,
            updatedAt: Date.now()
          };
          users.push(target);
        }

        saveLocalUsers(users);
        setLastChosenUserOnDevice(target.id);
        updateHeaderProfileUI();
        return target;
      }

      function updateLoginVaultStatus() {
        const statusEl = document.getElementById('login-vault-status');
        if (!statusEl) return;
        const bundle = getVaultBundle();
        if (bundle && bundle.encryptedToken) {
          statusEl.innerHTML = `Encrypted vault detected for <strong class="m-text">${escapeHtml(bundle.owner || 'GitHub')}/${escapeHtml(bundle.repo || 'maalki-vault')}</strong>. Enter your passphrase to unlock.`;
        } else {
          statusEl.innerHTML = `No encrypted vault bundle found yet on this browser. Open <strong>Inspect → Console</strong> and run <code>await Maalki.createPassphrase("ghp_...", "your-passphrase")</code> once.`;
        }
      }

      function renderLoginUserList() {
        const listWrap = document.getElementById('login-user-list-wrap');
        const listEl = document.getElementById('login-user-list');
        const newFields = document.getElementById('login-new-user-fields');
        const toggleBtn = document.getElementById('login-toggle-new-user');
        if (!listWrap || !listEl) return;

        const users = loadLocalUsers();
        const lastChosenId = localStorage.getItem(ACTIVE_USER_KEY);

        if (isNewUserMode) {
          listWrap.classList.add('hidden');
          if (newFields) newFields.classList.remove('hidden');
          if (toggleBtn) toggleBtn.textContent = '← Choose Existing Name';
          return;
        }

        if (newFields) newFields.classList.add('hidden');
        if (toggleBtn) toggleBtn.textContent = '+ Add New Name';

        // Always default to whichever profile was last chosen on this device
        if (!selectedExistingUserId || !users.some(u => u.id === selectedExistingUserId)) {
          if (lastChosenId && users.some(u => u.id === lastChosenId)) {
            selectedExistingUserId = lastChosenId;
          } else {
            const defaultUser = users.find(u => u.id === 'usr_tejveer_randhawa');
            selectedExistingUserId = defaultUser ? defaultUser.id : users[0].id;
          }
        }

        listWrap.classList.remove('hidden');
        listEl.innerHTML = users.map(u => {
          const active = !isNewUserMode && u.id === selectedExistingUserId;
          const isLastOnDevice = u.id === lastChosenId;
          return `
            <button type="button" onclick="selectLoginExistingUser('${u.id}')" class="w-full min-h-[48px] flex items-center justify-between p-2.5 rounded-xl border text-left transition-colors cursor-pointer ${active ? 'border-[#00A7E1] nav-item-active' : 'm-border m-canvas hover:border-[#00A7E1]'}">
              <span class="flex items-center gap-2.5 min-w-0">
                ${renderAvatarMarkup(u, 'w-8 h-8 text-xs shrink-0')}
                <span class="min-w-0">
                  <span class="block font-semibold text-xs truncate">${escapeHtml(u.firstName)} ${escapeHtml(u.lastName)}</span>
                  <span class="block text-[10px] m-text-muted">${isLastOnDevice ? 'Last chosen on this device' : 'Manager / Inspector'}</span>
                </span>
              </span>
              <span class="text-xs font-bold shrink-0 ml-2" style="color: #00A7E1;">${active ? '✓ Selected' : 'Select'}</span>
            </button>
          `;
        }).join('');
      }

      window.selectLoginExistingUser = (userId) => {
        isNewUserMode = false;
        setLastChosenUserOnDevice(userId);
        renderLoginUserList();
      };

      window.toggleLoginNewUserMode = () => {
        isNewUserMode = !isNewUserMode;
        renderLoginUserList();
        if (isNewUserMode) {
          setTimeout(() => document.getElementById('login-first-name')?.focus(), 50);
        }
      };

      window.toggleLoginPassVisibility = () => {
        const inp = document.getElementById('login-passphrase');
        if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
      };

      function showLoginScreen() {
        const screen = document.getElementById('login-screen');
        const shell = document.getElementById('app-shell');
        if (shell) shell.classList.add('hidden');
        if (screen) screen.classList.remove('hidden');
        updateLoginVaultStatus();
        renderLoginUserList();
      }

      function hideLoginScreen() {
        const screen = document.getElementById('login-screen');
        const shell = document.getElementById('app-shell');
        if (screen) screen.classList.add('hidden');
        if (shell) shell.classList.remove('hidden');
        updateHeaderProfileUI();
      }

      async function completeLogin({ firstName, lastName, existingUserId, passphrase }) {
        const bundle = getVaultBundle();
        if (!bundle || !bundle.encryptedToken) {
          throw new Error('No encrypted GitHub vault key found. Run Maalki.createPassphrase("ghp_...", "your-passphrase") in the browser console first.');
        }
        if (!passphrase || !passphrase.trim()) {
          throw new Error('Please enter your vault passphrase.');
        }

        const cleanPass = passphrase.trim();
        const unpacked = await MaalkiCrypto.unpackTokenString(bundle.encryptedToken, cleanPass);

        let userRecord;
        if (existingUserId) {
          const users = loadLocalUsers();
          userRecord = users.find(u => u.id === existingUserId) || upsertUser({ firstName: 'Tejveer', lastName: 'Randhawa' });
          setLastChosenUserOnDevice(userRecord.id);
        } else {
          if (!firstName || !lastName) {
            throw new Error('Please enter both First Name and Last Name.');
          }
          userRecord = upsertUser({ firstName, lastName });
        }

        localStorage.setItem(DEVICE_UNLOCK_KEY, JSON.stringify({
          unlockedAt: Date.now(),
          userId: userRecord.id,
          passphrase: cleanPass
        }));

        await MaalkiGitHubSync.connect({
          token: unpacked.token,
          owner: unpacked.owner || bundle.owner,
          repo: unpacked.repo || bundle.repo || 'maalki-vault',
          branch: unpacked.branch || bundle.branch || 'main',
          passphrase: cleanPass
        });

        saveState();
        hideLoginScreen();
        renderCurrentView();
        showToast(`Welcome, ${userRecord.firstName} ${userRecord.lastName}`);
      }

      function lockDeviceSession() {
        const lastId = getActiveUser()?.id || localStorage.getItem(ACTIVE_USER_KEY) || 'usr_tejveer_randhawa';
        localStorage.removeItem(DEVICE_UNLOCK_KEY);
        MaalkiGitHubSync.disconnect();
        selectedExistingUserId = lastId;
        isNewUserMode = false;
        showLoginScreen();
      }

      async function bootAuth() {
        const users = loadLocalUsers();
        const lastChosenId = localStorage.getItem(ACTIVE_USER_KEY);
        if (lastChosenId && users.some(u => u.id === lastChosenId)) {
          selectedExistingUserId = lastChosenId;
        } else {
          const defaultUser = users.find(u => u.id === 'usr_tejveer_randhawa') || users[0];
          selectedExistingUserId = defaultUser ? defaultUser.id : 'usr_tejveer_randhawa';
          setLastChosenUserOnDevice(selectedExistingUserId);
        }

        updateHeaderProfileUI();

        const rawUnlock = localStorage.getItem(DEVICE_UNLOCK_KEY);
        const bundle = getVaultBundle();

        if (rawUnlock && bundle && bundle.encryptedToken) {
          try {
            const unlockObj = JSON.parse(rawUnlock);
            if (unlockObj && unlockObj.passphrase) {
              const unpacked = await MaalkiCrypto.unpackTokenString(bundle.encryptedToken, unlockObj.passphrase);
              hideLoginScreen();
              MaalkiGitHubSync.connect({
                token: unpacked.token,
                owner: unpacked.owner || bundle.owner,
                repo: unpacked.repo || bundle.repo || 'maalki-vault',
                branch: unpacked.branch || bundle.branch || 'main',
                passphrase: unlockObj.passphrase
              }).catch(() => {});
              return;
            }
          } catch (e) {
            localStorage.removeItem(DEVICE_UNLOCK_KEY);
          }
        }

        showLoginScreen();
      }

      return {
        bootAuth,
        loadLocalUsers,
        mergeRemoteUsers,
        getActiveUser,
        getSelectedExistingUserId: () => selectedExistingUserId,
        getActiveUserFullName,
        renderAvatarMarkup,
        updateHeaderProfileUI,
        upsertUser,
        setLastChosenUserOnDevice,
        getVaultBundle,
        completeLogin,
        lockDeviceSession
      };
    })();

              </div>
            ` : `<p class="text-xs m-text-muted">No other profiles saved yet. Click "+ Add New User" to add another team member.</p>`}

            <!-- Inline Add New User Form -->

                Media Auto-Rollover

          firstName: fd.get('firstName'),

    function quickSwitchToUser(userId) {
      const users = MaalkiAuth.loadLocalUsers();
      const target = users.find(u => u.id === userId);
      if (!target) return;
      MaalkiAuth.setLastChosenUserOnDevice(userId);

    function formatCurrency(val) {
      const num = Number(val) || 0;
      return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDuration(sec) {
      const s = Math.max(0, Math.round(Number(sec) || 0));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getPropertyName(propertyId) {
      if (!propertyId || propertyId === 'general') return 'General Portfolio';
      const prop = appState.properties.find(p => p.id === propertyId);
      if (prop) return prop.name;
      const dossier = MaalkiMediaStore.getDossier(propertyId);
      return dossier?.property?.name ? `${dossier.property.name} (Archived)` : 'Property';
    }

      const author = typeof MaalkiAuth !== 'undefined' ? MaalkiAuth.getActiveUserFullName() : 'Tejveer Randhawa';

        text: `${text} (${author})`,

      if (appState.activityLog.length > 30) appState.activityLog.length = 30;

    async function handleDropzoneFiles(fileList, zoneId, hintKind = 'photo') {
      const entry = activeDropzoneCallbacks.get(zoneId);
      if (!entry || !fileList || fileList.length === 0) return;

      const addedIds = [];
      for (const file of Array.from(fileList)) {
        if (file.type.startsWith('video/') || hintKind === 'video') {
          const item = await MaalkiMediaStore.addVideoBlob(file, 0, '', file.name || 'Video Clip', zoneId);
          addedIds.push(item.id);
        } else if (file.type.startsWith('audio/')) {
          const item = await MaalkiMediaStore.addAudioBlob(file, 0, file.name || 'Audio Clip', zoneId);
          addedIds.push(item.id);
        } else {
          const item = await MaalkiMediaStore.addPhotoFile(file, zoneId);
          addedIds.push(item.id);
        }
      }
      const next = [...entry.mediaIds, ...addedIds];
      entry.mediaIds = next;
      if (entry.onChange) entry.onChange(next);
    }

    function handleDropzoneDrop(event, zoneId) {
      event.preventDefault();
      event.currentTarget.classList.remove('drag-over');
      if (event.dataTransfer && event.dataTransfer.files) {
        handleDropzoneFiles(event.dataTransfer.files, zoneId);
      }
    }

    async function toggleDropzoneMediaPin(zoneId, mediaId) {
      await MaalkiMediaStore.togglePin(mediaId);
      const entry = activeDropzoneCallbacks.get(zoneId);
      if (entry && entry.onChange) entry.onChange([...entry.mediaIds]);
      showToast('Updated Pin protection status.');
    }

    async function removeMediaFromDropzone(zoneId, mediaId) {
      const entry = activeDropzoneCallbacks.get(zoneId);
      if (!entry) return;
      await MaalkiMediaStore.deleteMedia(mediaId);
      const next = entry.mediaIds.filter(id => id !== mediaId);
      entry.mediaIds = next;
      if (entry.onChange) entry.onChange(next);
    }
