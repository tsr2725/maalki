    function openAudioRecorderModal(zoneId) {
      let mediaRecorder = null;
      let chunks = [];
      let stream = null;
      let startTs = 0;
      let timerInterval = null;
      let elapsedSec = 0;

      openModal(`
        <div class="px-6 py-4 border-b m-border flex items-center justify-between">
          <div>
            <h3 class="font-bold text-base">Record Inspection / Maintenance Audio</h3>
            <p class="text-xs m-text-muted mt-0.5">Saved directly to Unified Auto-Rollover Repository</p>
          </div>
          <button type="button" id="close-audio-rec" class="w-8 h-8 rounded-lg btn-ghost flex items-center justify-center text-lg cursor-pointer">&times;</button>
        </div>
        <div class="p-6 space-y-4 text-sm">
          <div>
            <label class="block text-xs font-semibold m-text-sec mb-1">Recording Label</label>
            <input type="text" id="audio-rec-title" value="Voice Note — ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}" class="m-input" />
          </div>
          <div class="p-4 rounded-xl m-subtle text-center space-y-2">
            <div class="flex items-center justify-center gap-2">
              <span id="audio-rec-dot" class="w-2.5 h-2.5 rounded-full bg-neutral-400"></span>
              <span id="audio-rec-timer" class="font-mono-num text-xl font-bold">00:00</span>
            </div>
            <p id="audio-rec-status" class="text-xs m-text-muted">Ready to capture microphone audio</p>
          </div>
          <div class="flex flex-wrap justify-center gap-2.5">
            <button type="button" id="btn-start-audio" class="btn-accent px-4 py-2 rounded-xl text-xs cursor-pointer">Start Recording</button>
            <button type="button" id="btn-stop-audio" disabled class="btn-ghost px-4 py-2 rounded-xl text-xs opacity-50 cursor-pointer">Stop &amp; Save</button>
            <label class="btn-ghost px-4 py-2 rounded-xl text-xs cursor-pointer">
              Upload Audio File
              <input type="file" accept="audio/*" id="audio-file-fallback" class="hidden" />
            </label>
          </div>
        </div>
      `);

      const cleanup = () => {
        if (timerInterval) clearInterval(timerInterval);
        if (stream) stream.getTracks().forEach(t => t.stop());
      };

      document.getElementById('close-audio-rec').onclick = () => {
        cleanup();
        closeModal();
      };

      document.getElementById('audio-file-fallback').onchange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const title = document.getElementById('audio-rec-title').value.trim() || file.name;
        const item = await MaalkiMediaStore.addAudioBlob(file, 0, title, zoneId);
        const entry = activeDropzoneCallbacks.get(zoneId);
        if (entry) {
          entry.mediaIds = [...entry.mediaIds, item.id];
          if (entry.onChange) entry.onChange(entry.mediaIds);
        }
        cleanup();
        closeModal();
        showToast('Audio saved to Unified Repo.');
      };

      document.getElementById('btn-start-audio').onclick = async () => {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          chunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
          mediaRecorder.onstop = async () => {
            const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            const title = document.getElementById('audio-rec-title').value.trim() || 'Voice Note';
            const item = await MaalkiMediaStore.addAudioBlob(blob, elapsedSec, title, zoneId);
            const entry = activeDropzoneCallbacks.get(zoneId);
            if (entry) {
              entry.mediaIds = [...entry.mediaIds, item.id];
              if (entry.onChange) entry.onChange(entry.mediaIds);
            }
            cleanup();
            closeModal();
            showToast('Audio recording saved.');
          };
          mediaRecorder.start();
          startTs = Date.now();
          document.getElementById('audio-rec-dot').classList.add('rec-dot');
          document.getElementById('audio-rec-dot').style.backgroundColor = '#00A7E1';
          document.getElementById('audio-rec-status').textContent = 'Recording in progress...';
          document.getElementById('btn-start-audio').disabled = true;
          const stopBtn = document.getElementById('btn-stop-audio');
          stopBtn.disabled = false;
          stopBtn.classList.remove('opacity-50');
          timerInterval = setInterval(() => {
            elapsedSec = Math.floor((Date.now() - startTs) / 1000);
            const tEl = document.getElementById('audio-rec-timer');
            if (tEl) tEl.textContent = formatDuration(elapsedSec);
          }, 300);
        } catch (err) {
          showToast('Microphone unavailable — use "Upload Audio File" instead.');
        }
      };

      document.getElementById('btn-stop-audio').onclick = () => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
      };
    }

            <button type="button" id="btn-flip-cam" class="btn-ghost px-3 py-2 rounded-xl text-xs cursor-pointer">Flip Camera</button>
            <button type="button" id="btn-start-video" class="btn-accent px-4 py-2 rounded-xl text-xs cursor-pointer">Start Recording</button>
            <button type="button" id="btn-stop-video" disabled class="btn-ghost px-4 py-2 rounded-xl text-xs opacity-50 cursor-pointer">Stop &amp; Save</button>
            <label class="btn-ghost px-3 py-2 rounded-xl text-xs cursor-pointer">
              Native Camera / Upload
              <input type="file" accept="video/*" capture="environment" id="video-file-fallback" class="hidden" />
            </label>
          </div>
        </div>
      `);

      const startPreview = async () => {
        if (stream) stream.getTracks().forEach(t => t.stop());
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: true });
          const vid = document.getElementById('video-rec-preview');
          if (vid) vid.srcObject = stream;
        } catch (e) {
          showToast('Camera preview unavailable — use "Native Camera / Upload".');
        }
      };
      startPreview();

      const cleanup = () => {
        if (timerInterval) clearInterval(timerInterval);
        if (stream) stream.getTracks().forEach(t => t.stop());
      };

      document.getElementById('close-video-rec').onclick = () => {
        cleanup();
        closeModal();
      };

      document.getElementById('btn-flip-cam').onclick = () => {
        facingMode = facingMode === 'environment' ? 'user' : 'environment';
        startPreview();
      };

      document.getElementById('video-file-fallback').onchange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const item = await MaalkiMediaStore.addVideoBlob(file, 0, '', file.name || 'Video Clip', zoneId);
        const entry = activeDropzoneCallbacks.get(zoneId);
        if (entry) {
          entry.mediaIds = [...entry.mediaIds, item.id];
          if (entry.onChange) entry.onChange(entry.mediaIds);
        }
        cleanup();
        closeModal();
        showToast('Video saved to Unified Repo.');
      };

      document.getElementById('btn-start-video').onclick = () => {
        if (!stream) return;
        chunks = [];
        const vidEl = document.getElementById('video-rec-preview');
        let posterDataUrl = '';
        try {
          const c = document.createElement('canvas');
          c.width = 480;
          c.height = 270;
          c.getContext('2d').drawImage(vidEl, 0, 0, c.width, c.height);
          posterDataUrl = c.toDataURL('image/jpeg', 0.72);
        } catch (e) { /* ignore */ }

        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'video/webm' });
          const item = await MaalkiMediaStore.addVideoBlob(blob, elapsedSec, posterDataUrl, 'Walkthrough Video', zoneId);
          const entry = activeDropzoneCallbacks.get(zoneId);
          if (entry) {
            entry.mediaIds = [...entry.mediaIds, item.id];
            if (entry.onChange) entry.onChange(entry.mediaIds);
          }
          cleanup();
          closeModal();
          showToast('Video saved to Unified Repo.');
        };

        mediaRecorder.start();
        startTs = Date.now();
        document.getElementById('video-rec-dot').classList.add('rec-dot');
        document.getElementById('video-rec-dot').style.backgroundColor = '#00A7E1';
        document.getElementById('btn-start-video').disabled = true;
        const stopBtn = document.getElementById('btn-stop-video');
        stopBtn.disabled = false;
        stopBtn.classList.remove('opacity-50');
        timerInterval = setInterval(() => {
          elapsedSec = Math.floor((Date.now() - startTs) / 1000);
          const tEl = document.getElementById('video-rec-timer');
          if (tEl) tEl.textContent = formatDuration(elapsedSec);
        }, 300);
      };

      document.getElementById('btn-stop-video').onclick = () => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
      };
    }

    async function deletePropertyWithArchive(propertyId) {
      const prop = appState.properties.find(p => p.id === propertyId);
      if (!prop) return;

      const propInspections = appState.inspections.filter(i => i.propertyId === propertyId);
      const propTasks = appState.tasks.filter(t => t.propertyId === propertyId);
      const propTransactions = appState.transactions.filter(tx => tx.propertyId === propertyId);

      await MaalkiMediaStore.archivePropertyDossier(prop, {
        inspections: propInspections,
        tasks: propTasks,
        transactions: propTransactions
      });

      const delTimestamp = Date.now();
      if (!appState.deletedIds) appState.deletedIds = {};
      appState.deletedIds[propertyId] = delTimestamp;
      propInspections.forEach(i => { appState.deletedIds[i.id] = delTimestamp; });
      propTasks.forEach(t => { appState.deletedIds[t.id] = delTimestamp; });
      propTransactions.forEach(tx => { appState.deletedIds[tx.id] = delTimestamp; });

      appState.properties = appState.properties.filter(p => p.id !== propertyId);
      appState.inspections = appState.inspections.filter(i => i.propertyId !== propertyId);
      appState.tasks = appState.tasks.filter(t => t.propertyId !== propertyId);
      appState.transactions = appState.transactions.filter(tx => tx.propertyId !== propertyId);

      logActivity(`Removed ${prop.name} from active portfolio (archived pfile_${prop.id}.json)`);
      saveState();
      closeModal();
      renderCurrentView();
      showToast(`${prop.name} removed from Maalki. File pfile_${prop.id}.json preserved in repo.`);
    }

    function quickLogRent(propertyId) {
      const prop = appState.properties.find(p => p.id === propertyId);
      if (!prop) return;
      const today = new Date().toISOString().slice(0, 10);
      appState.transactions.unshift({
        id: 'tx_' + Date.now(),
        date: today,
        propertyId: prop.id,
        type: 'Income',
        category: 'Rental Income',
        description: `${prop.rentFrequency} Rent — ${prop.tenantName || 'Tenant'}`,
        amount: prop.rentAmount,
        taxPeriod: 'FY2026',
        mediaIds: [],
        updatedAt: Date.now()
      });
      logActivity(`Logged ${formatCurrency(prop.rentAmount)} rent for ${prop.name}`);
      saveState();
      syncPropertyDossier(prop.id);
      renderCurrentView();
      showToast(`Logged ${formatCurrency(prop.rentAmount)} rent to Tax Ledger.`);

    /**

    let activeInspectionId = null;

    function buildDefaultRoomsState() {
      const templates = [
        { name: '1. Exterior, Roof & Grounds', checks: ['Roofing, gutters & downpipes clear', 'Driveway, paths & fencing secure', 'Exterior cladding & windows intact'] },
        { name: '2. Entryway & Hallways', checks: ['Front door locks, deadbolt & keys working', 'Flooring, skirting & walls clean', 'Smoke alarm tested & operational'] },
        { name: '3. Living & Dining Room', checks: ['Windows, blinds/curtains & latches', 'Heating / heat pump filters & operation', 'Power outlets, lighting & walls'] },
        { name: '4. Kitchen & Appliances', checks: ['Oven, cooktop & rangehood clean/working', 'Sink, tapware & under-sink plumbing dry', 'Benchtops, cabinetry & dishwasher'] },
        { name: '5. Primary Bedroom', checks: ['Carpets/flooring & walls undamaged', 'Wardrobe doors & tracks smooth', 'Windows & ventilation moisture-free'] },
        { name: '6. Secondary Bedrooms', checks: ['Walls, ceilings & flooring condition', 'Windows, curtains & door hardware', 'Lighting & electrical outlets'] },
        { name: '7. Main Bathroom & Ensuite', checks: ['Shower/bath seals, grout & drainage', 'Vanity, toilet & tapware leak-free', 'Extractor fan & ceiling free of mould'] },
        { name: '8. Laundry & Hot Water', checks: ['Tub, washing machine taps & hoses dry', 'Hot water cylinder / continuous flow check', 'Ventilation & floor drain clear'] },
        { name: '9. Smoke Alarms, Healthy Homes & Keys', checks: ['Photoelectric smoke alarms within expiry', 'Insulation, ventilation & heating compliant', 'Full key & remote set accounted for'] }
      ];
      return templates.map((t, idx) => ({
        id: 'room_' + (idx + 1),
        name: t.name,
        rating: 'Good',
        notes: '',
        checks: t.checks.map(c => ({ label: c, ok: true })),
        mediaIds: []
      }));
    }

          <div class="m-surface p-10 rounded-2xl text-center space-y-3">

            <div>
              <label class="block font-semibold m-text-muted mb-1">Inspector Name</label>

            <div>
              <label class="block font-semibold m-text-muted mb-1">Status</label>
              <select onchange="updateInspectionField('${insp.id}', 'status', this.value)" class="m-input text-xs">
                ${['In Progress', 'Completed', 'Follow-Up Required'].map(s => `<option value="${s}" ${insp.status === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>
          </div>

          <!-- Room-by-Room Sections -->
          <div class="space-y-4">
            ${(insp.rooms || []).map((room, rIdx) => `
              <div class="m-surface p-5 rounded-2xl space-y-3.5">

                  <h3 class="font-bold text-sm">${escapeHtml(room.name)}</h3>
                  <div class="flex flex-wrap gap-1.5">
                    ${['Good', 'Fair', 'Needs Repair', 'Urgent'].map(rt => `
                      <button type="button" onclick="setRoomRating('${insp.id}', ${rIdx}, '${rt}')" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold cursor-pointer ${room.rating === rt ? 'btn-accent' : 'btn-ghost'}">
                        ${rt}
                      </button>
                    `).join('')}
                  </div>
                </div>

                <!-- Sub-Checklist -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  ${(room.checks || []).map((chk, cIdx) => `
                    <label class="flex items-center gap-2 p-2 rounded-lg m-subtle text-xs cursor-pointer">
                      <input type="checkbox" ${chk.ok ? 'checked' : ''} onchange="toggleRoomCheck('${insp.id}', ${rIdx}, ${cIdx}, this.checked)" class="accent-[#00A7E1]" />
                      <span class="${chk.ok ? '' : 'line-through m-text-muted'}">${escapeHtml(chk.label)}</span>
                    </label>
                  `).join('')}
                </div>

                <!-- Room Notes -->
                <div>
                  <input type="text" value="${escapeHtml(room.notes || '')}" onchange="updateRoomNotes('${insp.id}', ${rIdx}, this.value)" placeholder="Room condition notes, meter readings, or repair comments..." class="m-input text-xs" />
                </div>

                <!-- Room Multimedia Dropzone Mount Point -->
                <div id="insp-room-dz-${insp.id}-${rIdx}"></div>
              </div>

          <div class="flex flex-wrap items-center justify-between gap-3">
            <button onclick="addCustomRoomToInspection('${insp.id}')" class="btn-ghost px-4 py-2 rounded-xl text-xs cursor-pointer">+ Add Custom Room / Area</button>
            <button onclick="deleteInspection('${insp.id}')" class="btn-ghost px-4 py-2 rounded-xl text-xs cursor-pointer">Delete Inspection</button>
          </div>
        </div>
      `;
    }

    function openNewInspectionModal(preselectedPropertyId = null) {
      if (appState.properties.length === 0) {
        showToast('Add a property first before starting an inspection.');
        openPropertyModal();
        return;
      }
      const defaultInspector = typeof MaalkiAuth !== 'undefined' ? MaalkiAuth.getActiveUserFullName() : 'Tejveer Randhawa';
      const propOptions = appState.properties.map(p =>
        `<option value="${p.id}" ${p.id === preselectedPropertyId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
      ).join('');

      openModal(`
        <div class="px-6 py-4 border-b m-border flex items-center justify-between">
          <h3 class="font-bold text-base">Start Property Inspection</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg btn-ghost flex items-center justify-center text-lg cursor-pointer">&times;</button>

        <form id="new-insp-form" class="p-6 space-y-4 text-sm">

            <select name="propertyId" required class="m-input">${propOptions}</select>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold m-text-sec mb-1">Inspection Type</label>
              <select name="type" class="m-input">
                <option value="Routine Inspection">Routine Inspection</option>
                <option value="Entry / Move-In">Entry / Move-In</option>
                <option value="Exit / Move-Out">Exit / Move-Out</option>
                <option value="Maintenance Check">Maintenance Check</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold m-text-sec mb-1">Inspection Date *</label>
              <input type="date" name="date" required value="${new Date().toISOString().slice(0, 10)}" class="m-input font-mono-num" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold m-text-sec mb-1">Inspector Name *</label>
            <input type="text" name="inspector" required value="${escapeHtml(defaultInspector)}" class="m-input" />

          <div class="pt-3 border-t m-border flex justify-end gap-2">

      document.getElementById('new-insp-form').onsubmit = (e) => {

          status: 'In Progress',
          summaryNotes: '',
          rooms: buildDefaultRoomsState(),
          updatedAt: Date.now()
        };
        appState.inspections.unshift(newInsp);
        activeInspectionId = newInsp.id;
        logActivity(`Started ${newInsp.type} for ${getPropertyName(newInsp.propertyId)}`);

        syncPropertyDossier(newInsp.propertyId);
        closeModal();
        navigateTo('inspections');
        showToast('Room-by-room inspection template created.');
      };

    function mountInspectionRoomDropzones() {
      const insp = appState.inspections.find(i => i.id === activeInspectionId);
      if (!insp) return;
      setTimeout(() => {
        (insp.rooms || []).forEach((room, rIdx) => {
          const el = document.getElementById(`insp-room-dz-${insp.id}-${rIdx}`);
          if (el) {
            el.innerHTML = renderMediaDropzone({
              zoneId: `insp-zone-${insp.id}-${rIdx}`,
              mediaIds: room.mediaIds || [],
              label: `${room.name} — Photos, Audio & Video`,
              onChange: (nextIds) => {
                room.mediaIds = nextIds;
                insp.updatedAt = Date.now();
                saveState();
                syncPropertyDossier(insp.propertyId);
                renderCurrentView();
              }
            });
          }
        });
      }, 0);
    }

    function updateInspectionField(inspId, field, value) {
      const insp = appState.inspections.find(i => i.id === inspId);
      if (!insp) return;
      insp[field] = value;
      insp.updatedAt = Date.now();
      saveState();
      syncPropertyDossier(insp.propertyId);
      showToast('Inspection saved.');
    }

    function setRoomRating(inspId, roomIdx, rating) {
      const insp = appState.inspections.find(i => i.id === inspId);
      if (!insp || !insp.rooms[roomIdx]) return;
      insp.rooms[roomIdx].rating = rating;
      insp.updatedAt = Date.now();
      saveState();
      syncPropertyDossier(insp.propertyId);
      renderCurrentView();
    }

    function toggleRoomCheck(inspId, roomIdx, checkIdx, checked) {
      const insp = appState.inspections.find(i => i.id === inspId);
      if (!insp || !insp.rooms[roomIdx]) return;
      insp.rooms[roomIdx].checks[checkIdx].ok = checked;
      insp.updatedAt = Date.now();
      saveState();
      syncPropertyDossier(insp.propertyId);
      renderCurrentView();
    }

    function updateRoomNotes(inspId, roomIdx, notes) {
      const insp = appState.inspections.find(i => i.id === inspId);
      if (!insp || !insp.rooms[roomIdx]) return;
      insp.rooms[roomIdx].notes = notes;
      insp.updatedAt = Date.now();
      saveState();
      syncPropertyDossier(insp.propertyId);
    }

    function addCustomRoomToInspection(inspId) {
      const insp = appState.inspections.find(i => i.id === inspId);
      if (!insp) return;
      const num = insp.rooms.length + 1;
      insp.rooms.push({
        id: 'custom_' + Date.now(),
        name: `${num}. Garage / Outdoor Storage`,
        rating: 'Good',
        notes: '',
        checks: [
          { label: 'Roller door / locks & remotes', ok: true },
          { label: 'Flooring, walls & moisture check', ok: true }
        ],
        mediaIds: []
      });
      insp.updatedAt = Date.now();
      saveState();
      syncPropertyDossier(insp.propertyId);
      renderCurrentView();
      showToast('Added custom room section.');
    }

    function exportFlaggedRoomsToMaintenance(inspId) {
      const insp = appState.inspections.find(i => i.id === inspId);
      if (!insp) return;
      const flagged = (insp.rooms || []).filter(r => r.rating === 'Needs Repair' || r.rating === 'Urgent');
      if (flagged.length === 0) {
        showToast('No rooms are currently rated "Needs Repair" or "Urgent".');
        return;
      }
      flagged.forEach(room => {
        appState.tasks.unshift({
          id: 'tsk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          propertyId: insp.propertyId,
          title: `Inspection Follow-Up: ${room.name}`,
          category: 'Repair',
          priority: room.rating === 'Urgent' ? 'Urgent' : 'Normal',
          estimatedCost: 0,
          dueDate: new Date().toISOString().slice(0, 10),
          completed: false,
          notes: room.notes || `Flagged during ${insp.type} on ${insp.date}`,
          mediaIds: [...(room.mediaIds || [])],
          updatedAt: Date.now()
        });
      });
      logActivity(`Exported ${flagged.length} inspection issue(s) to Maintenance list`);
      saveState();
      syncPropertyDossier(insp.propertyId);
      showToast(`Exported ${flagged.length} flagged room(s) to Maintenance & List.`);
    }

    function deleteInspection(inspId) {
      const existing = appState.inspections.find(i => i.id === inspId);
      if (!appState.deletedIds) appState.deletedIds = {};
      appState.deletedIds[inspId] = Date.now();
      appState.inspections = appState.inspections.filter(i => i.id !== inspId);
      saveState();
      if (existing) syncPropertyDossier(existing.propertyId);
      renderCurrentView();
      showToast('Inspection removed.');
    }

    /**
     * ==========================================================================
     * 10. VIEW 4: MAINTENANCE & SUPPLIES (Shopping-List Style Tracker)
     * ==========================================================================
     */
    function renderMaintenanceView() {
      const filter = appState.maintenanceFilter || 'all';
      const propOptions = appState.properties.length > 0
        ? appState.properties.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')
        : `<option value="general">General Portfolio</option>`;

      let list = [...appState.tasks];
      if (filter === 'open') list = list.filter(t => !t.completed);
      if (filter === 'urgent') list = list.filter(t => !t.completed && t.priority === 'Urgent');
      if (filter === 'completed') list = list.filter(t => t.completed);

      return `
        <div class="space-y-5">
          <!-- Shopping-List Style Quick Add Bar -->
          <form onsubmit="handleQuickAddTask(event)" class="m-surface p-4 rounded-2xl grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-center">
            <div class="sm:col-span-5">
              <input type="text" name="title" required placeholder="Add repair, hardware supply, or contractor task..." class="m-input" />
            </div>
            <div class="sm:col-span-3">
              <select name="propertyId" class="m-input">${propOptions}</select>
            </div>
            <div class="sm:col-span-2">
              <select name="priority" class="m-input">
                <option value="Normal">Normal</option>
                <option value="Urgent">Urgent</option>
                <option value="Low">Low</option>
              </select>
            </div>
            <div class="sm:col-span-2 flex gap-2">
              <input type="number" name="estimatedCost" step="0.01" min="0" placeholder="$ Est." class="m-input font-mono-num" />
              <button type="submit" class="btn-accent px-4 py-2 rounded-xl text-xs shrink-0 cursor-pointer">Add</button>
            </div>
          </form>

          <!-- Filter Pills -->
          <div class="flex flex-wrap gap-2">
            ${[
              { id: 'all', label: `All (${appState.tasks.length})` },
              { id: 'open', label: `Open (${appState.tasks.filter(t => !t.completed).length})` },
              { id: 'urgent', label: `Urgent (${appState.tasks.filter(t => !t.completed && t.priority === 'Urgent').length})` },
              { id: 'completed', label: `Completed (${appState.tasks.filter(t => t.completed).length})` }
            ].map(tab => `
              <button onclick="appState.maintenanceFilter='${tab.id}'; saveState(); renderCurrentView();" class="px-3.5 py-1.5 rounded-full text-xs font-semibold cursor-pointer ${filter === tab.id ? 'btn-accent' : 'btn-ghost'}">
                ${tab.label}
              </button>
            `).join('')}
          </div>

          <!-- Task & Supply Checklist -->
          <div class="m-surface rounded-2xl divide-y m-border overflow-hidden">
            ${list.length === 0 ? `
              <div class="p-8 text-center text-xs m-text-muted">No maintenance or supply items in this view.</div>
            ` : list.map(t => `
              <div class="p-4 sm:px-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="flex items-start gap-3">
                  <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTaskCompleted('${t.id}', this.checked)" class="mt-1 w-4 h-4 accent-[#00A7E1] cursor-pointer" />
                  <div>
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="font-semibold text-sm ${t.completed ? 'line-through m-text-muted' : ''}">${escapeHtml(t.title)}</span>
                      <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold ${t.priority === 'Urgent' ? 'pill-accent' : 'm-subtle m-text-muted'}">${escapeHtml(t.priority)}</span>
                      ${(t.mediaIds || []).length > 0 ? `<span class="text-[10px] font-mono-num m-text-muted">${t.mediaIds.length} media</span>` : ''}
                    </div>
                    <p class="text-xs m-text-muted mt-0.5">${escapeHtml(getPropertyName(t.propertyId))}${t.notes ? ' • ' + escapeHtml(t.notes) : ''}</p>
                  </div>
                </div>

                <div class="flex items-center gap-2 self-end sm:self-center">
                  <span class="font-mono-num text-xs font-bold mr-1">${formatCurrency(t.estimatedCost)}</span>
                  <button onclick="convertTaskToTaxExpense('${t.id}')" class="btn-ghost px-2.5 py-1.5 rounded-lg text-xs cursor-pointer">Log to Tax</button>
                  <button onclick="openTaskDetailModal('${t.id}')" class="btn-ghost px-2.5 py-1.5 rounded-lg text-xs cursor-pointer">Details</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function handleQuickAddTask(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const newTask = {
        id: 'tsk_' + Date.now(),
        propertyId: fd.get('propertyId'),
        title: fd.get('title').trim(),
        category: 'Maintenance & Supplies',
        priority: fd.get('priority'),
        estimatedCost: Number(fd.get('estimatedCost')) || 0,
        dueDate: new Date().toISOString().slice(0, 10),
        completed: false,
        notes: '',
        mediaIds: [],
        updatedAt: Date.now()
      };
      appState.tasks.unshift(newTask);
      logActivity(`Added list item: ${newTask.title}`);
      saveState();
      syncPropertyDossier(newTask.propertyId);
      renderCurrentView();
      showToast('Added to maintenance & supply list.');
    }

    function toggleTaskCompleted(taskId, completed) {
      const task = appState.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.completed = completed;
      task.updatedAt = Date.now();
      saveState();
      syncPropertyDossier(task.propertyId);
      renderCurrentView();
    }

    function openTaskDetailModal(taskId) {
      const task = appState.tasks.find(t => t.id === taskId);
      if (!task) return;
      let mediaIds = [...(task.mediaIds || [])];

      const propOptions = appState.properties.length > 0
        ? appState.properties.map(p => `<option value="${p.id}" ${p.id === task.propertyId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')
        : `<option value="general">General Portfolio</option>`;

      openModal(`
        <div class="px-6 py-4 border-b m-border flex items-center justify-between">
          <h3 class="font-bold text-base">Task &amp; Supply Details</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg btn-ghost flex items-center justify-center text-lg cursor-pointer">&times;</button>

        <form id="task-edit-form" class="p-6 space-y-4 text-sm">

            <label class="block text-xs font-semibold m-text-sec mb-1">Item / Task Title *</label>
            <input type="text" name="title" required value="${escapeHtml(task.title)}" class="m-input" />
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">

        if (!el) return;
        el.innerHTML = renderMediaDropzone({
          zoneId: `task-zone-${task.id}`,
          mediaIds,
          label: 'Before / After Photos, Voice Notes & Video',
          compact: true,
          onChange: (next) => {
            mediaIds = next;
            refreshDz();
          }
        });
      };
      refreshDz();

      document.getElementById('task-edit-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        task.title = fd.get('title').trim();
        task.propertyId = fd.get('propertyId');
        task.priority = fd.get('priority');
        task.estimatedCost = Number(fd.get('estimatedCost')) || 0;
        task.notes = fd.get('notes').trim();
        task.mediaIds = mediaIds;
        task.updatedAt = Date.now();
        saveState();
        syncPropertyDossier(task.propertyId);
        closeModal();
        renderCurrentView();
        showToast('Task updated.');
      };

    function deleteTask(taskId) {
      const existing = appState.tasks.find(t => t.id === taskId);
      if (!appState.deletedIds) appState.deletedIds = {};
      appState.deletedIds[taskId] = Date.now();
      appState.tasks = appState.tasks.filter(t => t.id !== taskId);
      saveState();
      if (existing) syncPropertyDossier(existing.propertyId);
      closeModal();
      renderCurrentView();
      showToast('Task deleted.');
    }

    function convertTaskToTaxExpense(taskId) {
      const task = appState.tasks.find(t => t.id === taskId);
      if (!task) return;
      openTransactionModal('Expense', {
        propertyId: task.propertyId,
        category: 'Repairs & Maintenance',
        description: task.title,
        amount: task.estimatedCost,
        mediaIds: [...(task.mediaIds || [])]
      });
    }

    /**
     * ==========================================================================
     * 11. VIEW 5: FINANCIALS & RENTAL TAX RETURNS
     * ==========================================================================
     */
    const TAX_EXPENSE_CATEGORIES = [
      'Repairs & Maintenance',
      'Council Rates & Water',
      'Landlord & Building Insurance',
      'Mortgage Interest & Bank Fees',
      'Property Management & Letting Fees',
      'Accounting, Legal & Compliance',
      'Utilities & Body Corporate',
      'Capital Improvements / Depreciation'
    ];

    function renderTaxView() {
      const period = appState.taxPeriodFilter || 'FY2026';
      const filteredTx = period === 'ALL'
        ? appState.transactions
        : appState.transactions.filter(t => t.taxPeriod === period);

      const grossIncome = filteredTx.filter(t => t.type === 'Income').reduce((s, t) => s + t.amount, 0);
      const totalDeductions = filteredTx.filter(t => t.type === 'Expense').reduce((s, t) => s + t.amount, 0);
      const netTaxable = grossIncome - totalDeductions;

      const byCategory = {};
      TAX_EXPENSE_CATEGORIES.forEach(cat => { byCategory[cat] = 0; });
      filteredTx.filter(t => t.type === 'Expense').forEach(tx => {
        byCategory[tx.category] = (byCategory[tx.category] || 0) + tx.amount;
      });

      return `
        <div class="space-y-5">
          <!-- Tax Year Selector & Export Actions -->

            <div class="flex flex-wrap items-center gap-2.5">
              <span class="text-xs font-bold uppercase tracking-wider m-text-muted">Tax Period:</span>
              <select onchange="appState.taxPeriodFilter=this.value; saveState(); renderCurrentView();" class="m-input !w-auto text-xs font-semibold">
                <option value="FY2026" ${period === 'FY2026' ? 'selected' : ''}>FY 2026–2027 (Current)</option>
                <option value="FY2025" ${period === 'FY2025' ? 'selected' : ''}>FY 2025–2026</option>
                <option value="CY2026" ${period === 'CY2026' ? 'selected' : ''}>Calendar Year 2026</option>
                <option value="ALL" ${period === 'ALL' ? 'selected' : ''}>All Recorded Periods</option>
              </select>
            </div>

            <div class="flex flex-wrap gap-2">
              <button onclick="openTransactionModal('Income')" class="btn-ghost px-3.5 py-2 rounded-xl text-xs cursor-pointer">+ Record Rental Income</button>
              <button onclick="openTransactionModal('Expense')" class="btn-ghost px-3.5 py-2 rounded-xl text-xs cursor-pointer">+ Record Deductible Expense</button>
              <button onclick="printTaxReturnPack('${period}')" class="btn-accent px-4 py-2 rounded-xl text-xs cursor-pointer">Export Tax Return Pack (Print / PDF)</button>
            </div>
          </div>

          <!-- Tax Return Summary Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="m-surface p-5 rounded-2xl">
              <span class="text-xs font-medium m-text-muted">Gross Assessable Rental Income</span>
              <span class="text-2xl font-bold font-mono-num block mt-2">${formatCurrency(grossIncome)}</span>
            </div>
            <div class="m-surface p-5 rounded-2xl">
              <span class="text-xs font-medium m-text-muted">Total Deductible Expenses</span>
              <span class="text-2xl font-bold font-mono-num block mt-2">${formatCurrency(totalDeductions)}</span>
            </div>
            <div class="m-surface p-5 rounded-2xl border-l-4" style="border-left-color: #00A7E1;">
              <span class="text-xs font-medium m-text-muted">Net Taxable Rental Income</span>
              <span class="text-2xl font-bold font-mono-num block mt-2" style="color: #00A7E1;">${formatCurrency(netTaxable)}</span>
            </div>
          </div>

          <!-- Deduction Breakdown & Ledger -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <!-- Schedule of Tax Deductions -->
            <div class="m-surface rounded-2xl overflow-hidden">
              <div class="px-5 py-4 border-b m-border">
                <h3 class="font-bold text-sm">Deductions by Tax Category</h3>
              </div>
              <div class="divide-y m-border text-xs">
                ${Object.entries(byCategory).map(([cat, amt]) => `
                  <div class="px-5 py-3 flex items-center justify-between gap-2">
                    <span class="m-text-sec">${escapeHtml(cat)}</span>
                    <span class="font-mono-num font-semibold">${formatCurrency(amt)}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Itemized Ledger with Pinned Receipts -->
            <div class="lg:col-span-2 m-surface rounded-2xl overflow-hidden">
              <div class="px-5 py-4 border-b m-border flex items-center justify-between">
                <h3 class="font-bold text-sm">Itemized Tax Ledger (${filteredTx.length})</h3>
                <span class="text-[11px] m-text-muted">Pin receipts to lock against Auto-Rollover</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr class="border-b m-border m-subtle m-text-muted">
                      <th class="py-3 px-4 font-semibold">Date</th>
                      <th class="py-3 px-4 font-semibold">Property &amp; Description</th>
                      <th class="py-3 px-4 font-semibold">Category</th>
                      <th class="py-3 px-4 font-semibold">Evidence</th>
                      <th class="py-3 px-4 font-semibold text-right">Amount</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y m-border">
                    ${filteredTx.length === 0 ? `
                      <tr><td colspan="5" class="py-8 text-center m-text-muted">No financial entries recorded for this tax period yet.</td></tr>
                    ` : filteredTx.map(tx => {
                      const receipts = (tx.mediaIds || []).map(id => MaalkiMediaStore.getMedia(id)).filter(Boolean);
                      return `
                        <tr>
                          <td class="py-3 px-4 font-mono-num whitespace-nowrap">${escapeHtml(tx.date)}</td>
                          <td class="py-3 px-4">
                            <span class="font-semibold block">${escapeHtml(tx.description)}</span>
                            <span class="text-[11px] m-text-muted">${escapeHtml(getPropertyName(tx.propertyId))}</span>

                          <td class="py-3 px-4">

                                    ${r.kind.toUpperCase()}

                                `).join('')}
                              </div>
                            ` : `<span class="m-text-muted">—</span>`}
                          </td>
                          <td class="py-3 px-4 font-mono-num font-bold text-right whitespace-nowrap" style="${tx.type === 'Income' ? 'color: #00A7E1;' : ''}">
                            ${tx.type === 'Income' ? '+' : '-'}${formatCurrency(tx.amount)}
                          </td>

                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;

        : `<option value="general">General Portfolio</option>`;

      openModal(`
        <div class="px-6 py-4 border-b m-border flex items-center justify-between">

          <button onclick="closeModal()" class="w-8 h-8 rounded-lg btn-ghost flex items-center justify-center text-lg cursor-pointer">&times;</button>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">

              <select name="type" id="tx-type-select" class="m-input">
                <option value="Income" ${defaultType === 'Income' ? 'selected' : ''}>Rental Income (+)</option>

              <label class="block text-xs font-semibold m-text-sec mb-1">Date *</label>

            </div>
            <div>
              <label class="block text-xs font-semibold m-text-sec mb-1">Tax Period</label>
              <select name="taxPeriod" class="m-input">
                <option value="FY2026">FY 2026–2027</option>
                <option value="FY2025">FY 2025–2026</option>
                <option value="CY2026">CY 2026</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold m-text-sec mb-1">Property</label>
              <select name="propertyId" class="m-input">${propOptions}</select>
            </div>
            <div>
              <label class="block text-xs font-semibold m-text-sec mb-1">Tax Category</label>

              <label class="block text-xs font-semibold m-text-sec mb-1">Description / Invoice Ref *</label>
              <input type="text" name="description" required value="${escapeHtml(prefill.description || '')}" placeholder="e.g. Council Rates Q2 / Plumbing Invoice #1042" class="m-input" />
            </div>
            <div>
              <label class="block text-xs font-semibold m-text-sec mb-1">Amount ($) *</label>
              <input type="number" name="amount" required min="0.01" step="0.01" value="${prefill.amount || ''}" class="m-input font-mono-num" />
            </div>
          </div>

          <div id="tx-receipt-dz"></div>

          <div class="pt-3 border-t m-border flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="btn-ghost px-4 py-2 rounded-xl text-xs cursor-pointer">Cancel</button>
            <button type="submit" class="btn-accent px-5 py-2 rounded-xl text-xs cursor-pointer">Save to Tax Ledger</button>
          </div>
        </form>
      `);

      const refreshDz = () => {
        const el = document.getElementById('tx-receipt-dz');
        if (!el) return;
        el.innerHTML = renderMediaDropzone({
          zoneId: 'tx-receipt-zone',
          mediaIds,
          label: 'Tax Receipt / Invoice Evidence (Auto-Pinned)',
          compact: true,
          onChange: async (next) => {
            for (const id of next) {
              const item = MaalkiMediaStore.getMedia(id);
              if (item && !item.pinned) await MaalkiMediaStore.togglePin(id);
            }
            mediaIds = next;
            refreshDz();
          }
        });
      };
      refreshDz();

      document.getElementById('tx-form').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const entry = {
          id: 'tx_' + Date.now(),
          date: fd.get('date'),
          propertyId: fd.get('propertyId'),
          type: fd.get('type'),
          category: fd.get('category'),
          description: fd.get('description').trim(),
          amount: Number(fd.get('amount')),
          taxPeriod: fd.get('taxPeriod'),
          mediaIds,
          updatedAt: Date.now()
        };
        appState.transactions.unshift(entry);
        logActivity(`Recorded ${entry.type}: ${entry.description} (${formatCurrency(entry.amount)})`);
        saveState();
        syncPropertyDossier(entry.propertyId);
        closeModal();
        renderCurrentView();
        showToast('Financial entry saved to tax ledger.');
      };
    }

          <h3 style="font-size: 13px; font-weight: 700; margin-bottom: 8px;">Itemized Income &amp; Expense Ledger</h3>
          <table style="width: 100%; border-collapse: collapse; font-size: 10.5px;">
            <thead>
              <tr style="background: #F5F6F8;">
                <th style="border: 1px solid #DFE2E8; padding: 6px; text-align: left;">Date</th>
                <th style="border: 1px solid #DFE2E8; padding: 6px; text-align: left;">Property</th>
                <th style="border: 1px solid #DFE2E8; padding: 6px; text-align: left;">Category</th>
                <th style="border: 1px solid #DFE2E8; padding: 6px; text-align: left;">Description</th>
                <th style="border: 1px solid #DFE2E8; padding: 6px; text-align: right;">Amount</th>
              </tr>
            </thead>
            <tbody>
              ${filteredTx.map(tx => `
                <tr>
                  <td style="border: 1px solid #DFE2E8; padding: 5px 6px;">${escapeHtml(tx.date)}</td>
                  <td style="border: 1px solid #DFE2E8; padding: 5px 6px;">${escapeHtml(getPropertyName(tx.propertyId))}</td>
                  <td style="border: 1px solid #DFE2E8; padding: 5px 6px;">${escapeHtml(tx.category)}</td>
                  <td style="border: 1px solid #DFE2E8; padding: 5px 6px;">${escapeHtml(tx.description)}</td>
                  <td style="border: 1px solid #DFE2E8; padding: 5px 6px; text-align: right; font-weight: 600;">${tx.type === 'Income' ? '+' : '-'}${formatCurrency(tx.amount)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `);
    }

    function printPropertyProfile(propertyId) {
      const p = appState.properties.find(item => item.id === propertyId);
      if (!p) return;
      const cover = p.coverPhotoId ? MaalkiMediaStore.getMedia(p.coverPhotoId) : null;

      triggerA4Print(`
        <div style="font-family: Inter, sans-serif; color: #111315;">
          <div style="border-bottom: 2px solid #00A7E1; padding-bottom: 12px; margin-bottom: 16px;">
            <div style="font-size: 11px; font-weight: 700; color: #00A7E1; text-transform: uppercase;">Maalki Property &amp; Tenancy Profile</div>
            <h1 style="font-size: 20px; font-weight: 700; margin: 4px 0 0;">${escapeHtml(p.name)}</h1>
            <div style="font-size: 12px; color: #525866; margin-top: 2px;">${escapeHtml(p.address)}</div>
          </div>
          ${cover ? `<img src="${cover.dataUrl}" style="width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 16px;" />` : ''}
          <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
            <tr><td style="border: 1px solid #DFE2E8; padding: 8px; font-weight: 600;">Status</td><td style="border: 1px solid #DFE2E8; padding: 8px;">${escapeHtml(p.status)}</td></tr>
            <tr><td style="border: 1px solid #DFE2E8; padding: 8px; font-weight: 600;">Configuration</td><td style="border: 1px solid #DFE2E8; padding: 8px;">${escapeHtml(p.propertyType)} • ${p.bedrooms} Bedrooms • ${p.bathrooms} Bathrooms</td></tr>
            <tr><td style="border: 1px solid #DFE2E8; padding: 8px; font-weight: 600;">Tenant</td><td style="border: 1px solid #DFE2E8; padding: 8px;">${escapeHtml(p.tenantName || 'Vacant')} (${escapeHtml(p.tenantPhone || '—')})</td></tr>
            <tr><td style="border: 1px solid #DFE2E8; padding: 8px; font-weight: 600;">Rent &amp; Frequency</td><td style="border: 1px solid #DFE2E8; padding: 8px;">${formatCurrency(p.rentAmount)} (${escapeHtml(p.rentFrequency)})</td></tr>
            <tr><td style="border: 1px solid #DFE2E8; padding: 8px; font-weight: 600;">Lease End Date</td><td style="border: 1px solid #DFE2E8; padding: 8px;">${escapeHtml(p.leaseEnd || 'Periodic / Open')}</td></tr>
            <tr><td style="border: 1px solid #DFE2E8; padding: 8px; font-weight: 600;">Bond Held</td><td style="border: 1px solid #DFE2E8; padding: 8px;">${formatCurrency(p.bondAmount)}</td></tr>
            <tr><td style="border: 1px solid #DFE2E8; padding: 8px; font-weight: 600;">Property Notes</td><td style="border: 1px solid #DFE2E8; padding: 8px;">${escapeHtml(p.notes || '—')}</td></tr>
          </table>
        </div>
      `);
    }

    function openStorageSettingsModal() {
      const st = MaalkiMediaStore.getStats();
      const dossiers = MaalkiMediaStore.getAllDossiers();

      openModal(`
        <div class="px-6 py-4 border-b m-border flex items-center justify-between">
          <div>
            <h3 class="font-bold text-base">Unified Auto-Rollover Repository</h3>
            <p class="text-xs m-text-muted mt-0.5">Single IndexedDB pool for Photos, Audio, Videos &amp; Property Dossier Files</p>
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg btn-ghost flex items-center justify-center text-lg cursor-pointer">&times;</button>
        </div>

        <div class="p-6 space-y-5 text-sm">
          <div class="p-4 rounded-2xl m-subtle space-y-2.5">
            <div class="flex items-center justify-between text-xs font-mono-num">
              <span>Used: <strong>${st.usedMB} MB</strong> / ${st.maxMB} MB (${st.pct}%)</span>
              <span style="color: #00A7E1;">FIFO Auto-Rollover: ON</span>
            </div>
            <div class="w-full h-2 rounded-full bg-neutral-300 dark:bg-neutral-700 overflow-hidden">
              <div class="h-full rounded-full" style="width: ${Math.max(4, st.pct)}%; background-color: #00A7E1;"></div>
            </div>
            <div class="text-[11px] m-text-muted font-mono-num">
              ${st.photoCount} Photos • ${st.audioCount} Audio • ${st.videoCount} Videos • ${st.dossierCount} Property Dossiers (${st.archivedDossierCount} Archived)
            </div>
          </div>

          <div class="space-y-2">
            <label class="block text-xs font-bold uppercase tracking-wider m-text-muted">Auto-Rollover Pool Limit</label>
            <div class="grid grid-cols-4 gap-2">
              ${[25, 50, 100, 250].map(mb => `
                <button type="button" onclick="MaalkiMediaStore.setLimitMB(${mb}); openStorageSettingsModal();" class="py-2 rounded-xl text-xs font-mono-num font-semibold cursor-pointer ${st.maxMB === mb ? 'btn-accent' : 'btn-ghost'}">
                  ${mb} MB
                </button>
              `).join('')}
            </div>
          </div>

          ${dossiers.length > 0 ? `
            <div class="space-y-2 border-t m-border pt-4">
              <h4 class="text-xs font-bold uppercase tracking-wider m-text-muted">Stored Property Dossier Files (${dossiers.length})</h4>
              <div class="max-h-36 overflow-y-auto divide-y m-border rounded-xl border m-border text-xs">
                ${dossiers.map(d => `
                  <div class="px-3.5 py-2 flex items-center justify-between">
                    <span class="font-mono-num">${escapeHtml(d.fileName)}.json — ${escapeHtml(d.property?.name || 'Property')}</span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full ${d.archived ? 'pill-accent' : 'm-subtle m-text-muted'}">${d.archived ? 'Archived' : 'Active'}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <div class="space-y-2 border-t m-border pt-4">
            <h4 class="text-xs font-bold uppercase tracking-wider m-text-muted">Full Portfolio &amp; Unified Media Backup (JSON)</h4>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="exportFullBackupJson()" class="btn-accent px-4 py-2 rounded-xl text-xs cursor-pointer">Export Unified Backup</button>
              <label class="btn-ghost px-4 py-2 rounded-xl text-xs cursor-pointer">
                Import Unified Backup
                <input type="file" accept="application/json" class="hidden" onchange="importFullBackupJson(this.files[0])" />
              </label>
            </div>
          </div>
        </div>
      `);
    }

    function exportFullBackupJson() {
      const repoExport = MaalkiMediaStore.exportAll();
      const payload = {
        app: 'Maalki',
        exportedAt: new Date().toISOString(),
        state: appState,
        users: MaalkiAuth.loadLocalUsers(),
        mediaItems: repoExport.mediaItems,
        propertyDossiers: repoExport.propertyDossiers
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `maalki-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Unified JSON backup downloaded.');
    }

    function importFullBackupJson(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.state) {
            appState = { ...createCleanSlateState(), ...parsed.state };
            saveState();
          }
          if (Array.isArray(parsed.users)) {
            MaalkiAuth.mergeRemoteUsers(parsed.users);
          }
          if (Array.isArray(parsed.mediaItems)) {
            await MaalkiMediaStore.importAll(parsed.mediaItems);
          }
          if (Array.isArray(parsed.propertyDossiers)) {
            for (const d of parsed.propertyDossiers) {
              await MaalkiMediaStore.importDossierDirect(d);
            }
          }
          closeModal();
          renderCurrentView();
          showToast('Unified backup imported successfully.');
        } catch (err) {
          showToast('Invalid JSON backup file.');
        }
      };
      reader.readAsText(file);
    }

    /**
     * ==========================================================================
     * 13. BOOTSTRAP & EVENT LISTENERS
     * ==========================================================================
     */
    document.addEventListener('DOMContentLoaded', async () => {
      loadState();
      await MaalkiMediaStore.init();

      const loginForm = document.getElementById('device-login-form');
      if (loginForm) {
        loginForm.onsubmit = async (e) => {
          e.preventDefault();
          const errBox = document.getElementById('login-error-box');
          const submitBtn = document.getElementById('login-submit-btn');
          if (errBox) errBox.classList.add('hidden');

          const newFieldsVisible = !document.getElementById('login-new-user-fields')?.classList.contains('hidden');
          const firstName = document.getElementById('login-first-name')?.value.trim() || '';
          const lastName = document.getElementById('login-last-name')?.value.trim() || '';
          const passphrase = document.getElementById('login-passphrase')?.value || '';

          try {
            if (submitBtn) {
              submitBtn.disabled = true;
              submitBtn.textContent = 'Unlocking & Syncing Vault...';
            }
            await MaalkiAuth.completeLogin({
              firstName,
              lastName,
              existingUserId: newFieldsVisible ? '' : (MaalkiAuth.getSelectedExistingUserId() || MaalkiAuth.getActiveUser()?.id || 'usr_tejveer_randhawa'),
              passphrase
            });
          } catch (err) {
            if (errBox) {
              errBox.textContent = err.message || 'Could not unlock device vault.';
              errBox.classList.remove('hidden');
            }
          } finally {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Login & Unlock Device';
            }
          }
        };
      }

      navigateTo(appState.currentView || 'dashboard');
      await MaalkiAuth.bootAuth();
    });
  </script>
</body>
</html>
